# AutoModel trainer — MiniMax-H3 full fine-tuning on synthetic data.
#
# Standalone rather than `extends: pre_trainer.yaml` on purpose: that file defaults
# to the cached video dataloader, and `extends` deep-merges, so overriding
# `data.dataloader` would leave its `cache_dir`, `model_type`, `base_resolution` and
# `dynamic_batch_size` keys behind for the synthetic builder to choke on.
#
# MiniMax-H3 trains at micro-batch 1: the batch shares one packed layout and one
# timestep table. Raise global_batch_size for gradient accumulation, not
# local_batch_size.
extends:
  - ../module_base.yaml
seed: 42
wandb:
  enable: false
dist_env:
  backend: nccl
  timeout_minutes: 30
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  num_epochs: 100
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
data:
  dataloader:
    _target_: primus.backends.automodel.models.minimax_h3.data.synthetic.SyntheticMiniMaxH3DataloaderConfig
    num_samples: 64
    # HEIGHTxWIDTHxFRAMES, comma separated, cycled by sample index. 768x1344 is the
    # model's default canvas; 124 frames is 5.2 s (the shortest clip), 243 is 10 s.
    buckets: "768x1344x124"
    text_tokens: 256
    text_dim: 5120
    shuffle: true
    drop_last: true
    num_workers: 2
    pin_memory: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  foreach: false
  fused: true
clip_grad_norm:
  max_norm: 1.0
performance:
  # Synthetic inputs are random noise, so the loss value is meaningless in absolute
  # terms and the NaN guard would only cost a device sync per step.
  check_loss: false
  grad_clip_foreach: true
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1.0e-6
flow_matching:
  adapter_type: minimax_h3
  adapter_kwargs:
    audio_loss_weight: 1.0
    # The inference schedules: shift 12 for video, 3 for audio. AutoModel's own
    # flow_shift below must equal video_flow_shift, because the adapter recovers the
    # unshifted noise level from it to derive the audio one.
    video_flow_shift: 12.0
    audio_flow_shift: 3.0
    audio_sigma: derived
  timestep_sampling: uniform
  flow_shift: 12.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  # The released model is guidance-distilled, so there is no unconditional branch.
  cfg_dropout_prob: 0.0
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10
# Attention is about 60% of the step at full size. This routes diffusers' `flash`
# backend to Primus-Turbo's flash_attn_func (AITER's gfx950 kernels) with a
# non-deterministic backward: 20.4 -> 17.0 s per step on 8x MI355X at full size.
# Run it with FP32 dq atomics (PRIMUS_TURBO_ATTN_V3_ATOMIC_FP32=1, set by the
# example experiments' `env:`): Primus's MI355X default of 0 accumulates dq in BF16,
# which is faster (15.5 s) but gives dq a 1.5e-2 relative error against SDPA,
# against 1.5e-4 with FP32 atomics. Same choice as Primus's own diffusion-backend
# Wan (AITER, non-deterministic, FP32 atomics).
primus_turbo:
  nondeterministic_attention: true
fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  defer_fsdp_grad_sync: true
  # ZeRO-3 for bring-up (least memory). Measure ZeRO-2 (`false`) once the model fits;
  # it keeps the gathered bf16 blocks through backward, about one parameter copy
  # (66 GB at full size) more.
  reshard_after_forward: true
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2
  reduce_dtype: bfloat16
  # Per-block torch.compile (in place, inside the whole-block checkpoint wrappers): fuses
  # the element-wise work around attention and the GEMMs. Full size, 8x MI355X, 5.2 s:
  # full fine-tuning 16.6 -> 15.1 s per step (-9%), LoRA 15.4 -> 15.2 s; the first step
  # pays ~13 s to compile. Over 60 steps the loss tracks the eager run (mean relative
  # difference 3.6e-4, same mean over the last 20 steps).
  enable_compile: true
  activation_checkpointing: true
checkpoint:
  enabled: false
  # Not optional even with `enabled: false`: the recipe's setup() calls
  # os.makedirs() on this before it consults `enabled`, so "" aborts the run.
  checkpoint_dir: /checkpoints/minimax_h3_sft
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null
