# AutoModel pre_trainer module config (Primus backend: automodel).
#
# This is the AutoModel recipe schema (model:/fsdp:/optimizer:/step_scheduler:/...);
# the Primus launcher deep-merges the `model:` preset and the EXP `overrides:`
# on top of it, then the automodel backend materialises the whole tree into
# an AutoModel ConfigNode and runs TrainDiffusionRecipe. The defaults below are
# the optimized pretrain knobs: torch.compile + bf16 reduce + fused AdamW. The
# attention backend is the model preset's choice.
#
# NOTE: do not declare a `model:` block here — it comes from the model preset
# (merge is allow_override=False and would conflict).
extends:
  - ../module_base.yaml

seed: 42

wandb:
  enable: false

# AutoModel's own MLflow settings, consumed by RecipeConfig.mlflow. This block
# must reach AutoModel, so it is deliberately not a `primus_` section, and it
# must hold only MLflowConfig fields (experiment_name, run_name, tracking_uri,
# artifact_location, tags, resume, description, flatten_depth) -- an unknown key
# here raises TypeError when the typed config is built.
#
# Inert on its own: the diffusion recipe never calls cfg.mlflow.build(), so
# nothing is tracked until primus_mlflow.enable turns the patch on.
#
# tracking_uri null means "use MLFLOW_TRACKING_URI, else ./mlruns", which is
# what keeps credentials out of this file -- the dev container resolves a
# Databricks profile from a mounted config, never a token in a config or an
# environment variable.
mlflow:
  # Resolves from PRIMUS_MLFLOW_EXPERIMENT, falling back to a plain name that
  # works against any tracking server. On Databricks the value must be an
  # absolute workspace path that does not collide with an existing directory --
  # directories and experiments share one namespace there.
  experiment_name: ${PRIMUS_MLFLOW_EXPERIMENT:automodel-diffusion}
  run_name: ""
  tracking_uri: null
  artifact_location: null
  tags: {}
  # false, against upstream's default of true. build() reads a `mlflow_run_id`
  # sidecar from checkpoint.checkpoint_dir, which exists even with
  # checkpoint.enabled: false because setup() makedirs it first. Left on, the
  # second run of this config resumes the first instead of starting a new one,
  # and log_params is skipped on the resumed path -- so repeat runs would share
  # one run and only the first run's inputs would ever be recorded.
  resume: false
  description: null
  flatten_depth: 1

# Primus-side MLflow knobs. Stripped before the config reaches AutoModel.
primus_mlflow:
  # Off by default: adding this file must not make Primus runs start talking to
  # a tracking server. Our own runs turn it on through the shared launch
  # settings, not by changing this default.
  enable: false
  # Per-step metrics stay off until an A/B shows median step time within 0.5%.
  # Upstream's to_float_metrics() calls .item() on tensors, which forces
  # a GPU sync, and the Megatron path's GPU-utilisation collection adds an
  # all_gather every log interval -- both are exactly the cost being measured.
  # Cadence, when enabled, is step_scheduler.log_remote_every_steps.
  per_step: false
  # Extra environment variable names to log, on top of the built-in allow-list
  # in mlflow_patches.py. Names only; values are still entropy-checked.
  env_allowlist_extra: []
  # End-of-run artifacts. All uploaded after the train loop returns, so none of
  # this is inside the timed region and none of it can move a step-time number.
  # Off by default because artifacts cost storage on a shared tracking server;
  # turn them on for a run whose evidence someone will actually read.
  upload_logs: false
  upload_traces: false
  # TraceLens reports. Requires TraceLens in the image -- unlike the Megatron
  # path this never pip-installs at run time, because a job that reaches for
  # the network during teardown is a job that hangs during teardown.
  upload_tracelens_report: false
  tracelens_output_format: csv          # xlsx or csv
  # Which ranks' traces to upload and analyse. null means every rank, which on
  # a multinode run is a lot of gigabytes; [0] is the usual choice.
  tracelens_ranks: [0]
  # Total upload budget per category. Smallest files are kept first, so one
  # enormous trace cannot starve every other rank, and whatever is dropped is
  # logged rather than silently omitted. 0 disables the cap.
  upload_max_bytes: 2147483648           # 2 GiB
  # Median step time, median samples/s/GPU and peak memory, logged as perf/*
  # metrics. Derived by parsing the run's own log after it finishes -- the same
  # source auto_benchmark reads -- so it adds no per-step cost and cannot
  # perturb what it measures. Cheap enough to leave on.
  summary: true
  # Name shown in the experiment's Models column.
  logged_model_name: Wan

dist_env:
  backend: nccl
  timeout_minutes: 30

step_scheduler:
  global_batch_size: 256
  local_batch_size: 32
  ckpt_every_steps: 1000
  num_epochs: 100
  log_remote_every_steps: 2
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_video_multiresolution_dataloader
    cache_dir: /dataset
    model_type: wan
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false
    num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  # fused AdamW (mutually exclusive with foreach).
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: simple
  adapter_kwargs: {}
  timestep_sampling: uniform
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 3.0
  mix_uniform_ratio: 0.1
  num_train_timesteps: 1000
  i2v_prob: 0.3
  use_loss_weighting: true
  log_interval: 100
  summary_log_interval: 10

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  # dp_size is intentionally left unset: AutoModel derives it from the runtime
  # world size and the parallel dims (dp = world_size / (tp*cp*pp)), so single-
  # and multi-node runs work without edits. Pin `dp_size: <n>` only to force a
  # specific value.
  defer_fsdp_grad_sync: true
  enable_fsdp2_prefetch: true
  # Optimized knobs:
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2
  reduce_dtype: bfloat16
  enable_compile: true
  # Keep AC on for bs>8; flip false via overrides for the bs6-8 AC-off point.
  activation_checkpointing: true

checkpoint:
  enabled: false
  checkpoint_dir: /checkpoints/wan22_primus_pretrain
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null
