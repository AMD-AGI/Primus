# AutoModel pre_trainer module config — FLUX.1 T2I pretrain on SYNTHETIC data
# (Primus backend: automodel).
#
# Sibling of `flux_pre_trainer.yaml`, which reads a pre-encoded cache. This one
# swaps `data.dataloader` for an in-process generator, so a run needs no dataset
# on disk and is not bound by the input pipeline. Everything else is held
# identical to the real-data config on purpose: comparing the two is only
# meaningful if they differ in the loader and nothing else.
#
# WHY THIS IS A SEPARATE FILE rather than an EXP-level override of
# flux_pre_trainer.yaml. The launcher DEEP-MERGES the EXP `overrides:` onto the
# module config, so overriding `data.dataloader._target_` alone would leave the
# real loader's keys (cache_dir, base_resolution, train_text_encoder,
# dynamic_batch_size) sitting in the block. The recipe validates the merged keys
# against the target dataclass's fields and raises TypeError on an unknown one, so
# the run would die at dataloader construction.
extends:
  - ../module_base.yaml

seed: 42

wandb:
  enable: false

# AutoModel's own MLflow settings, consumed by RecipeConfig.mlflow. This block
# must reach AutoModel, so it is deliberately not a `primus_` section, and it
# must hold only MLflowConfig fields (experiment_name, run_name, tracking_uri,
# artifact_location, tags, resume, description, flatten_depth) -- an unknown key
# here raises TypeError, because the RecipeConfig.mlflow property builds the
# dataclass with **kwargs.
#
# Inert on its own: the diffusion recipe never calls cfg.mlflow.build(), so
# nothing is tracked until primus_mlflow.enable turns the patch on -- which our
# shared launch settings do, not this file. No `primus_mlflow:` block is needed
# here: options.get returns its default for a missing section, so absence
# already means disabled.
#
# tracking_uri null means "use MLFLOW_TRACKING_URI, else ./mlruns", which keeps
# credentials out of this file: the container resolves a Databricks profile from
# a read-only mount, never a token.
#
# experiment_name resolves from PRIMUS_MLFLOW_EXPERIMENT, falling back to a
# plain name that works against any tracking server. Set the variable to route
# runs somewhere specific, the same way PRIMUS_EXP_NAME and PRIMUS_WORKSPACE
# work in the EXP configs.
#
# On Databricks the value must be an absolute workspace path, and it must NOT
# collide with an existing directory: workspace directories and MLflow
# experiments share one namespace, so creating an experiment where a directory
# already sits fails with BAD_REQUEST.
mlflow:
  experiment_name: ${PRIMUS_MLFLOW_EXPERIMENT:automodel-diffusion}
  run_name: ""
  tracking_uri: null
  artifact_location: null
  tags: {}
  # false, against upstream's default of true. build() reads a `mlflow_run_id`
  # sidecar from checkpoint.checkpoint_dir, which exists even with
  # checkpoint.enabled: false because setup() makedirs it first. Left on, the
  # second run of this config resumes the first instead of starting a new one,
  # and log_params is skipped on the resumed path -- so repeat runs would share
  # one run and only the first run's inputs would ever be recorded.
  resume: false
  description: null
  flatten_depth: 1

dist_env:
  backend: nccl
  timeout_minutes: 30

step_scheduler:
  global_batch_size: 32
  local_batch_size: 4
  ckpt_every_steps: 1000
  num_epochs: 1000
  log_remote_every_steps: 2
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: primus.backends.automodel.models.flux.data.synthetic.SyntheticFluxDataloaderConfig
    # Defaults describe 1024**2. latent_h/latent_w are res/8 (the VAE latent), NOT
    # the res/16 token grid: the model packs 2x2, so 128 here means a 64x64 grid
    # and 4096 image tokens. Override both for another resolution.
    num_samples: 2048
    in_channels: 16
    latent_h: 128
    latent_w: 128
    # The T5 cap. The real cache pads EVERY caption to exactly this and truncates
    # over-long ones, so a synthetic run must match it to be comparable. There is
    # no ragged text region to model here: FLUX's joint attention is dense and the
    # processor encodes pad positions without a mask, so the caption-length
    # distribution does not change the work done.
    text_seq_len: 512
    t5_features_dim: 4096
    pooled_dim: 768
    feature_scale: 0.1
    latent_scale: 1.0
    seed: 1234
    # Match the dtypes the upstream FLUX processor writes, so a comparison against
    # the real cache is a comparison of the model rather than of a cast.
    latent_dtype: float16
    text_dtype: bfloat16
    shuffle: true
    # Keep the batch size constant so torch.compile sees one shape and does not
    # recompile on a short final batch.
    drop_last: true
    num_workers: 2
    pin_memory: true
    # Generates the [512, 4096] T5 buffer once instead of per sample; generating it
    # per sample otherwise dominates the micro-batch on the CPU side and the run
    # ends up measuring the dataloader. Never set for a convergence run.
    share_text_features: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: flux
  adapter_kwargs:
    # guidance_scale 1 for pretraining. use_guidance_embeds must match the
    # transformer's guidance_embeds: true for FLUX.1-dev, false for FLUX.1-schnell,
    # which has no guidance layer. Honoured via the automodel.models.flux.guidance
    # patch; a mismatch fails at step 0 naming this key.
    guidance_scale: 1
    use_guidance_embeds: true
  timestep_sampling: uniform
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 1.0
  mix_uniform_ratio: 0.1
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  defer_fsdp_grad_sync: true
  # ZeRO-2; `true` for ZeRO-3.
  reshard_after_forward: false
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2
  reduce_dtype: bfloat16
  enable_compile: true
  # Both FLUX block lists (see flux_pre_trainer.yaml).
  activation_checkpointing: true

checkpoint:
  enabled: false
  # Not optional even with `enabled: false`: the recipe's setup() calls
  # os.makedirs() on this before it consults `enabled`, so "" aborts the run.
  checkpoint_dir: /checkpoints/flux1_synthetic_pretrain
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null
