# NeMo AutoModel pre_trainer — Wan 2.2 perf-ladder (real PusaV1 cache).
extends:
  - ../module_base.yaml

seed: 42

wandb:
  enable: false

dist_env:
  backend: nccl
  timeout_minutes: 30

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  num_epochs: 100
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_video_multiresolution_dataloader
    cache_dir: /dataset/pusa_wan_512sq_81f
    model_type: wan
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false
    num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: simple
  adapter_kwargs: {}
  timestep_sampling: uniform
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 3.0
  mix_uniform_ratio: 0.1
  num_train_timesteps: 1000
  i2v_prob: 0.3
  use_loss_weighting: true
  log_interval: 100
  summary_log_interval: 10

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  defer_fsdp_grad_sync: true
  reshard_after_forward: false
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2
  reduce_dtype: bfloat16
  enable_compile: false
  activation_checkpointing: true

checkpoint:
  enabled: false
  checkpoint_dir: /checkpoints/wan22_perfladder_real
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null
