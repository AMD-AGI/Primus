# NeMo AutoModel pre_trainer module config — FLUX.1 T2I rectified-flow pretrain
# (Primus backend: nemo_automodel).
#
# Sibling of `pre_trainer.yaml` (the Wan 2.2 video preset). Same recipe schema and
# the same knobs (torch.compile, bf16 grad-reduce, deep prefetch, fused AdamW),
# but wired for FLUX text-to-IMAGE:
#   - data.dataloader -> build_text_to_image_multiresolution_dataloader
#     (the image loader takes NO `model_type`, unlike the video loader).
#   - flow_matching.adapter_type -> flux (guidance-embed conditioning).
#
# The Primus launcher deep-merges the `model:` preset (flux_1_dev.yaml) and the
# EXP `overrides:` on top of this, then runs TrainDiffusionRecipe.
#
# NOTE: do not declare a `model:` block here — it comes from the model preset.
extends:
  - ../module_base.yaml

seed: 42

wandb:
  enable: false

dist_env:
  backend: nccl
  timeout_minutes: 30

step_scheduler:
  global_batch_size: 32
  local_batch_size: 4
  ckpt_every_steps: 1000
  num_epochs: 1000
  log_remote_every_steps: 2
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_text_to_image_multiresolution_dataloader
    # Placeholder: set this in the EXP config or on the command line.
    cache_dir: /path/to/flux_cache
    train_text_encoder: false
    # Supported cache resolutions: [256,256], [512,512], [1024,1024]. The cache
    # must have been built at the resolution named here.
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false
    num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  # fused AdamW (mutually exclusive with foreach).
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: flux
  adapter_kwargs:
    # Critical: guidance_scale 1 for pretraining. The FLUX adapter ALWAYS passes a
    # guidance tensor, so a transformer with guidance_embeds=true is required.
    # Set use_guidance_embeds: false for schnell, which has no such layer.
    guidance_scale: 1
    use_guidance_embeds: true
  timestep_sampling: uniform
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 1.0
  mix_uniform_ratio: 0.1
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  # Critical: use_loss_weighting must be false for pretraining.
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  # dp_size intentionally unset: AutoModel derives it from world size and the
  # parallel dims. Pin `dp_size: <n>` via overrides only to force a value.
  defer_fsdp_grad_sync: true
  # ZeRO-2: blocks keep their gathered params through backward (one all-gather per
  # block per step instead of two) at the cost of roughly one parameter copy of
  # memory. Set `true` for ZeRO-3, or remove the key to use AutoModel's per-layer
  # heuristic. Honored only with PRIMUS_FLUX_REAL_AC=1 and the FSDP2 reshard repair
  # applied; without both, AutoModel drops the value.
  reshard_after_forward: false
  # NOTE: inert while reshard_after_forward is false (no backward all-gather to prefetch).
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2
  reduce_dtype: bfloat16
  enable_compile: true
  # A silent no-op unless PRIMUS_FLUX_REAL_AC=1: FluxTransformer2DModel is not in
  # AutoModel's strategy registry, so the default strategy looks for `self_attn`
  # and `mlp` submodules that a FLUX block does not have.
  activation_checkpointing: true

checkpoint:
  enabled: false
  # Not optional even with `enabled: false`: the recipe's setup() calls
  # os.makedirs() on this before it consults `enabled`, so "" aborts the run.
  checkpoint_dir: /checkpoints/flux1_pretrain
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null
