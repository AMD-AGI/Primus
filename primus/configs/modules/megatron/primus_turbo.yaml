# ===== Global =====
# main control flag
enable_primus_turbo: false

# ===== AutoTune =====
# enable turbo auto-tuning
use_turbo_autotune: false

# ===== Primus-Turbo Backend Selection =====
# Format:
#   1. Use default backend: turbo_gemm_backend=default
#   2. All precisions use the same backend: turbo_gemm_backend=triton
#   3. Each precision uses a different backend: turbo_gemm_backend=fp4:aiter,fp8:triton,other:hipblaslt

# backend for turbo gemm.
turbo_gemm_backend: default
# backend for turbo grouped gemm.
turbo_grouped_gemm_backend: default

# ===== MXFP4 =====
# Use stochastic rounding when quantizing MXFP4 gradients. This is disabled by
# default and requires a Primus-Turbo grouped GEMM implementation with matching
# activation and gradient layouts.
mxfp4_gradient_stochastic_rounding: false

# ===== Attention =====
# operator switch
use_turbo_attention: false
# sink attention settings (PR 208) - GPT-OSS style learned sinks
# reference: gpt-oss/gpt_oss/triton/attention.py
use_sink_attention: false
# sliding window size for sink attention (gpt-oss uses 128)
sink_sliding_window: 0
# apply sliding window only to even layers (gpt-oss pattern)
sink_window_even_layers_only: true
# attention float8 path
enable_turbo_attention_float8: false
# Route Turbo attention through the flex_attention compat layer instead of calling
# flash_attn_func directly. Requires use_turbo_attention: true; on its own it does
# nothing (and is rejected at model-build time rather than silently ignored).
# The compat layer takes a torch-FlexAttention block_mask/score_mod, classifies it and
# dispatches the recognised patterns onto the same Turbo kernels -- so with the default
# causal configuration this is numerically identical to the direct call. What it adds is
# the ability to express masks/score modifications that flash_attn_func has no argument
# for. Not supported with context_parallel_size > 1, enable_turbo_attention_float8,
# deterministic_mode, or packed (THD) sequences.
use_turbo_flex_attention: false
# Optional 'package.module:attribute' path to a mask_mod callable
# (b, h, q_idx, kv_idx) -> bool, used to build the BlockMask instead of the mask implied
# by attn_mask_type/window_size. Only read when use_turbo_flex_attention is on.
turbo_flex_attention_mask_mod: null
# Optional 'package.module:attribute' path to a score_mod callable
# (score, b, h, q_idx, kv_idx) -> score, applied to the pre-softmax logits.
# Only read when use_turbo_flex_attention is on.
turbo_flex_attention_score_mod: null

# ===== Parallel Linear =====
# operator switch
# use turbo gemm
use_turbo_gemm: false

# ===== Grouped MLP =====
# use turbo grouped gemm
use_turbo_grouped_gemm: false
# let Turbo grouped GEMMs consume non-aligned expert token counts directly,
# without TE Fp8Padding/Fp8Unpadding
turbo_grouped_gemm_without_padding: false
# fused activation_with_probs to reduce redundant computation
use_turbo_fused_act_with_probs: false

# ===== MoE Router =====
moe_use_fused_router_with_aux_score: false

# ===== DeepEP =====
# operator switch
use_turbo_deepep: false
turbo_deepep_num_cu: 32
turbo_deepep_use_comm_stream: false

# ===== Sync-Free MoE =====
turbo_sync_free_moe_stage: 0

# ===== Mega MoE =====
# fused MegaMoE layer replacement (EP-only/TP=1/bf16)
use_turbo_mega_moe: false
# precision of the MegaMoE experts: bf16 | mxfp8. Only read when use_turbo_mega_moe is on.
# Independent of Megatron's --fp8, which drives the TE fp8 recipe for the dense layers and has no
# path to this fused op, so the MoE can be A/B'd on its own. Parameters stay bf16 either way.
# The op keeps an internal mxfp8 weight cache and the fp8 path advances a separate generation counter
# at the optimizer-step boundary to invalidate it (the optimizer may not bump w._version).
turbo_mega_moe_precision: bf16

# ===== Layer Norm =====
# operator switch
use_turbo_rms_norm: false
# Route the fused layernorm+QKV site through Turbo's rmsnorm while leaving its
# GEMM on Transformer Engine. use_turbo_gemm moves that GEMM to Turbo as well,
# which costs more than the norm saves on the GPT-OSS-20B shapes.
use_turbo_norm_te_linear: false
