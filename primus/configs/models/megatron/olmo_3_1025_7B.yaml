extends:
  - language_model.yaml

# allenai/Olmo-3-1025-7B -- OLMo-3 (HF model_type: olmo3). Dispatched to primus/backends/megatron/core/models/olmo3.
model_type: olmo3

# post-norm decoder (post_attention / post_feedforward RMSNorm), full-width QK-norm,
# SwiGLU, no biases, untied embeddings
normalization: RMSNorm
layernorm_epsilon: 1.0e-06   # the RMSNorm eps the OLMo-3 model reads
# norm_epsilon is not read by the olmo3 model. It overrides language_model.yaml's 1e-5 so the two
# keys agree; the OLMo-3 checks (check_olmo3_norm_epsilon) refuse a run where they differ, so an
# override of only one of them is an error, not a silent no-op.
norm_epsilon: 1.0e-06
swiglu: true
add_bias_linear: false
add_qkv_bias: false
untie_embeddings_and_output_weights: true
# the q/k norms are full-width (owned by Olmo3SelfAttention), not upstream per-head ones
qk_layernorm: false
multi_latent_attention: false
hidden_dropout: 0.0
attention_dropout: 0.0
attention_softmax_in_fp32: true
init_method_std: 0.02

# RoPE on sliding-window layers, YaRN (factor 8, original 8192) on full-attention layers
position_embedding_type: rope
rotary_base: 500000
apply_rope_fusion: false
olmo3_yarn_rotary_scaling_factor: 8.0
olmo3_yarn_original_max_position_embeddings: 8192
olmo3_yarn_beta_fast: 32.0
olmo3_yarn_beta_slow: 1.0
# olmo3_yarn_attention_factor is not set: it is derived from the factor, 0.1 * ln(factor) + 1
# (= 1.2079441541679836 for factor 8, the HF config's attention_factor), so an override of
# olmo3_yarn_rotary_scaling_factor changes it too. An explicit value that disagrees with the derived
# one is used as given (an HF checkpoint may carry its own), and the config logs a warning naming both.
# RoPE on sliding layers: per_type = plain RoPE (the trained model; OLMo-core,
# transformers 4.57 / >= 5.13). yarn_all = YaRN everywhere (transformers 5.0-5.12).
# auto (opt-in, logged) follows the installed transformers; it is for parity tools only: the
# OLMo-3 args patch refuses auto for training.
olmo3_rope_layout: per_type

# sliding window on 3 of every 4 layers. The window is one value: window_size in the HF convention
# [W, 0] (W = HF sliding_window, 4096 keys incl. the current token), as olmo3_window_size_form: hf
# declares. Before the model is built, the OLMo-3 args patch converts it once to Megatron / TE
# (W - 1, 0) and sets olmo3_sliding_window = W. To change the window, override window_size: [W, 0].
window_size: [4096, 0]
olmo3_window_size_form: hf
window_attn_skip_freq: 4

# allenai/Olmo-3-1025-7B. For SFT the posttrain hook converts the HF weights natively; given this hub
# id (no hf_path), it uses the local Hugging Face cache snapshot, else downloads the config and
# weights. Offline, set hf_path to a local download (or pretrained_checkpoint to a converted
# checkpoint).
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: allenai/Olmo-3-1025-7B

num_layers: 32
hidden_size: 4096
ffn_hidden_size: 11008
num_attention_heads: 32
group_query_attention: false
num_query_groups: 32
kv_channels: 128
max_position_embeddings: 65536
