###############################################################################
#
# Inkling (thinkingmachines/Inkling): 66 layers, 975B total / 41B active.
# Values from the release config.json text_config. Differences from Small:
# hidden 6144, 64 heads, sliding layers with 16 KV heads (global layers keep
# 8), dense 24576, experts 3072, muP width multiplier 24.
#
# HF text_config key -> field here (same mapping as inkling_small.yaml):
#   num_key_value_heads       -> num_query_groups
#   swa_num_key_value_heads   -> swa_num_query_groups
#   head_dim / swa_head_dim   -> kv_channels / swa_kv_channels
#   dense_intermediate_size   -> ffn_hidden_size
#   intermediate_size         -> moe_ffn_hidden_size
#   n_routed_experts          -> num_experts
#   num_experts_per_tok       -> moe_router_topk
#   n_shared_experts          -> moe_num_shared_experts
#   route_scale               -> moe_router_topk_scaling_factor
###############################################################################
extends:
  - inkling_base.yaml

tokenizer_model: thinkingmachines/Inkling

num_layers: 66
hidden_size: 6144
num_attention_heads: 64
num_query_groups: 8
kv_channels: 128
rel_extent: 1024
swa_num_attention_heads: 64
swa_num_query_groups: 16
swa_kv_channels: 128
sliding_window_size: 512             # also the relative-bias extent of the sliding layers
d_rel: 16
short_conv_kernel_size: 4
log_scaling_n_floor: 128000
log_scaling_alpha: 0.1
logits_mup_width_multiplier: 24.0
unpadded_vocab_size: 200058
ffn_hidden_size: 24576               # dense layers 0-1
num_experts: 256
moe_ffn_hidden_size: 3072
moe_router_topk: 6
moe_num_shared_experts: 2
moe_router_topk_scaling_factor: 8.0
moe_layer_freq: "([0]*2+[1]*64)"
max_position_embeddings: 1048576
seq_length: 4096                     # training seq; overridden per experiment
