###############################################################################
# MiniMax-M3 text tower (GQA + MoE).
#
# ~428B total params, ~23B active, vocab 200064.
# Sources:
#   - https://huggingface.co/MiniMaxAI/MiniMax-M3 (config.json)
#   - MiniMax Sparse Attention, arXiv:2606.13392
#
# Scope: the text tower only. MSA layers build MinimaxSparseAttention, which
# runs the block-sparse attention on the eager (plain PyTorch) backend; a fused
# kernel is not wired in yet. The vision tower and the remaining gaps are
# described in the "Unmapped" block at the bottom.
###############################################################################

extends:
  - language_model.yaml

tokenizer_type: HuggingFaceTokenizer
tokenizer_model: MiniMaxAI/MiniMax-M3

# model architecture
num_layers: 60
hidden_size: 6144
ffn_hidden_size: 12288          # dense layers only (layers 1-3)
num_attention_heads: 64

# GQA (64 Q heads, 4 KV heads, head_dim 128).
# Megatron requires num_query_groups % TP == 0, so TP > 4 needs KV replication.
group_query_attention: true
num_query_groups: 4
kv_channels: 128
qk_layernorm: true              # use_qk_norm, qk_norm_type: per_head

# partial rotary embedding (rotary_dim=64, head_dim=128 -> 50%)
position_embedding_type: rope
rotary_base: 5000000
rotary_percent: 0.5

# MSA (MiniMax Sparse Attention), from config.json's sparse_attention_config.
# Dense in layers 1-3, block-sparse in layers 4-60: an index branch of 4 heads x
# dim 128 scores every 128-token KV block, keeps the top 16 blocks per GQA group
# (plus the init block and the 1 local block), and the main branch then runs
# exact attention over that subset only.
#
# `minimax_sparse_attention` selects MSATransformerConfig
# (primus/backends/megatron/core/models/minimax_m3/), the way
# `multi_latent_attention` selects MLATransformerConfig, and puts
# MinimaxSparseAttention in the self_attention slot of the layers the freq
# below marks. Those layers run the block-sparse attention on the eager
# backend, which materialises the full [b, heads, sq, sk] score matrix -- see
# the "Unmapped" block for what that costs.
#
# Megatron's own sparse-attention path (`experimental_attention_variant: dsa`)
# is not reusable here: its module spec asserts `multi_latent_attention`, and
# its indexer selects tokens rather than blocks.
minimax_sparse_attention: true
sparse_attention_freq: "([0]*3+[1]*57)"     # dense layers 1-3, MSA layers 4-60
sparse_num_index_heads: 4
sparse_index_dim: 128
sparse_block_size: 128
sparse_topk_blocks: 16                      # 16 * 128 = 2048 KV tokens attended
sparse_score_type: max                      # block score = max over its tokens
sparse_init_block: 0
sparse_local_block: 1
sparse_disable_index_value: "([0]*3+[1]*57)"  # same per-layer list as the freq above

# Indexer training signal. top-k is not differentiable, so the indexer's
# projections get no gradient from the attention path at all -- this
# distillation loss is the only thing that moves them. 0.0 freezes the indexer
# at its init, which makes MSA select blocks at random; keep it non-zero for any
# run that is actually training. Like the reference, the indexer reads
# input_layernorm(x) -- recomputed from linear_qkv's fused norm weight --
# detached, so the loss trains the indexer only. It is logged as
# `msa_indexer_loss` next to the MoE aux losses.
sparse_indexer_loss_coeff: 1.0e-2
# sparse (DSA's sparse loss): KL over each query's selected blocks, against the
# attention the layer actually paid them; cheap, and what msa_backend: flydsl
# supports. dense: KL over every visible block against dense attention; needs
# the full score matrix, so eager only.
sparse_indexer_loss_type: sparse

# Attention core: flydsl runs the gfx950 (MI355X) kernels in
# core/transformer/minimax_m3/flydsl, which never form the score matrix -- on
# the 8-layer proxy, 1.75x faster per step and 51 GB less memory than eager,
# same loss curve. It needs head_dim 128, 16 query heads per KV head, and no
# dataloader attention mask. eager is the plain-PyTorch reference, for other
# GPUs and for checking numerics. Neither supports tensor parallelism yet.
msa_backend: flydsl

# MoE - layers 1-3 dense, layers 4-60 MoE; 128 routed experts + 1 shared
moe_layer_freq: "([0]*3+[1]*57)"
num_experts: 128
moe_router_topk: 4
moe_ffn_hidden_size: 3072
moe_shared_expert_intermediate_size: 3072   # n_shared_experts(1) * moe_ffn_hidden_size
moe_router_score_function: sigmoid
moe_router_pre_softmax: false
moe_router_topk_scaling_factor: 2.0         # routed_scaling_factor
moe_router_enable_expert_bias: true         # aux-loss-free (noaux_tc) balancing
moe_router_bias_update_rate: 1.0e-3
moe_router_load_balancing_type: seq_aux_loss
moe_aux_loss_coeff: 0.001
moe_token_dispatcher_type: alltoall

# MoE optimization
expert_model_parallel_size: 8
moe_grouped_gemm: true
moe_use_legacy_grouped_gemm: false
moe_permute_fusion: true
moe_shared_expert_overlap: true

# context. The RoPE cache is materialised at this length, so training examples
# are expected to override it down to the run's seq_length.
max_position_embeddings: 1048576

# MTP is left off: see the "Unmapped" block for why the module count does not
# translate cleanly onto Megatron's MTP layers.
mtp_num_layers: 0

# other settings
# Activation: config.json's `hidden_act: swigluoai`. The reference
# implementation (transformers, MiniMaxM3VLDenseMLP / MiniMaxM3VLExperts) is
#     gate, up = gate_up.chunk(2, dim=-1)
#     gate = gate.clamp(max=swiglu_limit)
#     up   = up.clamp(-swiglu_limit, swiglu_limit)
#     out  = (up + 1.0) * gate * sigmoid(gate * swiglu_alpha)
# which is exactly Megatron's `quick_geglu` GLU path (mlp.py / moe/experts.py)
# with glu_linear_offset=1.0 and activation_func_clamp_value=swiglu_limit --
# same chunk() split, and quick_gelu is x*sigmoid(1.702x) == swiglu_alpha.
# MSATransformerConfig derives the two Megatron fields from the names below.
swiglu: false
quick_geglu: true
swiglu_alpha: 1.702
swiglu_limit: 7.0
bias_swiglu_fusion: false
bias_gelu_fusion: false
add_bias_linear: false
attention_softmax_in_fp32: true
untie_embeddings_and_output_weights: true
hidden_dropout: 0.0
attention_dropout: 0.0
normalization: RMSNorm
# config.json's `use_gemma_norm`. The reference MiniMaxM3VLRMSNorm normalizes
# in fp32, scales by (1.0 + weight) and inits weight at zeros -- i.e. TE's
# RMSNorm(zero_centered_gamma=True), which Primus's turbo and fused-residual
# norm paths also honour. It covers the q/k norms too (the reference uses the
# same class there, and Megatron's qk norm is TENorm reading the same flag).
# MSATransformerConfig sets the flag.
use_gemma_norm: true
# Upstream's dest for --norm-epsilon is `layernorm_epsilon`. The `norm_epsilon`
# spelling the older presets here use only reaches DeepSeek-V4, and is a silent
# no-op on a `model_type: gpt` model like this one.
layernorm_epsilon: 1.0e-6
init_method_std: 0.02

###############################################################################
# Unmapped: parts of M3 this preset cannot express yet.
#
# MSA (MiniMax Sparse Attention): the eager backend
#   (core/transformer/minimax_m3/eager.py) materialises the full
#   [b, heads, sq, sk] fp32 score matrix, so its activation memory grows with
#   sq^2 -- several GB per MSA layer at 4k, which is why long eager runs need
#   full recompute on every layer. msa_backend: flydsl avoids that (see above).
#   The indexer itself still scores every key in plain PyTorch, an O(sq^2)
#   [b, 4, sq, sk] fp32 tensor. Not supported yet: context and sequence
#   parallelism, packed sequences, and inference.
#
# MTP: config.json carries both `num_mtp_modules: 7` and
#   `num_nextn_predict_layers: 1`. Seven extra MoE layers would add ~50B params,
#   which the released 427B checkpoint does not account for, so the mapping onto
#   Megatron's `mtp_num_layers` needs confirming before it is turned on.
#
# Vision tower: CLIP-style, 32 layers, hidden 1280, 16 heads, patch 14,
#   image 2016, 3D RoPE, spatial merge 2 / temporal patch 2, projected to 6144.
#   No Megatron encoder is wired up for it.
###############################################################################
