###############################################################################
# Muse Spark toy size: the blocks of Muse-Spark-Open-816B-A42B (text decoder) at a
# small size (4 layers, hidden 1024, 16 experts top-4) for single-node runs and CI.
# Random init only (no HF checkpoint has this size); the tokenizer is the released one.
###############################################################################

extends:
  - muse_spark/muse_spark_base.yaml

tokenizer_model: meta-models/Muse-Spark-Open-816B-A42B
vocab_size: 202048                 # the released tokenizer's (HF text_config.vocab_size)

num_layers: 4
hidden_size: 1024
ffn_hidden_size: 2048
num_attention_heads: 16
num_query_groups: 4
kv_channels: 64
max_position_embeddings: 4096
# the released model's layer pattern of 4 (a different num_layers must give its own lists)
window_attn_skip_freq: "[1,0,1,1]"
no_rope_freq: "[0,1,0,0]"

num_experts: 16
moe_router_topk: 4
moe_ffn_hidden_size: 512
moe_latent_size: 512

init_method_std: 0.02
