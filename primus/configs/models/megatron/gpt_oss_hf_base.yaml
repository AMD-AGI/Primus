# GPT-OSS's MLP / MoE as released (openai/gpt-oss-20b, -120b config.json), layered over
# gpt_oss_20B.yaml / gpt_oss_120B.yaml. Those two are perf stand-ins the baselines track --
# SwiGLU, no biases, and a shared expert the model does not have -- so they are left as they are,
# and gpt_oss_{20B,120B}_hf.yaml compose them with this file instead.

# Every linear has a bias: q/k/v/o, the router, and each expert's fc1 and fc2. Megatron's grouped
# experts reject bias_dropout_fusion with a bias (TEGroupedMLP asserts on it).
add_bias_linear: true
bias_dropout_fusion: false

# `swiglu` with alpha 1.702 and limit 7.0 in the reference, which is Megatron's quick_geglu:
#   gate = gate.clamp(max=7); up = up.clamp(-7, 7); out = gate * sigmoid(1.702 * gate) * (up + 1)
# The reference interleaves gate/up columns; a Megatron checkpoint stores them as two halves.
swiglu: false
quick_geglu: true
glu_linear_offset: 1.0
activation_func_clamp_value: 7.0
bias_swiglu_fusion: false

# Routed experts only, scored as softmax over the top-4 router logits.
moe_shared_expert_intermediate_size: null
moe_shared_expert_overlap: false
moe_router_score_function: softmax
moe_router_pre_softmax: false

# No q/k norm (the stand-ins inherit DeepSeek-V2's). Megatron's dest for the RMSNorm epsilon is
# `layernorm_epsilon`; the `norm_epsilon` spelling is a no-op on a gpt model.
qk_layernorm: false
layernorm_epsilon: 1.0e-5
rotary_base: 150000
