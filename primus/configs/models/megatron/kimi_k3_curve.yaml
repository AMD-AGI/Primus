###############################################################################
# Kimi K3 "curve" shape — the smallest shape worth drawing a real convergence
# curve with, on ONE node of 8 x MI355X.
#
# Parameter count (derived from this config, not measured; mirrors the
# deepseek_v2.yaml "# 236B total / 21B active" convention):
#   ~3.85 B total params  -- 32 routed experts x 23 MoE layers x ~3.15 M/expert
#     (3 x 1024 latent x 1024 moe_ffn) ~= 2.32 B dominates; + untied 151680 x
#     2048 embed + lm_head (~0.62 B), KDA/MLA, shared experts, latent projections.
#     Full breakdown: examples/models/kimi-k3/run_kimi_k3_curve_pretrain_mi355x.sh.
#   ~1.5 B active params/token  -- top-4 of 32 routed + 2 shared + attention + embed.
#
# The 8-layer kimi_k3_debug.yaml is a correctness vehicle, not a science
# instrument: 0.34 B of its 0.45 B parameters are the untied embedding and
# output head (VALIDATION.md §7.7), so 75 % of the model is vocabulary and
# 78 % of the FLOPs are the LM head. Any measured throughput or convergence
# rate at that shape is a statement about a vocabulary projection.
#
# ---------------------------------------------------------------------------
# PRESERVED from the 93-layer production shape (these are the point):
#   * KDA / full-attention interleave: "([1]*3+[0])*6" -> 18 KDA / 6 full,
#     ratio 3:1 against the release's 69/24 = 2.875:1.
#   * >= 2 attention-residual checkpoints: block_size 8 over 24 layers appends
#     at layers 0, 8, 16 -> 3 checkpoints, so block_residual genuinely GROWS
#     twice (the debug shape only grows once).
#   * layer 0 dense, layers 1-23 MoE ("([0]*1+[1]*23)", i.e.
#     first_k_dense_replace = 1).
#   * Stable Latent MoE bottleneck ratio EXACTLY 0.5: 1024 / 2048, as
#     3584 / 7168 in the release.
#   * MLA head geometry kept at the RELEASED widths, not scaled:
#     qk_head_dim 128 + qk_pos_emb_head_dim 64 -> q_head_dim 192, so
#     softmax_scale stays 192 ** -0.5 == 0.07216878364870323, the exact
#     production value pinned by test_kimi_k3_yaml.py. The debug shape scales
#     these to 32/16 and therefore runs a different attention scale.
#   * NoPE, the MLA sigmoid output gate, situ, and the sigmoid + noaux_tc
#     router, all inherited from kimi_k3_base.yaml.
#
# SCALED DOWN: num_layers 93 -> 24, hidden 7168 -> 2048, heads 96 -> 16,
# experts 896 -> 32, topk 16 -> 4 (routed-expert activation fraction 4/32 =
# 12.5 %, vs the release's 16/896 = 1.8 % which is too sparse to give every
# expert a usable gradient inside a ~500-step budget), shared experts 2 -> 2
# (kept), seq 4096 -> 2048.
#
# ---------------------------------------------------------------------------
# VOCABULARY — deliberate deviation, do not "fix" it back
#
# The release uses vocab_size 163840 with Moonshot's own tokenizer, which is
# not distributed with anything reachable here (HF checkpoint / tokenizer
# support is out of scope per DECISIONS.md §3). The real-data runs tokenise
# with the locally cached Qwen2.5 tokenizer instead, whose true size is
# len(tokenizer) == 151665 (151643 base + 22 added tokens, ids 0..151664 with
# no gaps).
#
# vocab_size is set to that number so the config does not lie. It matters that
# it is explicit: with tokenizer_type: HuggingFaceTokenizer,
# build_tokenizer.py:114-117 sets
#   args.padded_vocab_size = vocab_size_with_padding(tokenizer.vocab_size, args)
# and huggingface_tokenizer.py:291-293 returns len(tokenizer) there — so the
# model is built at ceil(151665 / 64) * 64 = 151680 (measured, not derived:
# phase2_infra/results/dataset_readback.json) regardless of what vocab_size
# says. Leaving vocab_size at 163840 would produce a config whose stated
# vocabulary is 12 160 rows larger than the tensor actually allocated, with no
# error anywhere: KimiK3TransformerConfig.__post_init__:345 only back-fills
# padded_vocab_size when it is None, and by then it is not.
#
# 151680 > 151664, the highest id the tokenizer can emit, so no real token id
# is ever truncated. Consequence for reading the curve: the init loss floor is
# ln(151680) = 11.92953, NOT the ln(163968) = 12.00743 of the mock-data runs.
# The two are not comparable without that offset.
###############################################################################

extends:
  - kimi_k3_base.yaml

# ---------- core shape ----------
num_layers: 24
hidden_size: 2048
num_attention_heads: 16
num_query_groups: null
# 2048 % 16 == 128 exactly, so kv_channels is not strictly forced here the way
# it is at the production shape (7168 % 96 != 0, arguments.py:1051-1053) — set
# explicitly anyway so the value is auditable rather than derived.
kv_channels: 128                            # = v_head_dim
# Production ratio 33792 / 7168 = 4.714x. Layer 0 is the only dense MLP.
ffn_hidden_size: 9728

# ---------- full-attention layers (MLA, NoPE) ----------
# Released ratios: q_lora 1536/7168 = 0.214, kv_lora 512/7168 = 0.0714.
# 2048 * 0.214 = 439 -> 512; 2048 * 0.0714 = 146 -> 256 (kv_lora must stay
# comfortably above qk_pos_emb_head_dim, which is added to the same
# down-projection width).
q_lora_rank: 512
kv_lora_rank: 256
qk_head_dim: 128                            # released value, NOT scaled
v_head_dim: 128                             # released value, NOT scaled
# qk_pos_emb_head_dim: 64 is inherited from kimi_k3_base.yaml. Keeping it at
# the released 64 alongside qk_head_dim: 128 is what preserves q_head_dim 192.

# ---------- Kimi Delta Attention ----------
# 16 heads x 128 dims -> q/k/v/g projections are 2048 -> 2048. No GQA.
linear_num_key_heads: 16
linear_num_value_heads: 16
linear_key_head_dim: 128                    # released value, NOT scaled
linear_value_head_dim: 128
linear_conv_kernel_dim: 4

# 24 layers as 6 blocks of K K K F -> full attention at 0-indexed 3, 7, 11,
# 15, 19, 23. The release's irregular K K F F tail is not reproducible at 24
# layers without breaking the 3:1 body, and the tail is a fine-tuning detail
# rather than a mechanism; the mechanism under test is the interleave itself.
linear_attention_freq: "([1]*3+[0])*6"

# ---------- attention residuals ----------
# ceil(24 / 8) = 3 checkpoints, appended at layers 0, 8, 16. Chosen over 12
# (which would give 2) so block_residual's candidate axis grows TWICE, which
# is the case the num_blocks_max pre-allocation and the PP packing stride
# actually have to handle.
attn_res_block_size: 8

# ---------- MoE ----------
num_experts: 32
# 32 experts is divisible by 8, so expert_model_parallel_size: 8 puts exactly
# 4 local experts on each of the node's 8 GPUs — the DeepSeek-V4 8-GPU
# arrangement that is already proven on this node.
moe_router_topk: 4
# Production ratio 3072 / 7168 = 0.4286 -> 2048 * 0.4286 = 878 -> 1024.
moe_ffn_hidden_size: 1024
# num_shared_experts: 2, as the release. MCore expresses shared experts as a
# width, and the release derives it from moe_intermediate_size, not from
# intermediate_size (modeling_kimi_linear.py:798).
moe_shared_expert_intermediate_size: 2048
# THE structural invariant: hidden_size / 2, exactly as 3584 / 7168.
routed_expert_hidden_size: 1024
latent_moe_use_norm: true
moe_layer_freq: "([0]*1+[1]*23)"

# ---------- context ----------
# 2048 = 32 x kda_chunk_size (64), so the KDA chunked path has no ragged tail.
# Half the release's 4096 training length; the 8k->64k context ramp is a
# separate recipe question and is not exercised here.
seq_length: 2048
max_position_embeddings: 2048

# ---------- vocab ----------
# See the block at the top of this file. 151665 == len(Qwen2.5 tokenizer);
# Megatron pads to 151680 with make_vocab_size_divisible_by 64 at TP=1.
vocab_size: 151665
make_vocab_size_divisible_by: 64
untie_embeddings_and_output_weights: true

# ---------- tokenizer ----------
# Overridden by the experiment YAML, which points tokenizer_model at the
# locally cached snapshot directory. Named here so this file is self-describing.
tokenizer_type: HuggingFaceTokenizer

# ---------- init ----------
init_method_std: 0.02
