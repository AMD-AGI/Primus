# Mistral-7B-v0.3 (mistralai/Mistral-7B-v0.3): dense Llama-layout decoder.
# GQA (32 heads / 8 KV groups, head_dim 128), RoPE base 1e6 (no scaling),
# RMSNorm eps 1e-5, SwiGLU, no biases, untied LM head, vocab 32768.
# config.json sliding_window: null -> full causal attention.
# It extends llama3_base.yaml and sets the values that differ from it.
extends:
  - llama3_base.yaml

tokenizer_type: HuggingFaceTokenizer
tokenizer_model: mistralai/Mistral-7B-v0.3
vocab_size: 32768

num_layers: 32
hidden_size: 4096
ffn_hidden_size: 14336
num_attention_heads: 32
num_query_groups: 8
# head_dim 128: what Megatron derives (4096 / 32); set to document the HF head size.
kv_channels: 128

max_position_embeddings: 32768
rotary_base: 1000000
