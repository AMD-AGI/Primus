work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:wan2.1_1.3b-pretrain}
workspace: ./output

# Per-config environment (ported from the retired MAD jax-maxdiffusion env
# scripts). TrainRuntime applies this top-level `env:` before JAX/XLA init.
# These flags are arch-agnostic; the gfx950-only RCCL_WARP_SPEED_AUTO=0
# workaround is applied by run.sh and is a no-op on MI300X (gfx942).
env:
  KERAS_BACKEND: "jax"
  JAX_SPMD_MODE: "allow_all"
  JAX_TRACEBACK_FILTERING: "off"
  JAX_PERSISTENT_CACHE_ENABLE_XLA_CACHES: "all"
  # JAX_PERSISTENT_CACHE_ENABLE_XLA_CACHES only selects *which* caches take part;
  # without a directory the cache is never initialized ("Not writing persistent
  # cache entry ... since cache is disabled/not initialized") and the WAN graph is
  # recompiled from scratch on every run. Measured on MI300X: ~41 min of a 46 min
  # 10-step run was compilation. Paths are relative to the Primus root, which is
  # the working directory for every launch path and is bind-mounted in container
  # mode, so the cache survives the container. (The MI355X configs use absolute
  # /myworkspace paths, which only exist in the MAD image.)
  JAX_COMPILATION_CACHE_DIR: "./.jax_cache/wan2.1_1.3b"
  MIOPEN_CUSTOM_CACHE_DIR: "./.jax_cache/wan2.1_1.3b/miopen"
  # NOTE: do not add a relative CK_JIT_CACHE_DIR here. TransformerEngine's CK
  # fused-attention kernels are built by ck_jit_compile.sh, which is spawned with
  # a working directory that is NOT the Primus root, so a "./..." path resolves
  # somewhere else and the build dies with
  #   mktemp: failed to create file via template './.jax_cache/ck_jit/...': No such file or directory
  # taking the whole run down with it. JAX and MIOpen are unaffected because they
  # resolve their dirs in-process. TE's CK cache therefore stays at its default
  # ($HOME/.cache/te_ck_jit, ephemeral); it is a small cost next to the XLA
  # compile. If you want to persist it, use an ABSOLUTE path.
  TOKENIZERS_PARALLELISM: "1"
  SKIP_GCS: "1"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.95"
  TF_CUDNN_WORKSPACE_LIMIT_IN_MB: "71296"
  XLA_FLAGS: "--xla_gpu_enable_latency_hiding_scheduler=true --xla_gpu_enable_cublaslt=True --xla_gpu_autotune_level=5 --xla_gpu_enable_reduce_scatter_combine_by_dim=false --xla_gpu_enable_all_gather_combine_by_dim=false --xla_gpu_all_gather_combine_threshold_bytes=134217728 --xla_gpu_reduce_scatter_combine_threshold_bytes=134217728 --xla_gpu_enable_command_buffer=''"
  NVTE_FUSED_ATTN: "1"
  NVTE_FUSED_ATTN_CK: "1"
  NVTE_FUSED_ATTN_AOTRITON: "0"
  NVTE_CK_USES_BWD_V3: "1"
  NVTE_CK_USES_FWD_V3: "1"
  NVTE_CK_IS_V3_ATOMIC_FP32: "0"
  NVTE_CK_HOW_V3_BF16_CVT: "2"
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: "1"

modules:
  pre_trainer:
    framework: maxdiffusion
    config: pre_trainer.yaml

    model: wan2.1_1.3b.yaml
    maxdiffusion_entrypoint: wan

    overrides:
      run_name: "wan2.1_1.3b_pretrain"
      output_dir: "./output/wan2.1_1.3b-pretrain"
      base_output_directory: "./output/wan2.1_1.3b-pretrain"
      max_train_steps: ${MAX_STEPS:20}
      dataset_type: "synthetic"
      hardware: "gpu"
      checkpoint_every: -1
      enable_profiler: false
      # MI300X has 192 GB HBM (vs 288 GB on MI355X); reduce per_device_batch_size
      # here if a model OOMs relative to the MI355X config.
      per_device_batch_size: 1
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_context_parallelism: 1
      ici_tensor_parallelism: 1
