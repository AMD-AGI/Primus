work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:flux_dev-pretrain}
workspace: ./output

# Per-config environment (arch-agnostic; see the MI355X flux config). The
# gfx950-only RCCL_WARP_SPEED_AUTO=0 workaround is applied by run.sh and is a
# no-op on MI300X (gfx942). NOTE: as on MI355X, Shardy is left at the image
# default (the default maxdiffusion image forces it on for cudnn_flash_te); set
# JAX_USE_SHARDY_PARTITIONER here only if you switch to an older image.
env:
  KERAS_BACKEND: "jax"
  JAX_SPMD_MODE: "allow_all"
  JAX_TRACEBACK_FILTERING: "off"
  JAX_PERSISTENT_CACHE_ENABLE_XLA_CACHES: "all"
  # Persist the compile caches across runs; see the 1.3B MI300X config for why
  # (without a directory the XLA cache is never initialized and every run
  # recompiles). Paths are relative to the Primus root, which is bind-mounted in
  # container mode. Deliberately no CK_JIT_CACHE_DIR -- see the 1.3B config for
  # why a relative path breaks TransformerEngine's CK kernel build.
  JAX_COMPILATION_CACHE_DIR: "./.jax_cache/flux_dev"
  MIOPEN_CUSTOM_CACHE_DIR: "./.jax_cache/flux_dev/miopen"
  TOKENIZERS_PARALLELISM: "1"
  SKIP_GCS: "1"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.95"
  TF_CUDNN_WORKSPACE_LIMIT_IN_MB: "71296"
  # The two first_collective_call timeouts are raised from their 20s/40s
  # defaults: with autotune_level=5 the first step spends >10 min in per-device
  # kernel autotune/JIT, so the 8 device threads reach the first kAllGather
  # minutes apart and XLA's rendezvous watchdog aborts the process (SIGABRT,
  # exit 134) while every thread is still making progress. The wan2.1 runs hit
  # the same stall and survive only because they happen to unstick inside the
  # window -- XLA logs "Warning above was a false-positive. Perhaps the timeout
  # is too short." there. Steady-state steps are seconds, so these long
  # timeouts never trigger after step 1.
  XLA_FLAGS: "--xla_gpu_enable_latency_hiding_scheduler=true --xla_gpu_enable_cublaslt=True --xla_gpu_autotune_level=5 --xla_gpu_enable_reduce_scatter_combine_by_dim=false --xla_gpu_enable_all_gather_combine_by_dim=false --xla_gpu_all_gather_combine_threshold_bytes=134217728 --xla_gpu_reduce_scatter_combine_threshold_bytes=134217728 --xla_gpu_enable_command_buffer='' --xla_gpu_first_collective_call_warn_stuck_timeout_seconds=300 --xla_gpu_first_collective_call_terminate_timeout_seconds=2400"
  NVTE_FUSED_ATTN: "1"
  NVTE_FUSED_ATTN_CK: "1"
  NVTE_FUSED_ATTN_AOTRITON: "0"
  NVTE_CK_USES_BWD_V3: "1"
  NVTE_CK_USES_FWD_V3: "1"
  NVTE_CK_IS_V3_ATOMIC_FP32: "0"
  NVTE_CK_HOW_V3_BF16_CVT: "2"
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: "1"

modules:
  pre_trainer:
    framework: maxdiffusion
    config: pre_trainer.yaml

    model: flux_dev.yaml
    maxdiffusion_entrypoint: flux

    overrides:
      run_name: "flux_dev_pretrain"
      output_dir: "./output/flux_dev-pretrain"
      base_output_directory: "./output/flux_dev-pretrain"
      max_train_steps: ${MAX_STEPS:20}
      dataset_type: "synthetic"
      hardware: "gpu"
      checkpoint_every: -1
      enable_profiler: false
      # MI300X has 192 GB HBM (vs 288 GB on MI355X); the MI355X config uses
      # per_device_batch_size 14. Lower here if FLUX.1-dev OOMs on MI300X.
      per_device_batch_size: 8
      ici_data_parallelism: 1
      ici_tensor_parallelism: 1
