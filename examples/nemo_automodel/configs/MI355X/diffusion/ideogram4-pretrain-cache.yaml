# Primus experiment — Ideogram-4 text-to-image pretrain on REAL encoded data.
# =============================================================================
# The same Primus path as ideogram4-pretrain.yaml, but reading a real pre-encoded
# cache instead of synthetic features:
#   - data.dataloader -> the cache loader
#     (primus/backends/nemo_automodel/models/ideogram4/data/cache.py), reading a
#     cache written by the Ideogram-4 processor
#     (primus/backends/nemo_automodel/models/ideogram4/processor.py)
#   - flow_matching.adapter_type: ideogram4 -> the Ideogram-4 adapter
#   - fsdp.activation_checkpointing with PRIMUS_IDEOGRAM_REAL_AC=1 -> real
#     checkpointing
#
# Only the DATA is real here. The transformer is still randomly initialised from a
# weightless config directory, so no gated transformer weights are needed.
#
# SETUP, in two parts:
#   1. A weightless config directory, as in ideogram4-pretrain.yaml.
#   2. A cache of encoded image/caption pairs. Building one needs a single GPU and
#      access to the encoder repositories, which are gated:
#
#        primus data automodel-cache --model ideogram4 --help
#
#      Then point data.dataloader.cache_dir at the result.
#
# LAUNCH (8 GPUs):
#   PRIMUS_IDEOGRAM_REAL_AC=1 \
#   torchrun --nproc_per_node=8 --nnodes=1 \
#     primus/cli/main.py train pretrain \
#     --config examples/nemo_automodel/configs/MI355X/diffusion/ideogram4-pretrain-cache.yaml
#
# WHAT THIS IS. A short run whose point is a clearly decreasing loss on real
# conditioning, which validates the processor and the cache loader end to end.
# Remove step_scheduler.max_steps for a full run.
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:ideogram4-pretrain-cache}
workspace: ./output

modules:
  pre_trainer:
    framework: nemo_automodel
    config: ideogram4_cache_pre_trainer.yaml
    model: ideogram4.yaml

    overrides:
      step_scheduler:
        max_steps: 200           # remove for a full run
        local_batch_size: 2
        global_batch_size: 16    # 2 x 8 ranks, so no gradient accumulation
        log_remote_every_steps: 1
      optimizer:
        lr: 1.0e-4
      fsdp:
        activation_checkpointing: true
        enable_compile: false
      data:
        dataloader:
          # PLACEHOLDER: set this to your cache directory.
          cache_dir: /path/to/ideogram4_cache
      checkpoint:
        enabled: false           # set true + checkpoint_dir for a real run
