# Primus EXP config — Wan 2.2 T2V A14B pretrain with FP8 via TransformerEngine
# autocast, NeMo AutoModel backend, MI355X.
#
# The FP8 counterpart of wan2_2_t2v_a14b-pretrain.yaml, and CONFIG-ONLY: no
# AutoModel or Diffusers code change and no fork. The AutoModel diffusion recipe
# already reads model.transformer_engine_fp8 and wraps each forward in
# transformer_engine.pytorch.quantization.autocast, swapping the Diffusers
# nn.Linear modules for TE Linear (transformer_engine_linear is forced true when
# fp8 is on). Only the Linear GEMMs run in FP8; attention is unaffected.
#
# Launch (inside the Primus container, 8 GPUs):
#   USE_HIPBLASLT=1 TORCH_BLAS_PREFER_HIPBLASLT=1 HIP_FORCE_DEV_KERNARG=1 GPU_MAX_HW_QUEUES=6 \
#   GPUS_PER_NODE=8 \
#   EXP=examples/nemo_automodel/configs/MI355X/diffusion/wan2_2_t2v_a14b-pretrain-te-fp8.yaml \
#   bash examples/run_pretrain.sh
#
# If TE fp8 with torch.compile graph-breaks or errors, retry with compile off:
#   ... bash examples/run_pretrain.sh fsdp.enable_compile=false
# Alternate scaling recipe (default delayed):
#   ... bash examples/run_pretrain.sh model.transformer_engine_fp8_recipe=current
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:wan2_2_t2v_a14b-pretrain-te-fp8}
workspace: ./output

modules:
  pre_trainer:
    framework: nemo_automodel
    config: pre_trainer.yaml
    model: wan2_2_t2v_a14b.yaml

    overrides:
      model:
        # Delayed tensorwise scaling. transformer_engine_linear is forced true by
        # the recipe when fp8 is enabled, so it is not set here.
        transformer_engine_fp8: true
        transformer_engine_fp8_recipe: delayed
        transformer_engine_fp8_amax_history_len: 1024
        transformer_engine_fp8_amax_compute_algo: max
      # Deliberately identical to the BF16 EXP, so the two are directly comparable.
      step_scheduler:
        max_steps: 25
        local_batch_size: 32
        global_batch_size: 256
      data:
        dataloader:
          cache_dir: /path/to/pusa_v1_512sq
      checkpoint:
        enabled: false
