# Primus experiment — Ideogram-4 text-to-image pretrain on the DDP path, ZeRO-1.
# =============================================================================
# Sibling of ideogram4-pretrain.yaml, which uses FSDP2. This one uses the DDP
# module preset, so the recipe replicates parameters and gradients and skips the
# per-layer all-gather entirely.
#
# PRIMUS_IDEOGRAM_ZERO1=1 is REQUIRED, not optional. It shards the optimizer state
# across ranks, and it also supplies the activation checkpointing that the DDP path
# otherwise silently omits for this model -- without which it does not fit. Use
# PRIMUS_IDEOGRAM_DDP=1 instead for the pure-DDP baseline: same checkpointing,
# replicated optimizer state, which is what makes the ZeRO-1 saving measurable.
#
# WHEN TO USE IT. torch.compile is wired only into the FSDP2 path, so this gives it
# up and trails FSDP2-with-compile on a single node, where there is little exposed
# communication to win back. It is the multi-node lever and a reference point. Do
# not set fsdp.enable_compile here; there is no fsdp block to set it on.
#
# One-time setup is the same as ideogram4-pretrain.yaml: a weightless config
# directory from tools/nemo_automodel/make_ideogram4_config_dir.py.
#
# LAUNCH (8 GPUs):
#   PRIMUS_IDEOGRAM_ZERO1=1 \
#   torchrun --nproc_per_node=8 --nnodes=1 \
#     primus/cli/main.py train pretrain \
#     --config examples/nemo_automodel/configs/MI355X/diffusion/ideogram4-pretrain-ddp.yaml
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:ideogram4-pretrain-ddp}
workspace: ./output

modules:
  pre_trainer:
    framework: nemo_automodel
    config: ideogram4_ddp_pre_trainer.yaml
    model: ideogram4.yaml

    overrides:
      step_scheduler:
        max_steps: 20
        local_batch_size: 2
        # 2 x 8 ranks, so gradient accumulation is 1 and DDP needs no no_sync
        # handling for this run.
        global_batch_size: 16
        log_remote_every_steps: 1
      optimizer:
        lr: 1.0e-4
      ddp:
        activation_checkpointing: true
      model:
        # bf16 master weights, so this is comparable against an FSDP2 run
        # configured the same way rather than against float32 masters.
        torch_dtype: bfloat16
      data:
        dataloader:
          num_samples: 64
          grid_h: 16
          grid_w: 16
          # A fixed caption length, so every packed sequence has one shape.
          max_text_tokens: 128
          min_text_tokens: 128
      checkpoint:
        enabled: false           # set true + checkpoint_dir for a real run
