# Primus EXP config — Wan 2.2 T2V A14B on synthetic data, NeMo AutoModel backend.
#
# Needs no dataset on disk: the dataloader generates deterministic random latents
# of the right shape. Useful for bring-up, for exercising the model and sharding
# path on a new machine, and for changes where the data pipeline is not the thing
# under test.
#
# Launch (inside the Primus container, 8 GPUs):
#   GPUS_PER_NODE=8 \
#   bash ./runner/primus-cli direct -- train pretrain \
#       --config examples/nemo_automodel/configs/MI355X/diffusion/wan2_2_t2v_a14b-synthetic.yaml
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:wan2_2_t2v_a14b-synthetic}
workspace: ./output

modules:
  pre_trainer:
    framework: nemo_automodel
    config: wan_synthetic_pre_trainer.yaml
    model: wan2_2_t2v_a14b.yaml

    overrides:
      model:
        # `flash`, not the preset's `aiter`: AITER's deterministic backward sizes
        # its split-K dQ accumulator from the full sequence, which at this latent
        # shape asks for far more memory than the device has. `flash` gives a
        # working deterministic backward through Composable Kernel.
        attention_backend: flash
      step_scheduler:
        max_steps: 24
        local_batch_size: 1
        global_batch_size: 8
      checkpoint:
        enabled: false
