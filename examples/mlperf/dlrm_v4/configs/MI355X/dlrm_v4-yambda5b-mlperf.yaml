# MLPerf Training dlrmv4: HSTU ranker on yambda-5b to eval AUC 0.75.
# Defaults are the 1-node MLPerf run; config_MI355X_1x8x1.sh sets the system
# environment. An unset variable below (empty default) keeps the trainer's gin value.
work_group: ${TEAM:amd}
user_name: ${USER:root}
exp_name: ${EXP_NAME:dlrm_v4-yambda5b-mlperf}
workspace: ${PRIMUS_WORKSPACE:./output}

# Applied before the trainer starts, over Primus' runner default
# (runner/helpers/envs/base_env.sh sets GPU_MAX_HW_QUEUES=2). The HIP default of 4
# hardware queues is +0.44% 200-step throughput for DLRMv4 on MI355X (cluster B,
# 2026-11-06, 2 runs each). Keep Primus' TORCH_NCCL_HIGH_PRIORITY=1 on one node: with
# 2 queues, normal-priority NCCL streams cost 5.1%; with 4 the priority makes no
# difference on one node. The 2- and 4-node configs set 0: at 2 and 4 nodes 1 stalls
# every training step on rocm/primus:v26.9 (see config_MI355X_2x8x1.sh).
env:
  GPU_MAX_HW_QUEUES: "4"

modules:
  pre_trainer:
    framework: recommendation
    config: pre_trainer.yaml
    model: dlrm_v4_hstu_yambda_5b.yaml
    overrides:
      data_path: ${DLRM_DATA_PATH:/data}
      output_dir: ${DLRM_OUTPUT_DIR:}

      # --- run shape ---
      seed: ${SEED:}
      batch_size: ${BATCH_SIZE:}
      dense_lr: ${DENSE_LR:}
      sparse_lr: ${SPARSE_LR:}
      skip_eval_epoch_pct: ${SKIP_EVAL_EPOCH_PCT:}
      eval_every_data_pct: ${EVAL_EVERY_DATA_PCT:}
      auc_threshold: ${AUC_THRESHOLD:}
      num_train_ts: ${NUM_TRAIN_TS:}
      metric_log_freq: ${METRIC_LOG_FREQ:}
      run_name: ${RUN_NAME:}
      output_trace: ${OUTPUT_TRACE:}

      # --- MLPerf ---
      mlperf_logging: ${MLPERF_LOGGING:true}
      mlperf_log_path: ${MLPERF_LOG_PATH:}
      submission_platform: ${MLLOG_SUBMISSION_PLATFORM:MI355X}
      clear_caches: ${CLEAR_CACHES:true}
      warm_cache_after_run_start: ${WARM_CACHE_AFTER_RUN_START:true}
