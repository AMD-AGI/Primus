work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26B-pretrain}
workspace: ./output

# Gemma4-26B, dropless MoE (no token is dropped): sparse expert matmuls on the Primus-Turbo hipBLASLt grouped GEMM, FSDP 8.
# Needs Primus-Turbo built for JAX and MaxText with the Turbo grouped GEMM (release/v26.10 or later).
# 8x MI300X (per-device batch 14, smaller than on MI325X for 192 GB HBM): 8268 tokens/s/device; the previous
# token-dropping recipe, kept as gemma4_26B-bf16-token_dropping-pretrain.yaml: 5510 tokens/s/device.
env:
  # XLA's GEMM autotuner at level >= 2 intermittently faults on this ROCm stack; level 1 still autotunes.
  XLA_GPU_AUTOTUNE_LEVEL: "1"
  # Smaller collective combine thresholds than Primus's 8 GB default, so FSDP gathers each weight separately
  # and XLA can overlap them with compute. Set here, this replaces an XLA_FLAGS_APPEND from the shell.
  # The first collective can start >40 s late on one GPU (per-device first-call setup); XLA's default 40 s limit for it then aborts the run.
  XLA_FLAGS_APPEND: "--xla_gpu_all_gather_combine_threshold_bytes=268435456 --xla_gpu_reduce_scatter_combine_threshold_bytes=268435456 --xla_gpu_first_collective_call_terminate_timeout_seconds=900"

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_26B.yaml
    overrides:
      run_name: "gemma4_26b_dropless_turbo_gmm_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy: all 128 routed experts on every GPU (one grouped GEMM over 128 groups)
      # and no ragged all-to-all, which dominates the dropless path under expert parallelism on ROCm.
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_expert_parallelism: 1

      # dropless MoE through the Primus-Turbo grouped GEMM
      sparse_matmul: true
      megablox: false
      capacity_factor: -1
      use_turbo_grouped_gemm: true
      turbo_grouped_gemm_backend: "hipblaslt"

      # training
      attention: "cudnn_flash_te"
      max_target_length: 4096
      per_device_batch_size: 14
      remat_policy: "full"
