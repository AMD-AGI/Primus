work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26B-fp8-pretrain}
workspace: ./output

# STATUS (MI300X / gfx942): DOES NOT RUN — blocked upstream.
# MoE fp8 path hits UnexpectedTracerError: RoutedMoE.dense_matmul creates fp8
# einsum variables inside a traced call, leaking amax-history tensors.
# Specific to gemma4 (its internal layer scan adds another transform).
# Other MoE fp8 configs (mixtral, qwen3) train fine. bf16 works; use that.
# Potential fix: try scan_layers: false, or wait for upstream maxtext fix.

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_26B.yaml
    overrides:
      run_name: "gemma4_26b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy (MoE: shard experts)
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1

      # training
      attention: "cudnn_flash_te"
      max_target_length: 4096
      # MI300X has less HBM (192GB) than MI355X; conservative default, untuned on gfx942.
      per_device_batch_size: 1
      remat_policy: "full"
      sparse_matmul: false
      megablox: false
      capacity_factor: 1

      # nanoo_fp8 for AMD MI300X/MI325X (uses e4m3fnuz/e5m2fnuz types)
      quantization: "nanoo_fp8"
