work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:deepseek_v4_tiny-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: deepseek_v4_tiny.yaml
    overrides:
      run_name: "deepseek_v4_tiny_training"
      base_output_directory: "./output"
      steps: 20
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # single node: the whole model fits, so shard it within the node only
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1
      dcn_pipeline_parallelism: 1
      dcn_tensor_parallelism: 1
      dcn_sequence_parallelism: 1

      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1
      ici_sequence_parallelism: 1
      ici_tensor_parallelism: 1
      ici_pipeline_parallelism: 1

      # Same MoE path as the 284B config so this exercises what the big run uses.
      # sparse_matmul routes tokens with ragged_all_to_all, which this ROCm XLA build
      # does not implement ("Device communicator is not implementing" at train step),
      # so use the dense one-hot path every shipping Primus ROCm MoE config uses.
      sparse_matmul: false
      megablox: false
      capacity_factor: 1.25

      sharding_tolerance: 0.05
      max_target_length: 2048
      per_device_batch_size: 1
      remat_policy: "full"
