# Gemma 4 31B dense pre-training -- SINGLE-GPU MI455X throughput proxy.
#
# Full 31B with optimiser state does not fit on one MI455X.
# base_num_decoder_layers is reduced to 6 so the published 5 sliding : 1 global
# attention pattern is preserved; hidden size and head dims stay as in
# MaxText's gemma4-31b.yml.
#
# attention=dot_product: global layers use head_dim 512, and TE fused attention
# has no gfx1250 kernel in current images (unfused TE softmax fails with
# "invalid device function"). Use cudnn_flash_te only once TE supports gfx1250.
#
# Launch:
#   GPUS_PER_NODE=1 ./primus-cli direct -- train pretrain \
#     --config examples/maxtext/configs/MI455X/gemma4_31B-bf16-pretrain_1gpu_proxy.yaml

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_31B-pretrain-1gpu-proxy}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    model: gemma4_31B.yaml
    overrides:
      run_name: "gemma4_31b_1gpu_proxy"
      base_output_directory: "./output"
      steps: ${PRIMUS_STEPS:20}
      profiler: ""

      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}
      use_multimodal: false

      enable_checkpointing: false
      async_checkpointing: false

      dcn_data_parallelism: 1
      dcn_fsdp_parallelism: 1
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_tensor_sequence_parallelism: 1

      remat_policy: ${PRIMUS_REMAT_POLICY:full}
      attention: ${PRIMUS_ATTENTION:dot_product}
      max_target_length: ${PRIMUS_SEQ_LENGTH:1024}
      per_device_batch_size: ${PRIMUS_MBS:1}
      scan_layers: false
      # Only for NaN-debug runs that must keep stepping after a NaN loss.
      abort_on_nan_loss: ${PRIMUS_ABORT_ON_NAN_LOSS:true}
      learning_rate: ${PRIMUS_LR:3e-05}
      adam_weight_decay: ${PRIMUS_ADAM_WD:0.1}
      opt_type: ${PRIMUS_OPT_TYPE:adamw}
      base_emb_dim: ${PRIMUS_EMB_DIM:5376}
      base_mlp_dim: ${PRIMUS_MLP_DIM:21504}
      base_num_query_heads: ${PRIMUS_Q_HEADS:32}
      base_num_kv_heads: ${PRIMUS_KV_HEADS:16}
      global_num_kv_heads: ${PRIMUS_GLOBAL_KV:4}
      # On gfx1250 with current XLA plugins, stores past 2 GiB into one buffer
      # wrap 4 GiB lower: the full 262144×5376 bf16 embedding faults at init,
      # and its f32 AdamW temp silently corrupts other buffers. Set
      # vocab_size <= 99864 (e.g. 65536) for 1-GPU bring-up until the plugin
      # is fixed; default stays 262144.
      vocab_size: ${PRIMUS_VOCAB_SIZE:262144}

      base_num_decoder_layers: ${PRIMUS_NUM_LAYERS:6}
