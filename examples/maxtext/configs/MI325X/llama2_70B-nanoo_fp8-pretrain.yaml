work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama2_70B-nanoo_fp8-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: llama2_70B.yaml
    overrides:
      run_name: "llama2_70b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1
      dcn_pipeline_parallelism: 1
      dcn_tensor_parallelism: 1
      dcn_sequence_parallelism: 1

      # intra-node parallelism strategy
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_sequence_parallelism: 1
      ici_tensor_parallelism: 1
      ici_pipeline_parallelism: 1

      remat_policy: "full"
      max_target_length: 4096
      # MI325X (256GB HBM): XLA estimate 219.8/230.1 GB on mi325x-do (v26.10 jax image).
      # pdbs 22 (231.0 GB) OOMs there; 21 fits at 226.0 GB with the same throughput, so 20
      # keeps headroom for FP8 temp-memory growth across images.
      per_device_batch_size: 20

      # quantization (nanoo_fp8)
      quantization: "nanoo_fp8"
