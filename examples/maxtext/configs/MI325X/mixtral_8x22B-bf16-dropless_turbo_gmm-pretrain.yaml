work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:mixtral_8x22B-dropless_turbo_gmm-pretrain}
workspace: ./output

# Dropless MoE with the Primus-Turbo hipBLASLt grouped GEMM (needs a JAX build of Primus-Turbo that provides
# primus_turbo.jax.lax.grouped_gemm_hipblaslt). See docs/02-user-guide/jax-maxtext-training.md.
# 8x MI325X: 13.78 s/step, 1784 tokens/s/device (1827 with JAX_ENABLE_PGLE=true after 3 profiling steps). The
# token-dropping mixtral_8x22B-bf16-pretrain.yaml recipe (EP 8, batch 6): 14.03 s/step, 1752 tokens/s/device.
env:
  # XLA's GEMM autotuner at level >= 2 intermittently faults on this ROCm stack; level 1 still autotunes.
  XLA_GPU_AUTOTUNE_LEVEL: "1"
  # Smaller collective combine thresholds than Primus's 8 GB default, so FSDP gathers each weight separately
  # and XLA can overlap them with compute. Set here, this replaces an XLA_FLAGS_APPEND from the shell.
  XLA_FLAGS_APPEND: "--xla_gpu_all_gather_combine_threshold_bytes=1 --xla_gpu_reduce_scatter_combine_threshold_bytes=1"

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: mixtral_8x22B.yaml
    overrides:
      run_name: "mixtral_8x22b_dropless_turbo_gmm_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy: all 8 experts on every GPU, so the grouped GEMM sees 8 groups and
      # no ragged all-to-all is needed (it dominates the dropless path under expert parallelism on ROCm).
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_expert_parallelism: 1

      # dropless MoE through the Primus-Turbo grouped GEMM
      sparse_matmul: true
      megablox: false
      capacity_factor: -1
      use_turbo_grouped_gemm: true
      turbo_grouped_gemm_backend: "hipblaslt"

      max_target_length: 4096
      per_device_batch_size: 6
      # Keep only the expert down-projection output (24 KB per token and layer): FSDP needs the memory for the
      # gathered expert weights of this 141B-parameter model, and skipping the down-projection grouped GEMM in
      # the backward pass saves the most time per byte.
      remat_policy: "custom"
      moe_mlpwo: "device"
