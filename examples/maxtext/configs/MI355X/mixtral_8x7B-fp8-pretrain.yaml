work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:mixtral_8x7B-fp8-pretrain}
workspace: ./output

# Per-config environment (single source of truth in Primus). TrainRuntime applies
# this top-level `env:` before JAX/XLA init, overriding the base image's baked value.
# mixtral_8x7B needs a larger XLA client pool than the image default (0.9); combined with
# moe_dispatch_no_expert_sharding it fits on one GPU. Since the MaxText v26.9 fp8 rewrite,
# bs11 compiles to ~286 GB and OOMs against the 276 GB pool; bs10 compiles to ~265 GB at the
# same tokens/s/device (each sequence of batch costs ~21 GB, nearly all saved activations).
env:
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.96"

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: mixtral_8x7B.yaml
    overrides:
      run_name: "mixtral_8x7b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1

      # MoE dispatch keeps experts unsharded across the expert axis (AMD-AGI/Primus#921):
      # required for mixtral_8x7B so dispatch does not materialize a full unsharded expert
      # tensor that OOMs a single MI355X device.
      moe_dispatch_no_expert_sharding: true

      sparse_matmul: false
      megablox: false
      capacity_factor: 1
      max_target_length: 4096
      per_device_batch_size: 10
      remat_policy: "minimal"

      # quantization (fp8)
      quantization: "fp8"
