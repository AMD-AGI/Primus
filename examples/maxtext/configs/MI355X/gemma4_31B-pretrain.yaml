work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_31B-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_31B.yaml
    overrides:
      run_name: "gemma4_31b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_tensor_sequence_parallelism: -1

      remat_policy: "full"
      # v26.6 (rocm-main) maxtext: gemma4 trains with the reference dot_product
      # attention. The fused/flash kernels still native-crash on head_dim=256 +
      # sliding-window on this ROCm stack, so we use dot_product here. Seq len is
      # reduced to 4096 to keep dot_product's O(S^2) compile/step tractable.
      attention: "dot_product"
      max_target_length: 4096
      per_device_batch_size: 1
