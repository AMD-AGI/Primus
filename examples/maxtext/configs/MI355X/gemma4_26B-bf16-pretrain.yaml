work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26B-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_26B.yaml
    overrides:
      run_name: "gemma4_26b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy (MoE: shard experts)
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1

      attention: "cudnn_flash_te"
      max_target_length: 4096
      # measured ceiling on MI355X (288GB HBM): 20 fits at 246GB, 24 OOMs
      per_device_batch_size: 20
      remat_policy: "full"
      sparse_matmul: false
      megablox: false
      capacity_factor: 1
