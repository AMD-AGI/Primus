work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26B-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_26B.yaml
    overrides:
      run_name: "gemma4_26b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy (MoE: shard experts)
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1

      # training
      # v26.6 (rocm-main) maxtext: use reference dot_product attention (fused/flash
      # kernels native-crash on gemma4 head_dim=256 + sliding-window on this ROCm
      # stack). NOTE: MoE + dot_product compilation is very heavy; the gemma sweep
      # bounds this with a short per-model timeout.
      attention: "dot_product"
      max_target_length: 4096
      per_device_batch_size: 1
      remat_policy: "full"
      sparse_matmul: false
      megablox: false
      capacity_factor: 1
