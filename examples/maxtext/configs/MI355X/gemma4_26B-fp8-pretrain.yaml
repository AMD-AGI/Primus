work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26B-fp8-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: gemma4_26B.yaml
    overrides:
      run_name: "gemma4_26b_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy (MoE: shard experts)
      ici_fsdp_parallelism: 1
      ici_data_parallelism: 1
      ici_expert_parallelism: -1

      # training
      # gemma4's local layers need their sliding window honored: cudnn_flash_te takes it
      # as window_size, while the autoselected pallas kernel only builds a causal mask.
      attention: "cudnn_flash_te"
      max_target_length: 4096
      per_device_batch_size: 2
      remat_policy: "full"
      sparse_matmul: false
      megablox: false
      capacity_factor: 1

      # quantization (fp8)
      quantization: "fp8"

      # v26.6 fp8-MoE fix: the legacy per-module linen Fp8Einsum requires an active
      # Linen binding scope. v26.6 flipped base.yml pure_nnx_decoder false->true, which
      # runs the decoder in pure-NNX and invokes Fp8Einsum unbound -> crash. Pinning the
      # decoder back to the bridged path restores the v26.5 fp8-MoE behavior.
      # Not sufficient on gemma4, which also scans its local/global layers: the fp8
      # einsum's setup then leaks a tracer out of that remat'd scan (upstream flax bug).
      pure_nnx_decoder: false
