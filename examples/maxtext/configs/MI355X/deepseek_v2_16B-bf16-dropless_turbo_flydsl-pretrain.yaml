# MI355X (gfx950) dropless MoE with the Primus-Turbo grouped GEMM: backend flydsl, bf16, FSDP 8 (no expert parallelism), seq 4096.
# Measured on 8x MI355X (rocm/jax-training:maxtext-v26.9): 36,048 tokens/s/GPU (shipped MI355X recipe 20,281: +78%) at per_device_batch_size 18.
# Needs Primus-Turbo with the FlyDSL JAX backend (scripts/00_setup_all.sh).
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:deepseek_v2_16B-bf16-dropless_turbo_flydsl-pretrain}
workspace: ./output

env:
  # XLA's GEMM autotuner at level >= 2 intermittently faults on this ROCm stack; level 1 still autotunes.
  XLA_GPU_AUTOTUNE_LEVEL: "1"
  # Smaller collective combine thresholds than Primus's 8 GB default, so FSDP gathers each weight separately
  # and XLA can overlap them with compute. Set here, this replaces an XLA_FLAGS_APPEND from the shell.
  XLA_FLAGS_APPEND: "--xla_gpu_all_gather_combine_threshold_bytes=1073741824 --xla_gpu_reduce_scatter_combine_threshold_bytes=1073741824 --xla_gpu_enable_pipelined_all_gather=true --xla_gpu_enable_pipelined_reduce_scatter=true --xla_gpu_enable_pipelined_all_reduce=true --xla_gpu_executable_terminate_timeout=900 --xla_gpu_executable_warn_stuck_timeout=120"

modules:
  pre_trainer:
    framework: maxtext
    config: pre_trainer.yaml

    # model to run
    model: deepseek_v2_16B.yaml
    overrides:
      run_name: "deepseek_v2_16B_bf16_dropless_turbo_flydsl_training"
      base_output_directory: "./output"
      steps: 50
      profiler: ""

      # data
      dataset_type: "synthetic"
      hf_access_token: ${HF_TOKEN:""}

      # checkpoint
      enable_checkpointing: false
      async_checkpointing: false

      # inter-node parallelism strategy
      dcn_data_parallelism: -1
      dcn_fsdp_parallelism: 1

      # intra-node parallelism strategy: all 64 routed experts on every GPU (one grouped GEMM over 64 groups)
      # and no ragged all-to-all, which dominates the dropless path under expert parallelism on ROCm.
      ici_fsdp_parallelism: 8
      ici_data_parallelism: 1
      ici_expert_parallelism: 1

      # dropless MoE through the Primus-Turbo grouped GEMM
      sparse_matmul: true
      megablox: false
      capacity_factor: -1
      use_turbo_grouped_gemm: true
      turbo_grouped_gemm_backend: "flydsl"

      sharding_tolerance: 0.05
      max_target_length: 4096
      per_device_batch_size: 18
      remat_policy: "minimal_flash"