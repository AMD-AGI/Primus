work_group: ${PRIMUS_TEAM:local}
user_name: ${PRIMUS_USER:local}
exp_name: ${PRIMUS_EXP_NAME:vision-synthetic}
workspace: ${PRIMUS_WORKSPACE:./output}

platform:
  config: platform_local.yaml

modules:
  pre_trainer:
    framework: vision
    config: pre_trainer.yaml
    model: synthetic.yaml
    overrides:
      sink_level: null
      file_sink_level: INFO
      stderr_sink_level: INFO

      training:
        steps: ${MAX_STEPS:2}
        output_dir: ${OUTPUT_DIR:./output/vision-synthetic}
        save_steps: 0
        run_name: vision-synthetic

      data:
        length: 4
        views: 2
        image_size: 16
        batch_size: 1
        num_workers: 0

      parallelism:
        mode: ddp

      runtime:
        attention_backend: sdpa
        bf16: false
        seed: 0
