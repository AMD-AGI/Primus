work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_26b_sft}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  post_trainer:
    framework: megatron_bridge
    config: sft_trainer.yaml

    # Model to run
    model: gemma4_26b.yaml

    overrides:
      stderr_sink_level: DEBUG

      # Training configuration
      train_iters: 100
      global_batch_size: 128
      micro_batch_size: 1
      seq_length: ${PRIMUS_SEQ_LENGTH:2048}

      # Nested overrides
      log_interval: 1
      eval_interval: 50
      eval_iters: 10
      skip_save: true

      # Optimizer
      finetune_lr: 1.0e-4
      min_lr: 0.0
      lr_warmup_iters: 10
      lr_decay_iters: null

      # Parallelism - MoE with expert parallelism
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 8  # Critical for 26B MoE
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      sequence_parallel: false
      use_megatron_fsdp: false
      enable_primus_turbo: false

      # PEFT configuration (LoRA)
      peft: lora
      peft_dim: 16
      peft_alpha: 32

      # Data
      mock: true
      data_paths: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      train_data_path: null
      valid_data_path: null
      test_data_path: null
