# Gemma 4 31B (Dense) pre-training -- SINGLE-GPU MI455X throughput proxy.
#
# Why a proxy: the full 60-layer model needs ~533 GB for bf16 params + fp32
# master + Adam moments on a single rank, against 464 GB available -- it does
# not fit. num_layers is reduced; all other architectural dimensions are left
# as published so per-layer cost stays representative.
#
# 6 layers preserves the published 5 sliding : 1 full attention ratio.
#
# On the micro-batch and depth ceilings, and why they are lower than they look.
# This device wedges intermittently ("MES(N, 0) failed to respond to
# msg=REMOVE_QUEUE", host reboot required) on configurations that also succeed,
# so a single wedge is evidence about the boot rather than about the config.
# Re-probing on a healthy boot has now overturned four ceilings that each rested
# on one wedge: micro_batch_size 8, num_layers 12 and 18, and TransformerEngine
# on this model all run clean when retried. Only micro_batch_size 16 has failed
# twice, both with hipErrorLaunchFailure at a projected ~360 GB that would have
# fit, so it is a stability limit and not a memory one.
#
# Measured best is micro_batch_size 8 (220.0 GB of 464), two clean runs, but
# only with PRIMUS_GEMMA4_TURBO_LINEAR -- see the reference block at the end.
#
# On the unpatched path this config ships, micro_batch_size 8 has wedged twice
# out of two attempts, and one of those was minutes after two clean mbs 4 runs
# on the same boot. That same-boot pairing is the only evidence here that
# survives the caveat above, since it is the one case where boot state is held
# fixed, so the default stays at 4 and 8 is not recommended without the patch.
#
# REQUIRED ENVIRONMENT on gfx1250:
#
#   HIPBLASLT_TENSILE_LIBPATH -- set automatically by base_env.sh, so nothing to
#     do when launching through the runner. hipBLASLt ships its gfx1250 Tensile
#     files one directory below where it looks for them, so every solution
#     lookup fails and it returns HIPBLAS_STATUS_INVALID_VALUE for all shapes.
#     Worth 2.93x end-to-end. Export it by hand only if you bypass the runner.
#
#   PRIMUS_GEMMA4_TORCH_OPTIM=1
#     Only needed if you switch this config to TE layers. TE's FusedAdam does
#     not return on this device. See gemma4_local_spec.
#
# Launch:
#   export GEMMA4_CONVERSION_MODE=text
#   GPUS_PER_NODE=1 ./primus-cli direct -- train pretrain \
#     --config examples/megatron_bridge/configs/MI455X/gemma4_31b_pretrain_1gpu_proxy.yaml

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gemma4_31b_pretrain_1gpu_proxy}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron_bridge
    config: pretrain_trainer.yaml

    model: gemma4_31b_6layer_proxy.yaml

    overrides:
      stderr_sink_level: DEBUG

      flavor: gemma4_31b_pretrain_config
      dataset: null

      train_iters: ${PRIMUS_TRAIN_ITERS:20}

      # Do not raise this without re-measuring. 4 is clean twice on the config
      # as it ships. 8 is clean twice *with* PRIMUS_GEMMA4_TURBO_LINEAR and 7%
      # faster there, but on the unpatched path it has wedged the driver twice
      # out of two attempts -- once on the same boot, minutes after two clean
      # mbs 4 runs, which is the one comparison here that controls for boot
      # state. 16 has wedged twice on every path tried.
      global_batch_size: ${PRIMUS_GBS:4}
      micro_batch_size: ${PRIMUS_MBS:4}
      seq_length: ${PRIMUS_SEQ_LENGTH:2048}

      log_interval: 1
      eval_interval: 100000
      eval_iters: 0
      skip_save: true

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null

      # Single GPU: the MI300X recipe's TP=8 cannot work here.
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      sequence_parallel: false
      use_megatron_fsdp: false
      enable_primus_turbo: false

      mock: true
      data_paths: null
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      model:
        # Depth comes from the gemma4_31b_6layer_proxy preset above.

        # Match upstream's E4B dense recipe, which the Primus recipe omits.
        # Note that transformer_impl is only honoured because of the
        # gemma4.local_spec patch -- Gemma4ModelProvider otherwise reads it
        # after the layer spec has already been frozen to TE.
        transformer_impl: local
        attention_backend: null

        # No gfx1250 build of scaled_masked_softmax_cuda. Without this the run
        # dies with ModuleNotFoundError on the first forward.
        masked_softmax_fusion: false

        # No gfx1250 build of the fused GEMM+bias-grad path.
        gradient_accumulation_fusion: false

        # Memory is not the constraint on this model, so recompute is pure cost.
        recompute_granularity: none

      # Reference fingerprint for THIS CONFIG AS IT SHIPS -- these defaults
      # exactly, HIPBLASLT_TENSILE_LIBPATH set by base_env.sh, two clean runs
      # with 0 nan and 0 skipped iterations:
      #
      #   149.3 GB peak, loss 26.265 at iteration 1 -> 26.056 at iteration 8
      #
      # Check a run against those rather than against a step time: both
      # reproduce exactly across repeats, which makes them the stricter test.
      # Absolute throughput for this part is deliberately not recorded here.
      #
      # Routing the dense linears through Primus-Turbo FlyDSL at this same shape
      # is worth 4.73x at identical peak memory, with the loss agreeing to four
      # significant figures. That patch is not part of this repo, so these
      # defaults do not reach it. The gap is GEMM layout, not the layer impl:
      # hipBLASLt has tuned exactly one of the four bf16 contraction layouts on
      # gfx1250, so the dgrad and wgrad layouts that carry two thirds of
      # training FLOPs run roughly 15x slower than the tuned one. The effect
      # grows with batch size -- 3.13x at mbs 1, 4.73x here -- as the step
      # becomes more GEMM-bound.
      #
      # Exclude iteration 1 from any timing you do take: it is ~4.6x the
      # steady-state step because it includes Triton compilation.
      #
      # Do not quote the harness TFLOP/s number for a layer-reduced proxy: it
      # derives FLOPs from the *configured* 60-layer model while only 6 are
      # built, which reads 5.27x high here, so it should be ignored.
