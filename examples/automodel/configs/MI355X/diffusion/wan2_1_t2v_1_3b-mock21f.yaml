# Primus EXP config: Wan 2.1 T2V 1.3B, AutoModel backend, synthetic 480x832 clips.
#
# Reference workload shape: 21 frames (latent 16 x 6 x 60 x 104, 9,360 tokens per
# sample), 512 text tokens, every block recomputed, 20 steps, MBS 16 / GBS 128 on 8 GPUs.
# The objective and optimizer match the Primus Megatron WAN runs at the same shape
# (uniform loss weighting, no i2v or CFG dropout, constant LR 1e-5, Adam betas
# 0.9/0.999, no weight decay, clip 1.0).
#
# Launch (inside the Primus container, 8 GPUs):
#   USE_HIPBLASLT=1 TORCH_BLAS_PREFER_HIPBLASLT=1 HIP_FORCE_DEV_KERNARG=1 GPU_MAX_HW_QUEUES=6 \
#   GPUS_PER_NODE=8 \
#   bash ./runner/primus-cli direct -- train pretrain \
#       --config examples/automodel/configs/MI355X/diffusion/wan2_1_t2v_1_3b-mock21f.yaml
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:wan2_1_t2v_1_3b-mock21f}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: automodel
    config: wan_synthetic_pre_trainer.yaml
    model: wan2_1_t2v_1_3b.yaml

    overrides:
      step_scheduler:
        max_steps: 20
        num_epochs: 1000
        local_batch_size: 16
        global_batch_size: 128
      data:
        dataloader:
          # One epoch covers all 20 steps.
          num_samples: 2560
          latent_t: 6
          latent_h: 60
          latent_w: 104
          text_seq_len: 512
      optimizer:
        lr: 1.0e-5
        weight_decay: 0.0
        betas: [0.9, 0.999]
      lr_scheduler:
        lr_decay_style: constant
        min_lr: 1.0e-5
      flow_matching:
        i2v_prob: 0.0
        cfg_dropout_prob: 0.0
        use_loss_weighting: false
      fsdp:
        enable_compile: true
        activation_checkpointing: true
      checkpoint:
        enabled: false
