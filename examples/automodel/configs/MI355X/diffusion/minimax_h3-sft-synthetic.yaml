# Primus EXP config — MiniMax-H3 full fine-tuning on synthetic data, AutoModel backend.
#
# Trains a random-weight PROXY of the model on synthetic latents (MiniMax's weight
# license excludes the US, EU, UK and South Korea). Per step it costs the same as
# fine-tuning the released weights, so the throughput and memory it reports carry
# over; the loss and any quality number do not.
#
# One-time setup:
#   python tools/automodel/make_minimax_h3_proxy_checkpoint.py --out /scratch/h3_proxy [--num-layers 4]
#   export MINIMAX_H3_PROXY=/scratch/h3_proxy
#
# Launch (inside the Primus container, 8 GPUs):
#   GPUS_PER_NODE=8 bash ./runner/primus-cli direct -- train pretrain \
#       --config examples/automodel/configs/MI355X/diffusion/minimax_h3-sft-synthetic.yaml
#
# Measured on 8x MI355X, rocm/primus:v26.8, the full 50-block proxy at this clip
# (5.2 s at 768x1344, about 38K rows): 0.05 samples/s/GPU, 159 GB peak per GPU.
#
# ON ONE GPU, use BF16 weights: model.torch_dtype=bfloat16 step_scheduler.global_batch_size=1
# AutoModel skips FSDP2 on a single rank, and with it the cast of FP32 master weights to
# the compute dtype, so FP32 weights would compute in FP32, which flash attention
# rejects ("FlashAttention only support fp16 and bf16"). Use a reduced-depth proxy there.
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:minimax_h3-sft-synthetic}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: automodel
    config: minimax_h3_sft_trainer.yaml
    model: minimax_h3.yaml

    overrides:
      step_scheduler:
        max_steps: 24
        local_batch_size: 1
        # One clip per GPU per step; raise it for gradient accumulation.
        global_batch_size: 8
      checkpoint:
        enabled: false
