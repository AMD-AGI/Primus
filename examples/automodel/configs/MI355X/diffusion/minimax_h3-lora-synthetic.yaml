# Primus EXP config — MiniMax-H3 LoRA on synthetic data, AutoModel backend.
#
# See minimax_h3-sft-synthetic.yaml for what this trains, the one-time setup and the
# launch line. LoRA needs the proxy's weights on disk (not --config-only) and the
# storage and compute dtypes to match, hence bfloat16 below; write the proxy with
# `--dtype bfloat16`.
#
# Measured on 8x MI355X, a Primus v26.8 image, the full 50-block proxy, attention + FFN
# targets, 5.2 s at 768x1344: 15.2 s per step, 0.07 samples/s/GPU; 45 GiB allocated
# per GPU in training (the device peak, during the load, is higher). Attention as in
# minimax_h3-sft-synthetic.yaml.
# On one GPU: step_scheduler.global_batch_size=1, with a reduced-depth proxy.
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:minimax_h3-lora-synthetic}
workspace: ${PRIMUS_WORKSPACE:./output}

env:
  # FP32 dq atomics for Primus-Turbo's attention backward (Primus defaults to 0, BF16).
  PRIMUS_TURBO_ATTN_V3_ATOMIC_FP32: "1"

modules:
  pre_trainer:
    framework: automodel
    config: minimax_h3_lora_trainer.yaml
    model: minimax_h3.yaml

    overrides:
      model:
        torch_dtype: bfloat16
        compute_dtype: bfloat16
      step_scheduler:
        max_steps: 24
        local_batch_size: 1
        global_batch_size: 8
      checkpoint:
        enabled: false
