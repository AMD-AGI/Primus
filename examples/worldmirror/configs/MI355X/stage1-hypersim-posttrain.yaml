work_group: ${PRIMUS_TEAM:local}
user_name: ${PRIMUS_USER:local}
exp_name: ${PRIMUS_EXP_NAME:worldmirror-stage1-hypersim}
workspace: ${PRIMUS_WORKSPACE:./output}

env:
  # The Primus default MIOPEN_FIND_MODE=2 never saves tuned convolution
  # solvers. World Mirror's changing image sizes then keep paying CPU-side
  # solver lookup and run slower kernels. Mode 5 is MIOpen's default and caches
  # results in MIOPEN_USER_DB_PATH; the first run with an empty cache is slow.
  MIOPEN_FIND_MODE: "5"
  # Changing image sizes fragment the caching allocator, which then frees and
  # reallocates memory every step. Expandable segments avoid those hipFree stalls.
  PYTORCH_HIP_ALLOC_CONF: "expandable_segments:True"

platform:
  config: platform_local.yaml

modules:
  post_trainer:
    framework: worldmirror
    config: post_trainer.yaml
    model: stage1_hypersim.yaml
    overrides:
      sink_level: null
      file_sink_level: INFO
      stderr_sink_level: INFO

      worldmirror:
        attention_backend: aiter
        hypersim_dir: ${HYPERSIM_DIR:/shared_nfs/3dwm/hywm-3dwm-sub20/hypersim}
        max_steps: ${MAX_STEPS:100000}
        max_images_per_gpu: ${MAX_IMAGES_PER_GPU:24}
        output_dir: ${OUTPUT_DIR:./output/worldmirror-stage1}
