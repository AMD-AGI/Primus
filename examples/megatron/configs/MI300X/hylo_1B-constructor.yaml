work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:hylo-1b-constructor}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    model: hylo_gdn_1B_hybrid.yaml
    overrides:
      spec: ['primus.backends.megatron.core.models.hybrid.hybrid_mamba_mla_layer_specs', 'hylo_gdn_hybrid_stack_spec']
      hybrid_override_pattern: ${HYLO_CONSTRUCTOR_PATTERN:M-*-M-M-M-*-M-M-M-M-*-M-M-M-*-M-}
      tokenizer_model: ${HYLO_TOKENIZER_MODEL:meta-llama/Llama-3.2-1B-Instruct}
      # NullTokenizer reserves one EOD id, yielding the 128256-row Llama vocab.
      vocab_size: 128255

      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null
      num_workers: 0
      create_attention_mask_in_dataloader: false

      seq_length: 128
      max_position_embeddings: 131072
      micro_batch_size: 1
      global_batch_size: 1
      train_iters: 1
      eval_iters: 0

      lr: 0.0
      min_lr: 0.0
      lr_warmup_iters: 0
      lr_decay_iters: 1
      lr_decay_style: constant

      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      finetune: false
      auto_continue_train: false
      load: null
      save: ${HYLO_CONSTRUCTOR_OUTPUT:./output/hylo-1b-constructor}
      save_interval: 1
      disable_last_saving: false
      ckpt_format: torch
      bf16: true

      enable_primus_turbo: false
      use_turbo_attention: false
