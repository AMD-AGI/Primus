# ibm-granite/granite-4.1-3b, BF16 pretrain on MI300X (mock data).
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:granite_4_1_3b-MI300X-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: granite_4_1_3b.yaml
    overrides:
      # log
      wandb_project: "Primus_Pretrain"
      # Megatron's per-iteration lines (lm loss, grad norm) are logged at DEBUG; keep them
      # on stderr (as the llama3.2_3B recipes do).
      stderr_sink_level: DEBUG

      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      train_iters: 50
      micro_batch_size: 4
      global_batch_size: 32

      seq_length: 4096
      bf16: true

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1  # dense model: no experts
      use_distributed_optimizer: true  # needed by overlap_param_gather
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null  # to save: --save DIR --save_interval N --disable_last_saving false
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # Attention configured as in the MI300X llama3.2 recipes (Primus-Turbo flash attention).
      # PrimusTurboAttention passes config.softmax_scale (Granite attention_multiplier = 1/64)
      # to the kernel, as TE does.
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_gemm: false
