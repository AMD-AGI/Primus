# ibm-granite/granite-4.1-3b, BF16 pretrain on MI300X (mock data).
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:granite_4_1_3b-MI300X-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: granite_4_1_3b.yaml
    overrides:
      # log
      wandb_project: "Primus_Pretrain"
      stderr_sink_level: DEBUG  # as in the other example configs: shows Megatron's iteration lines

      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      train_iters: 50
      micro_batch_size: 4
      global_batch_size: 32

      seq_length: 4096
      bf16: true

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1  # dense model: no experts
      use_distributed_optimizer: true  # needed by overlap_param_gather
      overlap_grad_reduce: true
      overlap_param_gather: true
      # Off: weight gradients take the unfused path (computed, then added to main_grad),
      # so training does not depend on the fused wgrad-accumulation kernel.
      gradient_accumulation_fusion: false

      # data
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      # This perf recipe writes no checkpoint (save: null, disable_last_saving: true).
      # To save, override all three: --save /abs/dir --save_interval N
      # --disable_last_saving false. keep_explicit_save_path: true then writes to /abs/dir
      # as given instead of <exp_root>/checkpoints, so a later run can --load /abs/dir.
      # ckpt_format torch (legacy, one file per TP/PP rank) loads only at the same TP/PP;
      # to load at another layout, save and load with --ckpt_format torch_dist.
      keep_explicit_save_path: true
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # Primus Turbo is turned on here (the module default is off); the per-kernel
      # use_turbo_* switches keep their defaults. Attention stays on TE: Granite's HF
      # logprob / layer parity was measured on that path. Turbo attention also receives
      # attention_multiplier as config.softmax_scale (the builder reads the scale back from
      # either attention and refuses a mismatch), so --use_turbo_attention true is
      # supported; it is not the default here because its parity is not yet measured.
      enable_primus_turbo: true
      use_turbo_attention: false
