work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:hylo-4mla12gdn-1b-8k-sft-packed}
workspace: ${PRIMUS_WORKSPACE:./output}

# Stage-2 pure-KL SFT of the 4MLA12GDN student against Llama-3.1-8B-Instruct, as HyLo's
# zebra_4MLA12GDN_8bT_SFT_8k_combined.yaml trains it: 8192-token windows packed over the templated,
# decontaminated selection (tools/hybrid/prepare_hylo_packed_data.py), 32 windows a step, KL
# averaged over every position. The student is assemble_hylo_ild.py's output on the grouped-MLA
# target (use_full_kv_head: false); hylo_4MLA12GDN_1B-8K-sft.yaml is the padded-sample variant.
modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    model: hylo_gdn_1B_hybrid.yaml
    overrides:
      spec: ['primus.backends.megatron.core.models.hybrid.hybrid_mamba_mla_layer_specs', 'hylo_grouped_mla_hybrid_stack_spec']
      hybrid_attention_ratio: 0.25
      hybrid_override_pattern: "M-*-M-M-M-*-M-M-M-M-*-M-M-M-*-M-"
      hylo_mla_kv_heads: 8

      hylo_distill_stage: sft
      hylo_teacher_checkpoint: ${HYLO_LLAMA31_8B_MEGATRON_CKPT:./data/checkpoints/llama31-8b-megatron}
      hylo_teacher_num_layers: 32
      hylo_teacher_use_rope_scaling: true
      # HyLo's train_distill.py default gives the teacher the student's YaRN; set these to the
      # student's factor and original window to train against that teacher.
      hylo_teacher_yarn_factor: ${HYLO_TEACHER_YARN_FACTOR:null}
      hylo_teacher_yarn_original_max_position_embeddings: ${HYLO_TEACHER_YARN_ORIGINAL_MAX:null}
      hylo_kl_weight: 1.0
      hylo_ce_weight: 0.0
      hylo_kl_chunk_size: 4096

      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${HYLO_TOKENIZER_MODEL:meta-llama/Llama-3.2-1B-Instruct}
      mock_data: false
      train_data_path: ${HYLO_PACKED_TRAIN_DATA:./data/hylo/packed-8k/train}
      # A reference run's recorded batches (hylo_train_dump.py), served in its order.
      hylo_order_data_dir: ${HYLO_ORDER_DATA_DIR:null}
      valid_data_path: null
      test_data_path: null
      num_workers: 2
      create_attention_mask_in_dataloader: false

      seq_length: 8192
      max_position_embeddings: 131072
      rotary_scaling_factor: 4.0
      original_max_position_embeddings: 2048
      micro_batch_size: ${HYLO_MICRO_BATCH_SIZE:4}
      global_batch_size: ${HYLO_GLOBAL_BATCH_SIZE:32}
      train_iters: ${HYLO_SFT_TRAIN_ITERS:1000}
      eval_iters: 0
      lr: 6.0e-5
      min_lr: 0.0
      lr_decay_style: cosine
      # The Trainer's warmup_ratio 0.01 is ceil(0.01 * steps) steps: 10 of 1000.
      lr_warmup_iters: ${HYLO_SFT_WARMUP_ITERS:10}
      lr_warmup_fraction: null

      # Hugging Face Trainer values used by the reference.
      seed: 42
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      clip_grad: 1.0

      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      load: ${HYLO_STAGE2_INIT_CKPT:./data/checkpoints/hylo-4mla12gdn-1b-stage2-init}
      save: ${HYLO_SFT_OUTPUT:./output/hylo-4mla12gdn-1b-8k-sft-packed}
      finetune: true
      no_load_optim: true
      no_load_rng: true
      auto_continue_train: false
      ckpt_format: torch
      save_interval: 1000
      disable_last_saving: ${HYLO_DISABLE_LAST_SAVING:false}
      bf16: true
      log_interval: 1
      log_avg_skip_iterations: 0

      enable_primus_turbo: false
      use_turbo_attention: false
