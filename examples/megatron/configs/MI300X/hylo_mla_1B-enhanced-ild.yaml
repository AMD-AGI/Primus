work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:hylo-mla-1b-enhanced-ild}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  post_trainer:
    framework: megatron
    config: sft_trainer.yaml
    model: hylo_gdn_1B_hybrid.yaml
    overrides:
      stage: sft
      spec: ['primus.backends.megatron.core.models.hybrid.hybrid_mamba_mla_layer_specs', 'hylo_gdn_hybrid_stack_spec']
      hybrid_attention_ratio: 1.0
      hybrid_override_pattern: "*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-"

      hylo_distill_stage: ild
      hylo_teacher_checkpoint: ${HYLO_LLAMA32_1B_MEGATRON_CKPT:./data/checkpoints/llama32-1b-megatron}
      hylo_teacher_num_layers: 16
      hylo_kl_weight: 1.0
      hylo_ce_weight: 0.0

      load: ${HYLO_MLA_UPCYCLED_CKPT:./data/checkpoints/hylo-mla-1b-upcycled}
      save: ${HYLO_MLA_ILD_OUTPUT:./output/hylo-mla-1b-ild}
      finetune: true
      no_load_optim: true
      no_load_rng: true
      auto_continue_train: false
      ckpt_format: torch
      save_interval: 2000
      disable_last_saving: ${HYLO_DISABLE_LAST_SAVING:false}

      tokenizer_model: ${HYLO_TOKENIZER_MODEL:meta-llama/Llama-3.2-1B-Instruct}
      sft_dataset_name: ${HYLO_SFT_DATASET:JunxiongWang/sftdatasetv3}
      sft_conversation_format: openai
      seq_length: ${HYLO_SEQ_LENGTH:4096}
      max_position_embeddings: 131072
      original_max_position_embeddings: 8192
      rotary_scaling_factor: 32.0
      micro_batch_size: ${HYLO_MICRO_BATCH_SIZE:12}
      global_batch_size: ${HYLO_GLOBAL_BATCH_SIZE:96}
      train_iters: ${HYLO_ILD_TRAIN_ITERS:1000}
      lr: 2.0e-4
      min_lr: 0.0
      lr_decay_style: cosine
      lr_warmup_iters: 0
      lr_warmup_fraction: 0.01

      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      use_distributed_optimizer: true
      overlap_grad_reduce: false
      overlap_param_gather: false
      fused_ce_mode: 0
      bf16: true
      log_interval: 1
      log_avg_skip_iterations: 0
      eval_iters: 0
      lora: {enabled: false}
