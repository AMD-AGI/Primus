###############################################################################
#
# Llama-3.1-8B BF16 pretraining on MI455X (gfx1250), Megatron backend.
#
# Full model (32 layers, hidden 4096, GQA 32/8), seq 8192, mock data, no activation
# recompute. Attention runs on Primus-Turbo's FlyDSL kernels: they need a Primus-Turbo with
# the gfx1250 head-dim-128 attention (see examples/megatron/models/llama3.1-8b/README.md).
###############################################################################

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama3.1_8B-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: llama3.1_8B.yaml
    overrides:
      # log
      wandb_project: "Primus_Llama_Pretrain"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: 10
      micro_batch_size: 4
      global_batch_size: 16
      seq_length: ${PRIMUS_SEQ_LENGTH:8192}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:8192}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # parallel
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: true
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # recompute: off
      recompute_granularity: null
      recompute_layer_ids: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # primus-turbo: FlyDSL attention (PRIMUS_TURBO_ATTN_BACKEND) and RMSNorm
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_rms_norm: true

      # cross entropy
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true
