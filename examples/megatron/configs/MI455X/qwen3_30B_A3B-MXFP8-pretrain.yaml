#
# Qwen3-30B-A3B MXFP8 pretraining on MI455X (gfx1250), Megatron backend.
#
# There is no MI455X Qwen3-30B-A3B config yet: this one starts from
# configs/MI355X/qwen3_30B_A3B-FP8-pretrain.yaml and keeps its model, sizes, batch and
# parallelism (EP8, MBS 8, GBS 512, seq 4096; PRIMUS_EP=4 on a 4-GPU node). Changes:
#   - precision: TE fp8 hybrid/tensorwise -> Turbo-only MXFP8 (turbo_precision: mxfp8; E4M3
#     data, one E8M0 scale per 32 elements) on the dense linears (use_turbo_gemm) and the expert
#     grouped GEMMs (use_turbo_grouped_gemm); fp8 / fp8_recipe unset, so TE does no FP8; master
#     weights, attention core, norms, router, embedding and LM head stay BF16;
#   - gfx1250 / MI455X settings already used by the MI455X yamls: DeepEP and sync-free MoE
#     off (gpt_oss_120B / deepseek_v3 MI455X), the muse_spark MXFP8 grouped-GEMM settings,
#     and the fused grouped MLP off (its fused-GLU MXFP8 kernel is gfx950-only).
#
# PRECISION PATH: Primus-Turbo only, no Transformer Engine FP8 (turbo_precision: mxfp8, fp8 unset),
# so TE never sees an MXFP8 recipe on gfx1250. Every linear is a Primus-Turbo module that quantizes
# itself: dense GEMMs on Turbo's FlyDSL gfx1250 WMMA-scale MXFP8 GEMM, expert GEMMs on its Triton
# MX_BLOCKWISE grouped GEMM. TE runs no MXFP8 GEMM and no FP8 at all.
#
# REQUIREMENTS (see MXFP8_README.md in this directory):
#   - a Primus-Turbo with the gfx1250 FlyDSL MXFP8 dense GEMM and hipBLASLt MXFP8 refused on
#     gfx1250 (AMD-AGI/Primus-Turbo branch fix/gemm/mxfp8-gfx1250-flydsl on dev/mi455x_v6), built for
#     gfx1250. The Turbo 0.6.1.dev31 of amdprimus/amdprimus:tas-20261109[-fix1] and upstream
#     dev/mi455x_v6 run MXFP8 through hipBLASLt on gfx1250 and get it wrong (SNR ~5 dB) silently.
#     mxfp8_preflight.py must print "MXFP8 PREFLIGHT: PASS".
###############################################################################

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:qwen3_30B_A3B-MXFP8-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: ${PRIMUS_MODEL:qwen3_30B_A3B}.yaml
    overrides:
      # log
      wandb_project: "Primus_Qwen3_30B_A3B_Pretrain"
      stderr_sink_level: DEBUG

      # debug
      moe_router_force_load_balancing: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: 50
      micro_batch_size: 8
      global_batch_size: 512
      seq_length: ${PRIMUS_SEQ_LENGTH:4096}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # recompute
      recompute_granularity: full # full, selective
      recompute_method: block # uniform, block
      recompute_num_layers: 0 # int

      # parallel
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:8}
      overlap_grad_reduce: true
      overlap_param_gather: true

      # data
      mock_data: true
      # unused by causal flash attention; building it per micro-batch slows MoE on Megatron-core 0.19
      create_attention_mask_in_dataloader: false
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # optimizer
      use_precision_aware_optimizer: true
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16

      # rope fusion
      enable_experimental: true
      apply_rope_fusion: true

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # Turbo
      enable_primus_turbo: true
      use_turbo_attention: false
      # head_dim 128 needs a Primus-Turbo with QK_RMSNORM_ROPE_HEAD_DIMS; older Turbo keeps the unfused path
      use_turbo_fused_qk_rmsnorm_rope: true
      # MXFP8 on the Primus-Turbo linears only; fp8 / fp8_recipe stay unset, so TE does no FP8
      turbo_precision: mxfp8
      # dense linears (QKV with its input norm, O) are Turbo modules
      use_turbo_gemm: true
      # Expert GEMMs: Turbo grouped linears. Must stay on: with it off the experts are TE grouped
      # linears, which run BF16 here (TE does no FP8 in this mode). Turbo's MXFP8 grouped GEMM on
      # gfx1250 is its Triton MX_BLOCKWISE backend (FlyDSL MX grouped and CK are gfx950-only;
      # hipBLASLt grouped has no MX). Gate: the grouped checks of mxfp8_preflight.py (Qwen3 expert
      # shape, balanced and unaligned counts).
      use_turbo_grouped_gemm: true
      use_turbo_rms_norm: false # bug
      # MI355X FP8 uses the fused grouped MLP; its MXFP8 fused-GLU kernel asserts gfx950
      # (turbo_precision also requires it off: the fused op bypasses the per-module MXFP8 switch)
      turbo_fused_grouped_gemm: false
      use_turbo_fused_act_with_probs: true
      # needs turbo_fused_grouped_gemm + DeepEP and is tensorwise-only
      turbo_fp8_permute: false
      # as in muse_spark_816B_A42B-MXFP8: the fp32-accumulating expert wgrad fusion is BF16-only
      turbo_grouped_gemm_wgrad_accum_fusion: false
      # as in muse_spark_816B_A42B-MXFP8: feed Turbo the unaligned per-expert token counts directly
      turbo_grouped_gemm_without_padding: true

      # deepep: off on MI455X (as gpt_oss_120B / deepseek_v3 MI455X); MI355X used it with 160 CUs
      use_turbo_deepep: false
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32
      turbo_sync_free_moe_stage: 0

      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true

      # MXFP8: turbo_precision above (no fp8 / fp8_recipe)
      moe_use_legacy_grouped_gemm: false
      gradient_accumulation_fusion: true
