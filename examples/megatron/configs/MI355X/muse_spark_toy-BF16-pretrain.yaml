work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:muse_spark_toy-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# Muse Spark (text decoder of Muse-Spark-Open-816B-A42B) BF16 pretraining on MI355X:
# a small model with the same blocks (preset muse_spark_toy.yaml: 4 layers, hidden 1024,
# 16 experts top-4) on ONE node (8 GPUs, EP 1 by default). For the released sizes use
# muse_Spark_Open_816B_A42B-BF16-pretrain.yaml.
#   Model code: primus/backends/megatron/core/models/muse_spark/.
#   HF -> Megatron weights: primus/backends/megatron/checkpoint/native_loader_muse_spark.py.

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: muse_spark_toy.yaml
    overrides:
      # depth comes from the preset (muse_spark_toy.yaml: num_layers 4); cut or grow it
      # with --num_layers on the command line (a deeper model also needs
      # --window_attn_skip_freq / --no_rope_freq lists of num_layers entries)

      # log
      wandb_project: "Primus_Muse_Spark"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: ${TRAIN_ITERS:20}
      micro_batch_size: ${MBS:1}
      global_batch_size: ${GBS:16}
      seq_length: ${PRIMUS_SEQ_LENGTH:4096}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      # from random weights: a pretraining rate (as qwen3_235B_A22B-BF16-pretrain.yaml)
      lr: 1.0e-4
      min_lr: 1.0e-5
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true

      # parallel (expert_tensor_parallel_size stays 1: post_expert_norm needs full rows)
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:1}
      expert_tensor_parallel_size: 1
      sequence_parallel: ${PRIMUS_SP:true}  # MoE + TP needs SP; Megatron turns it off at TP 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: ${PRIMUS_MOCK_DATA:true}
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: false

      # recompute: off by default; e.g. RECOMPUTE_GRANULARITY=full RECOMPUTE_METHOD=uniform
      # PRIMUS_RECOMPUTE_LAYERS=1, or RECOMPUTE_GRANULARITY=selective (method / layers unset)
      recompute_granularity: ${RECOMPUTE_GRANULARITY:null}
      recompute_method: ${RECOMPUTE_METHOD:null}
      recompute_num_layers: ${PRIMUS_RECOMPUTE_LAYERS:null}

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      # from random weights: aux-loss-free load balancing (the base preset keeps the
      # released checkpoint's selection bias frozen, rate 0.0, for fine-tuning)
      moe_router_bias_update_rate: 1.0e-3
      save: null
      save_interval: 20000
      disable_last_saving: true
      # torch_dist: the format of the native converter's checkpoint (Megatron reshards it on
      # load); auto-detect also loads a legacy torch checkpoint
      ckpt_format: torch_dist
      auto_detect_ckpt_format: true
      eval_iters: 0

      # Primus-Turbo grouped GEMM for the experts (MuseSparkTurboGroupedMLP keeps the
      # per-expert post_expert_norm). DeepEP stays off: the toy runs EP=1 by default, so
      # there is no cross-rank dispatch to speed up (set use_turbo_deepep: true with EP>1).
      # Turbo attention stays off: Muse Spark uses TE attention with a sliding window.
      # PRIMUS_ENABLE_TURBO=false gives the plain TE path.
      enable_primus_turbo: ${PRIMUS_ENABLE_TURBO:true}
      use_turbo_attention: false
      use_turbo_grouped_gemm: true
      use_turbo_deepep: false

      # Megatron's fused vocab-parallel CE stays off (plain CE on the soft-capped logits).
      # Primus's chunked linear+CE (enable_fused_linear_ce: true / FUSED_LINEAR_CE=1) is
      # allowed: it applies the soft-cap per chunk through MuseSparkModel._scale_logits.
      cross_entropy_loss_fusion: false
