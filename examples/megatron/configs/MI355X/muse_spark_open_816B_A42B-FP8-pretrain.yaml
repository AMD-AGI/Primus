work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:muse_spark_open_816B_A42B-fp8-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# Minimum footprint: 9 nodes (72 MI355X GPUs), TP1 x PP9 x EP8, dense DP8,
# expert DP1. FP8 tensorwise keeps an fp32 master copy next to the bf16
# param, ~13 GB more per layer than BF16 at EP8: the 8-layer stage proxy
# (embedding and LM head included, full recompute) peaks at 281 GB of 288 GB,
# so stages hold at most 7 layers (~85%). On the same proxy FP8 steps were
# only ~4% faster than BF16; the 5-node BF16 config is the cheaper minimum.
# The single-node muse_spark_open_816B_A42B_4layer-BF16-pretrain.yaml is the
# bring-up config.

# The runner enables Transformer Engine's Triton FP8 cast-transpose, which
# autotunes once per new tensor shape. Expert token counts change every step,
# so it keeps retuning and FP8 steps stall. The HIP cast kernel has no
# per-shape cost.
env:
  NVTE_USE_CAST_TRANSPOSE_TRITON: "0"

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: ${PRIMUS_MODEL:muse_spark_open_816B_A42B}.yaml
    overrides:
      # ---------------------------------------------------------------------
      # Muse Spark notes. Each item below is rejected by muse_spark_builder
      # rather than silently changing the model:
      #
      #   1. turbo_sync_free_moe_stage stays 0 and
      #      moe_use_fused_router_with_aux_score false. The fused router
      #      ignores the expert bias Muse routes with, and every sync-free
      #      stage forces it on. use_turbo_deepep is set separately below.
      #   2. moe_use_legacy_grouped_gemm stays false. The legacy GroupedMLP
      #      ignores moe_latent_size.
      #   3. No fused linear cross entropy and no PRIMUS_FUSED_RESIDUAL_NORM:
      #      they skip the logit softcap and the gated residual respectively.
      #
      # num_layers / no_rope_freq / window_attn_skip_freq need no override:
      # the config class derives the hybrid attention pattern from num_layers.
      # ---------------------------------------------------------------------

      # log
      wandb_project: "Primus_Muse_Spark_Pretrain"
      stderr_sink_level: DEBUG

      # debug. Forced load balancing makes routing uniform: right for a
      # throughput measurement, wrong for a real training run.
      moe_router_force_load_balancing: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters. gbs 512 / mbs 1 over dense DP8 is 64 micro-batches
      # per step, an ~11% PP9 bubble.
      train_iters: 50
      micro_batch_size: ${PRIMUS_MICRO_BATCH_SIZE:1}
      global_batch_size: ${PRIMUS_GLOBAL_BATCH_SIZE:512}
      seq_length: ${PRIMUS_SEQ_LENGTH:4096}
      # The preset materialises the RoPE cache at 1048576; override it down to
      # the run's seq_length.
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true

      # parallel. 62 layers over 9 stages, 7 each and 6 on the LM-head stage.
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:9}
      pipeline_model_parallel_layout: "${PRIMUS_PP_LAYOUT:Et*7|t*7|t*7|t*7|t*7|t*7|t*7|t*7|t*6,L}"
      expert_model_parallel_size: ${PRIMUS_EP:8}
      sequence_parallel: false
      use_distributed_optimizer: true
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: true

      # optimizer
      use_precision_aware_optimizer: true
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16

      # recompute every layer of a stage; the memory above was measured that way.
      recompute_granularity: full
      recompute_method: block
      recompute_num_layers: ${PRIMUS_RECOMPUTE_NUM_LAYERS:7}

      # data. The attention kernel applies causality and the sliding window
      # itself, so no dense [b, 1, s, s] mask is needed.
      create_attention_mask_in_dataloader: false
      mock_data: true
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # MoE
      moe_use_legacy_grouped_gemm: false
      moe_use_fused_router_with_aux_score: false
      moe_permute_fusion: true

      # rope fusion
      apply_rope_fusion: true

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # Turbo. use_turbo_rms_norm forwards zero_centered_gamma to TE.
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_grouped_gemm: false
      use_turbo_rms_norm: true

      # deepep
      use_turbo_deepep: true
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32
      # 64 or 80 for ep8, 32 for ep16-64 is best practice
      turbo_deepep_num_cu: 80
      turbo_deepep_use_comm_stream: false
      turbo_sync_free_moe_stage: 0

      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true

      # Hybrid FP8: E4M3 forward, E5M2 backward. QKV/gate, output projection,
      # latent projections and expert SwiGLU run as TE FP8 GEMMs. Router,
      # norms, residual gates, attention, embeddings and the LM head stay in
      # BF16. Tensorwise (current) scaling takes each scale from the tensor
      # being cast, so FP8 is correct from the first step.
      fp8: hybrid
      fp8_recipe: tensorwise

      # training control
      manual_gc: true
      manual_gc_interval: 1
      disable_wandb: true
      disable_tensorboard: true
