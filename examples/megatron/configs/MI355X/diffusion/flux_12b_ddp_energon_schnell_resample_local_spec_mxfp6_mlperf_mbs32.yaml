# Flux 12B Schnell Training — DDP + Local Spec + MXFP6
# (MLPerf Mode, MI355X, single node, MBS=32 / GBS=256)
#
# The MBS=32 submission recipe for MXFP6, on one 8x MI355X node. Its sibling
# ...local_spec_mxfp6_mlperf.yaml is the same recipe at MBS=64 / GBS=512; the
# two differ ONLY in the batch shape and in the step counts that keep the
# sample budget identical between them. Everything the ruleset pins -- AdamW
# 0.9/0.95/1e-8, weight decay 0.1, gradient clip 1.0, the evaluation cadence in
# samples -- is the same on purpose and must not be tuned. For MXFP6
# development work without the MLPerf machinery, use
# flux_12b_ddp_energon_schnell_resample_local_spec_mxfp6.yaml.
#
# Why a second batch shape at all: MBS=32 is the shape the optimization
# campaign was measured at, so it is the one whose step time has a directly
# comparable reference. MBS=64 fits the card and amortizes better; MBS=32
# leaves materially more headroom (peak memory at MBS=64 is most of the 288 GB).
#
# Performance-relevant settings in this file were swept at MBS=64/GBS=512 --
# the bucket size, the optimizer dtypes, the fused-MLP throughput figure. The
# settings transfer (the collective path and the fused kernels are identical);
# the absolute numbers quoted in their comments do not. Re-measure before
# quoting any of them for this shape.
#
# Hardware: gfx950 (MI350/MI355) only. The A6W6 kernels are gfx950 assembly, so
# unlike MXFP4 there is no fallback path on older parts, and startup fails
# loudly on an aiter that lacks them rather than quietly training in bf16.
#
# Shape constraint: every MXFP6 GEMM needs M, N and K to be multiples of 256.
# Flux 12B satisfies this at every replaced linear, and M = micro_batch_size *
# tokens stays aligned at the batch sizes here.
#
# Before this produces a submittable log: the compliance checker accepts a
# fixed vocabulary for lowest_numerical_precision_in_linear and mxfp6 is not in
# it. A run under this recipe is a valid run whose log the checker rejects on
# that key alone, until the format is accepted upstream.

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:flux_12b_ddp_local_mxfp6_mlperf_mbs32}

workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    model: diffusion/flux_12b.yaml

    trainer_class: FluxPretrainTrainer

    overrides:
      model_type: flux_schnell

      # ==========================================
      # MLPerf Mode
      # ==========================================
      mlperf_mode: true
      warmup_train_steps: 2
      # Evaluation is forward-only under no_grad with model.eval(), a different Dynamo
      # guard state from anything warmup_train_steps traces, so without this the 57
      # per-block graphs compile at the first evaluation -- after run_start, and so
      # inside the timed region. Bit-identical at per_step_rng_reseed: true (set
      # below): warmed and unwarmed agree on every per-iteration loss.
      warmup_validation_steps: 2
      target_val_loss: 0.586

      # Left explicit because the FP8 MLPerf recipe and the MXFP6 development
      # recipe disagree on it, and the difference is a different LR trajectory
      # through warmup rather than a stylistic one. This matches the FP8 MLPerf
      # recipe, which is the configuration the convergence evidence so far was
      # collected under; flipping it is a convergence experiment, not a cleanup.
      nemo_aligned_lr_warmup: false

      # ==========================================
      # MLPerf Training v5.1 Alignment
      # ==========================================
      timestep_sampling_strategy: "direct_uniform"
      activation_func: "openai_gelu"
      cfg_dropout_prob: 0.1

      # VAE latent normalization (required for resample mode)
      vae_scale: 0.3611
      vae_shift: 0.1159
      vae_latent_mode: resample

      # RoPE: must be interleaved to match Flux's EmbedND doubled-frequency layout
      rotary_interleaved: true

      # ==========================================
      # PrimusTurboFloat8LocalSpecProvider
      # ==========================================
      transformer_impl: "local"

      # ==========================================
      # DATA — Real Energon data (not mock)
      # ==========================================
      mock_data: false
      dataloader_type: external
      data_path: ${PRIMUS_DIFFUSION_DATA_PATH:/path/to/energon/dataset}
      num_workers: 16
      prefetch_factor: 4
      max_samples_per_sequence: null

      # Training iterations
      #
      # This is a safety cap, not a target: the run stops at the quality
      # threshold, and reaching it is the result. The reference convergence
      # points for flux1 (mlperf_logging rcp_checker
      # training_6.0.0/rcps_flux1.json, 20 NVIDIA BF16 runs) span 7077888 to
      # 7602176 samples. At this recipe's GBS of 256 that is 27648 to 29696
      # steps, twice the step count of the GBS 512 recipe for the same samples.
      #
      # Every schedule here is therefore expressed so that the *sample* budget
      # matches the GBS 512 sibling exactly -- 32000 steps is the same 8192000
      # samples, lr_warmup_iters 3200 the same 819200, and eval_interval 1024
      # the same 262144 samples between evaluations. Keep them in that
      # relationship if either recipe's budget changes, otherwise the two stop
      # being a controlled comparison of batch size.
      train_iters: 32000
      eval_interval: 1024
      # Cover the whole MLPerf validation set. eval_iters is derived from this
      # (29696 / 256 = 116); setting both is rejected.
      eval_samples: 29696
      # 1, not the training num_workers and not 0. Anything above 1 can under-read
      # the split; 1 is the one nonzero value that cannot, because Energon clamps
      # the data split to max(1, num_workers) (sharder.py:205), so 1 shards exactly
      # as 0 does and covers the split identically, while 0 additionally forgoes
      # prefetch by reading in the main process. val_loss is unchanged between the
      # two. assert_val_worker_divisibility accepts 1 at this single-node shape:
      # 29696 % (32 * 1 * 8) == 0.
      val_num_workers: 1
      # MLPerf assigns each val image one fixed timestep, carried in the Arrow
      # 'timestep' column. Requires a val split ingested with that column; shards
      # ingested earlier carry {"key": ...} only and will now fail loudly rather
      # than silently fall back to injecting t = index % 8.
      eval_timestep_source: dataset
      log_interval: 10
      save_interval: 10000

      # Batch configuration
      micro_batch_size: 32
      global_batch_size: 256
      seq_length: 512

      # ==========================================
      # BF16 + FP8 Precision
      # ==========================================
      bf16: true
      fp16: false
      params_dtype: bfloat16
      grad_reduce_in_bf16: true

      # Optimizer settings (MLPerf v5.1)
      optimizer: adam
      lr: 2.0e-4
      min_lr: 2.0e-4
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1.0e-8
      clip_grad: 1.0

      # Learning rate scheduler (warmup-hold, no decay)
      lr_warmup_iters: 3200
      # Inert while lr_decay_style is constant; kept equal to the budget so
      # it cannot be misread as a decay that ends a quarter of the way in.
      lr_decay_iters: 32000
      lr_decay_style: constant

      # ==========================================
      # Megatron DDP + Distributed Optimizer
      # ==========================================
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      context_parallel_size: 1

      use_torch_fsdp2: false
      use_megatron_fsdp: false

      use_distributed_optimizer: true
      overlap_grad_reduce: true
      overlap_param_gather: true
      overlap_param_gather_with_optimizer_step: false
      # FP32 optimizer momentums (m, v) and FP32 master weights, via the
      # precision-aware optimizer rather than by switching it off.
      #
      # Both routes give FP32 momentums. The difference is what else they pin.
      # With use_precision_aware_optimizer false, Megatron additionally keeps
      # main_grads in FP32; that was measured at MBS=64/GBS=512 against this
      # configuration and costs +6.9 ms per 512 images (+0.85%) and +16.2 GB of
      # peak memory (267.0 against 250.8 GB). 267 of 288 GB is most of the card,
      # which is the number that matters if this recipe ever moves to a larger
      # micro-batch.
      #
      # So: momentums and master weights FP32, where precision is load-bearing;
      # main_grads BF16, matching the gradients DDP already reduces
      # (grad_reduce_in_bf16 above), so the reduce path is unchanged and the
      # bucket-size sweep below transfers directly.
      use_precision_aware_optimizer: true
      main_params_dtype: fp32
      main_grads_dtype: bf16
      exp_avg_dtype: fp32
      exp_avg_sq_dtype: fp32

      # Average in the collective instead of scaling afterwards. Measured
      # loss-bit-identical at DP=8 across all 1000 iterations: RCCL's AVG is a
      # different reduction from its SUM and does perturb gradients (~4.8 bf16
      # ulp on 58.7% of elements), but the 1/8 itself is an exact power of two
      # and so rides across the collective for free.
      ddp_average_in_collective: true

      # Overwrite each main-grad slice on its first gradient instead of clearing
      # the whole contiguous buffer before backward.
      defer_grad_buffer_zero: true

      # Swept in this recipe's own optimizer regime rather than inherited from the
      # development one. The Megatron default of 256000000 elements is the worst of
      # the four sizes measured here: 1024000000 gives 801.9 ms per 512 images
      # against 819.3, worth -17.4 ms, with peak memory unchanged (266.0 GB against
      # 267.0). 512000000, the value the MLPerf v6.0 reference moved to, is an
      # improvement but not the best one at 806.4.
      #
      # The collective path is identical to the development recipe's -- both reduce
      # bf16 gradients (grad_reduce_in_fp32=False) and both build 43 buckets with the
      # same element counts at this bucket size -- so the same 1024000000 optimum was
      # expected here, and the win is the same -17.4 ms to the decimal.
      #
      # Do not push this further in one direction. Both ends lose: small buckets pay
      # per-call overhead and get thin per-call bandwidth, and buckets spanning most
      # of the model cannot start their reduce-scatter until far into backward, which
      # re-exposes the tail. See mbs32_e2e/README.md in tiger-training-internal.
      ddp_bucket_size: 1024000000
      use_fsdp2_fp32_param_optimizer: false

      ckpt_format: torch_dist

      gradient_accumulation_fusion: false
      check_for_nan_in_loss_and_grad: false

      # ==========================================
      # MXFP6 — Block-scaled (E2M3 + E8M0 over 32) via Primus Turbo + AITER
      # ==========================================
      use_flash_attn: true

      # Primus-owned field: Megatron has no notion of a 6-bit format, so fp6 must
      # not be combined with fp4 or fp8 (rejected in
      # BaseDiffusionConfig.__post_init__).
      fp6: "mxfp6"
      mxfp6_backward_precision: "mxfp6"  # "mxfp6" (pure) or "fp8" (hybrid)

      # Have the MXFP6 wgrad GEMM write weight.main_grad itself, replacing the
      # elementwise add Megatron's DDP hook would otherwise run. Valid here
      # because this recipe runs one microbatch per optimizer step.
      mxfp6_fused_wgrad_accum: true

      # ==========================================
      # MXFP6 fusion gates
      #
      # These are the measured optimization set, and they are the difference
      # between this recipe and a run that is ~6% slow while looking entirely
      # healthy -- every hand-written kernel untouched, the compiled Triton
      # layer roughly doubled. They were environment variables during the
      # campaign; a set of arms built without five of them read as a 25 ms
      # *hardware* regression and was chased through clocks, thermals, GPU
      # tenants and the compiler cache before a kernel census found them.
      # That is why they live in the config now.
      #
      # "on" rather than "auto" for the two tri-states: a submission run wants
      # a configuration the fusion cannot reproduce exactly to be an error, not
      # a silent per-module fallback, otherwise the measured throughput and the
      # disclosed implementation can quietly diverge.
      # ==========================================

      # MLP bias-add + GELU folded into the MXFP6 packer. ~5% of step time
      # (74.1 -> 78.0 images/s/GPU on 8x MI355X at micro_batch_size 64).
      mxfp6_fused_mlp: "on"
      # Both MLP linears as one grouped A6W6 GEMM.
      mxfp6_grouped_mlp: true
      # Q, K and V projected in a single GEMM.
      mxfp6_joint_qkv: true
      # Attention V fed to the packer strided, skipping a repack. Also -3.5 GB.
      mxfp6_strided_v: true
      # Bias and QK-norm gradients routed into main_grad directly.
      mxfp6_fused_small_grads: true
      # QK-norm fused into the RoPE kernel.
      mxfp6_fused_qk_rope: true
      # Whole QKV norm+RoPE prologue folded into the packer.
      mxfp6_fused_qkv: "on"
      # Single-pass LN-modulate backward.
      mxfp6_fused_ln_mod_bwd: true
      # Pin the norm/RoPE autotune configs. The spaces are within 2.8% and the
      # winner is not stable between runs, so leaving the tuner on moves the
      # step time a measurement is trying to read.
      mxfp6_norm_rope_pin: true

      # Clip gradients with one flat mul_ per contiguous run instead of the
      # chunked multi_tensor applier.
      flat_grad_clip: true

      empty_unused_memory_level: 0

      distributed_timeout_minutes: 60
      distributed_backend: nccl

      # Checkpointing (disabled for MLPerf)
      finetune: false
      save: null
      load: null
      no_save_optim: true
      no_save_rng: true
      auto_continue_train: false
      disable_last_saving: true

      # Logging — suppressed by mlperf_mode
      tensorboard_dir: null
      wandb_project: null
      log_throughput: false
      wall_clock_step_timer: true
      log_timers_to_tensorboard: false
      log_batch_size_to_tensorboard: false
      log_learning_rate_to_tensorboard: false
      log_memory_to_tensorboard: false

      # Profiler — disabled for MLPerf
      profile: false

      # Primus Turbo
      enable_primus_turbo: true
      use_turbo_attention: true
      use_dual_fp8_output_projection: false

      # Each run in a submission campaign needs its own seed, supplied from
      # outside so the value in the log is the value the launcher chose.
      seed: ${PRIMUS_SEED:2025}
      # MLPerf-aligned per-step CUDA RNG reseed (defaults off elsewhere; MLPerf
      # reproduction must opt in for run-to-run determinism).
      per_step_rng_reseed: true

      # Torch Compile — per_block: compile each transformer layer individually
      torch_compile:
        enable: true
        strategy: "per_block"
        backend: "inductor"
        mode: "default"
        fullgraph: false
        compile_optimizer: false
        emulate_precision_casts: false
        fused_ln_modulate: true
