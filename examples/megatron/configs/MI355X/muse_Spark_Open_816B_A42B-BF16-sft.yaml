work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:muse_spark_816B_A42B-sft}
workspace: ${PRIMUS_WORKSPACE:./output}

# Muse-Spark-Open-816B-A42B (text decoder) BF16 SFT from the released Hugging Face weights,
# on ONE node of MI355X (8 GPUs). Launch with the post-train entrypoint, which converts the
# checkpoint first (runner/helpers/hooks/train/posttrain/megatron/01_convert_checkpoints.py):
#   ./runner/primus-cli direct -- train posttrain --config <this file>
# with tokenizer_model set to the HF snapshot on the command line (--tokenizer_model <dir>);
# the preset's tokenizer_model is the Hub id. The convert hook reads the HF path from it.
#
# Model: by default the 4-layer proxy (muse_spark_816B_A42B_proxy: the released layers
# 0-3, all 256 experts, ~58B params), which converts and trains on this one node as is.
# The full 62-layer 816B model does not fit on one node (~14.7 TB of model states) and is
# above the single-process converter's limit (native_ckpt_max_params, 60B): for it use
# PRIMUS_MODEL=muse_Spark_Open_816B_A42B on many nodes (see the pretrain file's layouts)
# with an already converted checkpoint as pretrained_checkpoint (the hook then skips the
# conversion).
#
# Conversion: muse_spark is a native (bridge-free) family by default. The native converter
# (primus/backends/megatron/checkpoint/native_loader_muse_spark.py) builds the model at
# TP=PP=EP=1 and saves a torch_dist checkpoint, which Megatron reshards on load, so this
# file trains at EP 8 (32 experts per GPU).
#   Model code: primus/backends/megatron/core/models/muse_spark/.

modules:
  post_trainer:
    framework: megatron
    config: sft_trainer.yaml
    model: ${PRIMUS_MODEL:muse_spark_816B_A42B_proxy}.yaml
    overrides:
      stage: sft
      stderr_sink_level: DEBUG
      log_interval: 1
      disable_wandb: true
      disable_tensorboard: true

      # hyper parameters
      train_iters: ${TRAIN_ITERS:10}
      micro_batch_size: ${MBS:1}
      global_batch_size: ${GBS:8}
      seq_length: ${PRIMUS_SEQ_LENGTH:2048}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 0
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      hidden_dropout: 0.0
      attention_dropout: 0.0

      # parallel (expert_tensor_parallel_size stays 1: post_expert_norm needs full rows)
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:8}
      expert_tensor_parallel_size: 1
      sequence_parallel: ${PRIMUS_SP:true}  # MoE + TP needs SP; Megatron turns it off at TP 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false
      use_distributed_optimizer: true

      # data (SFT: the HF tokenizer and a jsonl / HF dataset)
      mock_data: false
      sft_dataset_name: ${SFT_DATASET:tatsu-lab/alpaca}
      sft_conversation_format: alpaca
      eval_iters: 0

      # checkpoint: the converted torch_dist checkpoint, weights only. With no
      # pretrained_checkpoint (the default) the post-train hook converts the HF weights
      # first; that works for the default proxy model only. For the full model
      # (PRIMUS_MODEL=muse_Spark_Open_816B_A42B, above native_ckpt_max_params) the hook
      # stops up front. Either raise native_ckpt_max_params to 816000000000 on a host
      # with ~3.3 TB RAM (the hook then converts), or convert once and set it, e.g.
      #   pretrained_checkpoint: /path/to/muse_spark_816B_torch_dist
      # (or --pretrained_checkpoint <dir> on the command line).
      finetune: true
      ckpt_format: torch_dist
      auto_detect_ckpt_format: true
      auto_continue_train: false
      load: null
      save: null
      disable_last_saving: true
      no_save_optim: true

      # MoE path as the pretrain file: Turbo grouped GEMM experts, alltoall dispatcher
      enable_primus_turbo: ${PRIMUS_ENABLE_TURBO:true}
      use_turbo_attention: false
      use_turbo_grouped_gemm: true
      use_turbo_deepep: false
      moe_token_dispatcher_type: alltoall
      moe_permute_fusion: true
      cross_entropy_loss_fusion: false
