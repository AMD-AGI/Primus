work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gdn_1B_BF16-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: gdn_1B.yaml
    overrides:
      wandb_project: "Primus_Hylo_1B_GDN_Pure_Pretrain"
      stderr_sink_level: DEBUG

      eval_iters: 0

      num_workers: 32
      create_attention_mask_in_dataloader: false

      profile: false
      use_pytorch_profiler: false
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      log_interval: 1
      tensorboard_log_interval: 10

      # --- Optimal MI355X fusion recipe (see zebra_parity README §8) ---
      # fused_ce_mode 2 = materialize bf16 logits + fused Triton CE (no-permute
      # copy) == FLA's exact CE computation; ~30% faster than the chunked
      # default (mode 1). FLA fused SwiGLU/RMSNorm/short-conv match FLA
      # bit-for-bit and remove per-layer transposes/copies.
      fused_ce_mode: 2
      fused_ce_chunks: 8
      use_fla_fused_swiglu: true
      # NOTE: use_fla_fused_rmsnorm is intentionally left OFF. On this build the
      # hylo hybrid_block residual-fusion path (hybrid_block.py:369) unpacks
      # exactly 2 values from pre_mlp_layernorm; FLA's fused RMSNorm returns a
      # different arity -> "too many values to unpack". Keep the Megatron norm.
      use_fla_short_conv: true
      # bias_swiglu_fusion stays at its default (on): turning it off alongside
      # the FLA fused SwiGLU measured ~24 ms/it slower at MBS=32 (561.5 ->
      # 586.3) with identical peak memory.
      empty_cache_interval: 128
      check_for_nan_in_loss_and_grad: false
      barrier_with_L1_time: false

      # Throughput recipe (8 GPUs, no grad-accum: GBS = MBS * 8).
      # MI300X maxed occupancy the same way: MBS=56 / GBS=448 at 97.1% of
      # 192 GB (BS=512 OOM). GDN has no hipBLASLt shape limit, so batch scales
      # freely here.
      #
      # Measured on MI355X (288 GB): MBS=64 / GBS=512 sits at 94% VRAM.
      # MBS=56 / GBS=448 was 83%. Drop to MBS=2 / GBS=16 for FLA parity.
      train_iters: 50
      micro_batch_size: 64
      global_batch_size: 512

      seq_length: 2048
      max_position_embeddings: 2048
      original_max_position_embeddings: 2048

      # Optimizer — matched to FLA:
      #   lr=2e-4, cosine (min_lr_rate=0.1 → min_lr=2e-5)
      #   AdamW, beta1=0.9, beta2=0.95, weight_decay=0.01
      #   max_grad_norm=1.0, warmup_steps=200
      clip_grad: 1.0
      lr: 2.0e-4
      min_lr: 2.0e-5
      lr_warmup_iters: 200
      lr_decay_iters: 76294
      lr_decay_style: cosine
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: false

      # Pure GDN hybrid spec (hybrid_attention_ratio=0.0 → all GDN, no MLA)
      spec: ['primus.backends.megatron.core.models.hybrid.hybrid_mamba_mla_layer_specs', 'gdn_hybrid_stack_spec']

      # Tokenizer
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: meta-llama/Llama-3.2-1B

      # Parallelism
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false
      use_torch_fsdp2: false
      use_distributed_optimizer: true

      # Data
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # Checkpoints
      finetune: false
      auto_continue_train: true
      load: null
      save: ./output/gdn_1B_BF16-pretrain
      save_interval: 2048
      disable_last_saving: false
      ckpt_format: torch

      # Turbo
      enable_primus_turbo: false
      use_turbo_attention: false

      # Context parallel
      context_parallel_size: 1
