work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:qwen2.5_72B-lora-longalign-fp8}
workspace: ${PRIMUS_WORKSPACE:./output}

# =============================================================================
# Qwen2.5-72B LoRA SFT (FP8 hybrid + delayed) — LongAlign-10k @ 128k
# =============================================================================
# Twin of qwen2.5_72B-BF16-lora-longalign.yaml with TE FP8 hybrid (E4M3 fwd /
# E5M2 bwd) + delayed scaling. Master + LoRA adapters stay BF16.
#
# TP=1 always (weights replicated). CP=8 shards the 131072-token sequence
# (~16k tokens/rank). Full block recompute (80 layers).
# use_turbo_attention: false when CP>1.
#
# Hardware: 1 node × 8× MI355X (288 GB HBM/GPU).
#
# FP8 notes:
#   * fp8: hybrid + fp8_recipe: delayed (TE delayed scaling).
#   * use_turbo_gemm: false — Primus-Turbo GEMM only supports
#     tensorwise / blockwise / mxfp8, not delayed.
#   * add_qkv_bias: true — stabilizes grad norms under FP8 LoRA.
#   * no_fp8_weight_transpose_cache: true — avoid a second FP8 weight buffer.
#
# Memory @ 128k, TP=1 CP=8: FP8 compute + ~22 GB recomputed layer inputs
# (80 × 16k tokens). Without CP sharding the layer inputs alone ~172 GB.
#
# TP×PP×CP = 8 leaves DP=1, so global_batch_size 8 runs as 8 gradient
# accumulation steps rather than 8 parallel samples.
#
# seq_length must be divisible by 2 × CP (Megatron's striped chunk assignment).
#
# Dataset: THUDM/LongAlign-10k → packed 131072-token bins (HF cache under
# ${DATA_PATH}/huggingface when DATA_PATH=/data).
#
# Container layout (bind-mount once; yaml defaults below — no exports required):
#   /data/megatron_checkpoints/Qwen2.5-72B/  — Megatron torch_dist base
#   /data/huggingface/                       — HF datasets/tokenizers (HF_HOME)
#
# Required before launch (ROCm fragmentation):
#   export PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
#
# If iter-1 still OOM in LoRA MLP (linear_fc1 adapter):
#   1) PRIMUS_SEQ_LENGTH=65536 PRIMUS_MAX_POSITION_EMBEDDINGS=65536
#      PRIMUS_DISABLE_PACK_CACHE=1
#   2) LoRA on attention only — remove linear_fc1/linear_fc2 from
#      lora.target_modules below
#
# Throughput lever once stable: export PRIMUS_RECOMPUTE_LAYERS=8
#
# BF16 sibling:
#   examples/megatron/configs/MI355X/qwen2.5_72B-BF16-lora-longalign.yaml
#
# Launch:
#   ./runner/primus-cli direct -- train posttrain \
#     --config examples/megatron/configs/MI355X/qwen2.5_72B-FP8-lora-longalign.yaml
#
# Longer run (optional):
#   export PRIMUS_TRAIN_ITERS=500
#   export PRIMUS_LR_DECAY_ITERS=500
#
# User guide: docs/02-user-guide/mi355x-lora-posttrain.md
# =============================================================================

modules:
  post_trainer:
    framework: megatron
    config: sft_trainer.yaml

    model: qwen2.5_72B.yaml

    overrides:
      stage: sft

      hf_path: Qwen/Qwen2.5-72B
      tokenizer_model: Qwen/Qwen2.5-72B

      sft_dataset_name: ${LONGALIGN_DATASET:THUDM/LongAlign-10k}
      sft_conversation_format: openai

      enable_packed_sequences: true
      use_packed_attention: false

      disable_wandb: true
      disable_tensorboard: true
      stderr_sink_level: DEBUG
      log_interval: 1
      log_throughput: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 10

      train_iters: ${PRIMUS_TRAIN_ITERS:50}
      micro_batch_size: ${PRIMUS_MBS:1}
      global_batch_size: ${PRIMUS_GBS:8}
      eval_iters: 0
      eval_interval: 1000000

      seq_length: ${PRIMUS_SEQ_LENGTH:131072}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:131072}

      lr: 1.0e-4
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: ${PRIMUS_LR_DECAY_ITERS:50}
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1.0e-8

      eod_mask_loss: false
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # Stabilizes grad norms under FP8 LoRA (TE hybrid + delayed)
      add_qkv_bias: true

      # TP=1 always; CP=8 → ~16k tokens/rank at 128k
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      context_parallel_size: ${PRIMUS_CP:8}
      cp_comm_type: ${PRIMUS_CP_COMM:all_gather}
      sequence_parallel: false

      apply_rope_fusion: false
      enable_experimental: true
      masked_softmax_fusion: true
      attention_softmax_in_fp32: false

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16

      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      recompute_granularity: full
      recompute_method: block
      recompute_num_layers: ${PRIMUS_RECOMPUTE_LAYERS:80}

      finetune: true
      #pretrained_checkpoint: ${PRETRAINED_CHECKPOINT:/data/megatron_checkpoints/Qwen2.5-72B}
      load: null
      save: null
      save_interval: 1000000
      disable_last_saving: true
      ckpt_format: torch_dist
      dist_ckpt_strictness: assume_ok_unexpected

      # FP8 hybrid + delayed scaling (master / LoRA stay BF16)
      bf16: true
      fp8: hybrid
      no_fp8_weight_transpose_cache: true

      enable_primus_turbo: true
      # delayed recipe is incompatible with Primus-Turbo GEMM
      use_turbo_gemm: false
      use_turbo_rms_norm: true
      # CP>1 uses flash_attn_usp_func; keep false unless primus_turbo + CP path validated
      use_turbo_attention: false
      use_turbo_grouped_gemm: false

      # Qwen vocab 151680 @ 128k — avoid materializing full [seq, vocab] logits
      enable_fused_linear_ce: true

      cross_entropy_fusion_impl: te
      cross_entropy_loss_fusion: true

      manual_gc: true
      manual_gc_interval: ${PRIMUS_MANUAL_GC_INTERVAL:10}

      lora:
        enabled: true
        dim: 16
        alpha: 32
        dropout: 0.0
        dropout_position: pre
        lora_A_init_method: xavier
        lora_B_init_method: zero
        target_modules:
          - linear_qkv
          - linear_proj
          - linear_fc1
          - linear_fc2
