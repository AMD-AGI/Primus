# SmolLM3-3B-Base pretrain example for MI355X (8 GPUs, TP=PP=1, DP=8: global_batch_size
# must be a multiple of micro_batch_size x DP). Lower micro_batch_size if memory runs out.
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:smollm3_3B_Base-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    # data_path: ./data

    # model to run
    model: smollm3_3B_Base.yaml
    overrides:
      # log
      wandb_project: "Primus_Pretrain"
      # disable_wandb: false
      # disable_tensorboard: false
      stderr_sink_level: DEBUG

      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      # 2, not 1: Megatron does not close the logging interval on a run's first iteration, so
      # with 1 the first loss line after a resume averages two iterations.
      log_interval: 2

      train_iters: 50
      micro_batch_size: 4
      global_batch_size: 32

      seq_length: 4096

      # Short demo schedule
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      # AdamW
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95

      # loss: mask the EOD token (packed documents are separated by EOD)
      eod_mask_loss: true

      # precision and optimizer sharding (also the pre_trainer.yaml defaults; set here
      # because overlap_param_gather below needs the distributed optimizer)
      bf16: true
      use_distributed_optimizer: true

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      # Mock data; set reset_attention_mask/reset_position_ids for intra-document masking on
      # real packed data (Megatron then builds a full [seq, seq] mask per sample).
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # Turbo attention off, as in llama3.2_3B for this GPU (the MI355X examples of the
      # Llama family use TE attention); with no other Turbo feature used, Turbo is off.
      # Dense model: no grouped GEMM.
      enable_primus_turbo: false
      use_turbo_attention: false
      use_turbo_grouped_gemm: false

      # Cross entropy flags
      # cross_entropy_fusion_impl: "te"
      # cross_entropy_loss_fusion: true
