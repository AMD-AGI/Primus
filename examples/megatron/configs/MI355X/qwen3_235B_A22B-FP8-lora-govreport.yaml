work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:qwen3_235B_A22B-lora-govreport-fp8}
workspace: ${PRIMUS_WORKSPACE:./output}

# =============================================================================
# Qwen3-235B-A22B LoRA SFT (FP8 hybrid) — SCROLLS GovReport (native Megatron)
# =============================================================================
# Single-node MoE stack: EP=8 + distributed optimizer + legacy grouped GEMM
# (torch_dist checkpoint) + DeepEP @ seq=8192 default.
#
# Hardware: 1 node × 8× MI355X — TP=1, PP=1, EP=8.
#
# Dataset: SCROLLS GovReport JSONL under /data/scrolls_govreport (see
# examples/megatron/scripts/prepare_scrolls_govreport.sh).
#
# Container bind-mounts:
#   /data/scrolls_govreport/                     — train.jsonl + validation.jsonl
#   /data/megatron_checkpoints/Qwen3-235B-A22B/  — Megatron torch_dist base
#   /data/huggingface/                           — HF tokenizers (HF_HOME)
#
# Alternative (HF hub, no local jsonl):
#   sft_dataset_name: tau/scrolls
#   sft_dataset_config: gov_report
#
# MoE checkpoint: use_turbo_grouped_gemm=false + moe_use_legacy_grouped_gemm=true
# required for torch_dist expert ShardedTensor layout.
#
# Throughput / memory (@ 8192 default):
#   Stable defaults: MBS=1 GBS=8, recompute=3, overlap collectives off.
#   Perf mode: export PRIMUS_MBS=2 PRIMUS_GBS=16 PRIMUS_RECOMPUTE_LAYERS=1
#   Still OOM: export PRIMUS_RECOMPUTE_LAYERS=16   # then 47 → 94
#   Shorter smoke: export PRIMUS_SEQ_LENGTH=4096 PRIMUS_MAX_POSITION_EMBEDDINGS=4096
#
# Required before launch:
#   export PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
#   export MASTER_ADDR=127.0.0.1
#   export NCCL_SOCKET_IFNAME=eth0
#   export GLOO_SOCKET_IFNAME=eth0
#   export PRIMUS_PACK_LOCK_DIR=/tmp/primus_pack_locks
#   export DATA_PATH=/data
#
# Launch:
#   ./runner/primus-cli direct -- train posttrain \
#     --config examples/megatron/configs/MI355X/qwen3_235B_A22B-FP8-lora-govreport.yaml \
#     --pretrained_checkpoint /data/megatron_checkpoints/Qwen3-235B-A22B \
#     --finetune true
#
# Reference: qwen3_235B_A22B-FP8-lora-mockdata-smoke.yaml (mock-data stack twin)
#            qwen3_235B_A22B-FP8-pretrain.yaml (MoE/Turbo/DeepEP)
# =============================================================================

modules:
  post_trainer:
    framework: megatron
    config: sft_trainer.yaml

    model: qwen3_235B_A22B.yaml

    overrides:
      stage: sft

      hf_path: Qwen/Qwen3-235B-A22B
      tokenizer_model: Qwen/Qwen3-235B-A22B

      # SCROLLS GovReport
      sft_dataset_name: ${SCROLLS_GOVREPORT_DIR:/data/scrolls_govreport}
      sft_conversation_format: hf_chat
      enable_packed_sequences: true
      use_packed_attention: false
      mock_data: false

      # log
      disable_wandb: true
      disable_tensorboard: true
      stderr_sink_level: DEBUG
      log_interval: 1
      log_throughput: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      moe_router_force_load_balancing: true

      train_iters: ${PRIMUS_TRAIN_ITERS:200}
      micro_batch_size: ${PRIMUS_MBS:1}
      global_batch_size: ${PRIMUS_GBS:8}
      eval_iters: 0
      eval_interval: 1000000

      seq_length: ${PRIMUS_SEQ_LENGTH:8192}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:8192}

      lr: 1.0e-4
      min_lr: 1.0e-5
      lr_warmup_iters: 2
      lr_decay_iters: ${PRIMUS_LR_DECAY_ITERS:50}
      lr_decay_style: cosine
      weight_decay: 1.0e-1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: false
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # parallel — 1-node MoE LoRA (pretrain uses PP=4 @ 32 nodes)
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:8}
      context_parallel_size: 1
      sequence_parallel: false

      # EP>1 path: distributed optimizer (FSDP2+ODC incompatible with MoE EP)
      use_torch_fsdp2: false
      use_megatron_fsdp: false
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16
      overlap_grad_reduce: ${PRIMUS_OVERLAP_GRAD_REDUCE:false}
      overlap_param_gather: ${PRIMUS_OVERLAP_PARAM_GATHER:false}
      gradient_accumulation_fusion: true
      overlap_moe_expert_parallel_comm: false

      enable_odc: false
      enable_odc_lb_mini: false

      # rope fusion
      enable_experimental: true
      apply_rope_fusion: true

      # ckpt (LoRA finetune from torch_dist base)
      finetune: true
      #pretrained_checkpoint: ${PRETRAINED_CHECKPOINT:/data/megatron_checkpoints/Qwen3-235B-A22B}
      load: null
      save: null
      save_interval: 1000000
      disable_last_saving: true
      ckpt_format: torch_dist
      dist_ckpt_strictness: assume_ok_unexpected

      # recompute (pretrain: full/block/3; lower = higher TFLOP/s at 4096)
      recompute_granularity: full
      recompute_method: block
      recompute_num_layers: ${PRIMUS_RECOMPUTE_LAYERS:3}

      # Turbo + DeepEP (legacy grouped GEMM for torch_dist MoE expert shards)
      enable_primus_turbo: true
      use_turbo_attention: false
      use_turbo_grouped_gemm: false
      use_turbo_rms_norm: false

      # DeepEP
      use_turbo_deepep: true
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32
      moe_use_legacy_grouped_gemm: true
      moe_use_fused_router_with_aux_score: true
      moe_permute_fusion: true
      turbo_deepep_num_cu: 80
      turbo_deepep_use_comm_stream: true
      turbo_sync_free_moe_stage: ${PRIMUS_TURBO_SYNC_FREE_MOE_STAGE:1}

      # Cross entropy
      cross_entropy_fusion_impl: te
      cross_entropy_loss_fusion: true

      # FP8 hybrid
      bf16: true
      fp8: hybrid
      no_fp8_weight_transpose_cache: true

      manual_gc: true
      manual_gc_interval: ${PRIMUS_MANUAL_GC_INTERVAL:100}

      lora:
        enabled: true
        dim: 32
        alpha: 32
        dropout: 0.0
        dropout_position: pre
        lora_A_init_method: xavier
        lora_B_init_method: zero
        target_modules:
          - linear_qkv
          - linear_proj
          - linear_fc1
          - linear_fc2
