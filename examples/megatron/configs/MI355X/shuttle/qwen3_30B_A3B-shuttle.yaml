work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:qwen3_30B_A3B-shuttle}
workspace: ${PRIMUS_WORKSPACE:./output}

# Shuttle experiment config: one Qwen3-30B-A3B setup for every CP / EP variant; the variant is chosen
# with the PRIMUS_* switches below only (see cco-paper experiments/manifest.yaml).
# The all-gather-KV kernels wait on the peers' kernels; with the runner's 2 hardware queues the
# overlapped grad reduce-scatter / param all-gather share the attention's queue and deadlock it.
# turbo_agkv_mode fused / mega run on the flux FlyDSL attention.
env:
  GPU_MAX_HW_QUEUES: ${SHUTTLE_HWQ}  # E11 varies it; 8 otherwise
  FLUX_ATTN_FLYDSL: ${SHUTTLE_FLUX_ATTN_FLYDSL}  # exported by the shuttle driver (1 unless the run sets it)

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: ${PRIMUS_MODEL:qwen3_30B_A3B}.yaml
    overrides:
      # log
      wandb_project: "Primus_Qwen3_30B_A3B_Pretrain"
      stderr_sink_level: DEBUG

      # debug
      moe_router_force_load_balancing: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      log_interval: 1

      # hyper parameters
      train_iters: ${PRIMUS_TRAIN_ITERS:20}
      micro_batch_size: 1
      global_batch_size: ${PRIMUS_GBS:16}
      seq_length: ${PRIMUS_SEQ_LENGTH:32768}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:32768}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: ${PRIMUS_CP:4}
      # p2p / all_gather / a2a; all_gather with use_turbo_attention runs Turbo's all-gather-KV attention
      cp_comm_type: ${PRIMUS_CP_COMM_TYPE:all_gather}
      expert_model_parallel_size: ${PRIMUS_EP:8}
      overlap_grad_reduce: true
      overlap_param_gather: true

      # data; mock data needs no tokenizer files
      tokenizer_type: ${PRIMUS_TOKENIZER_TYPE:NullTokenizer}
      mock_data: true
      # unused by causal flash attention; building it per micro-batch slows MoE on Megatron-core 0.19
      create_attention_mask_in_dataloader: false
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # optimizer
      use_precision_aware_optimizer: true
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16

      # rope fusion
      enable_experimental: true
      apply_rope_fusion: true

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # Turbo attention; false runs Transformer Engine's attention with its own CP for comparison
      enable_primus_turbo: true
      use_turbo_attention: ${PRIMUS_TURBO_ATTENTION:true}
      turbo_agkv_mode: ${PRIMUS_TURBO_AGKV_MODE:fused}
      use_turbo_mega_ulysses: ${PRIMUS_MEGA_ULYSSES:false}
      turbo_mega_ulysses_impl: ${PRIMUS_MEGA_ULYSSES_IMPL:fused}
      turbo_mega_ulysses_seq_chunk: ${PRIMUS_MEGA_ULYSSES_SEQ_CHUNK:256}
      use_turbo_mega_moe: ${PRIMUS_MEGA_MOE:false}
      use_turbo_grouped_gemm: ${PRIMUS_TURBO_GG:false}
      use_turbo_rms_norm: false # bug

      # deepep
      use_turbo_deepep: true
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32
      turbo_deepep_num_cu: 80
      turbo_deepep_use_comm_stream: false
      turbo_sync_free_moe_stage: 1

      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true

      gradient_accumulation_fusion: true
      moe_use_legacy_grouped_gemm: ${PRIMUS_LEGACY_GG:true}  # false with PRIMUS_TURBO_GG=true (Primus rejects both)
