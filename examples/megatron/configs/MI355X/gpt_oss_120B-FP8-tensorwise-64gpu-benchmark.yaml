# Synthetic training benchmark on 8 nodes with 8 MI355X GPUs per node.
# This uses the Primus GPT-OSS recipe with bias-free SwiGLU experts and QK normalization.
# For tokens/s/GPU, divide the tokens processed in steps 6–25 by their total time and 64.
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:gpt_oss_120B-FP8-tensorwise-64gpu}
workspace: ${PRIMUS_WORKSPACE:./output}
env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    model: ${PRIMUS_MODEL:gpt_oss_120B}.yaml
    overrides:
      # Synthetic data and measurement window
      mock_data: true
      tokenizer_type: NullTokenizer
      tokenizer_model: null
      vocab_size: 201088
      train_data_path: null
      valid_data_path: null
      test_data_path: null
      moe_router_force_load_balancing: true
      # Even routing selects four adjacent experts. Uniform uses random logits.
      moe_router_force_load_balancing_type: ${PRIMUS_ROUTING:even}
      train_iters: 25
      log_interval: 1
      log_avg_skip_iterations: 5
      log_avg_reset_interval: 25
      profile: false
      use_pytorch_profiler: false
      seed: 1234

      # Parallel layout and batch dimensions
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      virtual_pipeline_model_parallel_size: null
      expert_model_parallel_size: 8
      micro_batch_size: 8
      global_batch_size: 32768
      seq_length: 4096
      max_position_embeddings: 4096

      # Tensorwise FP8 experts and intra-node DeepEP
      fp8: hybrid
      fp8_recipe: tensorwise
      enable_primus_turbo: true
      turbo_fp8_lm_head: true
      use_turbo_gemm: true
      turbo_gemm_backend: fp8:flydsl,fp4:flydsl,other:hipblaslt
      use_turbo_grouped_gemm: true
      turbo_grouped_gemm_backend: fp8:flydsl,fp4:flydsl,other:hipblaslt
      turbo_fused_grouped_gemm: true
      turbo_fp8_permute: true
      use_turbo_deepep: true
      turbo_deepep_num_cu: 160
      turbo_deepep_use_comm_stream: false
      turbo_sync_free_moe_stage: 1
      use_turbo_fused_act_with_probs: true
      moe_router_fusion: true
      moe_router_dtype: fp32
      moe_permute_fusion: false
      moe_use_legacy_grouped_gemm: false
      moe_use_fused_router_with_aux_score: false
      moe_shared_expert_overlap: false

      # Attention and loss
      multi_latent_attention: false
      use_turbo_attention: true
      use_sink_attention: true
      sink_sliding_window: 128
      sink_window_even_layers_only: true
      apply_rope_fusion: true
      use_turbo_fused_qk_rmsnorm_rope: true
      use_turbo_rms_norm: true
      use_turbo_norm_te_linear: true
      cross_entropy_loss_fusion: true
      cross_entropy_fusion_impl: te

      # Gradient synchronization and activation memory
      overlap_grad_reduce: true
      overlap_param_gather: true
      ddp_num_buckets: 24
      ddp_average_in_collective: true
      grad_reduce_in_bf16: true
      gradient_accumulation_fusion: false
      recompute_granularity: full
      recompute_method: block
      recompute_num_layers: 0

      # Optimizer and checkpoints
      lr: 1.0e-05
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-06
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0
      wandb_project: Primus_GPT_OSS_120B_Pretrain
      stderr_sink_level: DEBUG
