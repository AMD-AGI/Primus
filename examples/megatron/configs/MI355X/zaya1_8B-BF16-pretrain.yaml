# Single-node training (8 GPUs):
#   GPUS_PER_NODE=8 ./primus-cli direct -- train pretrain \
#     --config examples/megatron/configs/MI355X/zaya1_8B-BF16-pretrain.yaml
# No --numa: it gained under 0.1% for BF16. The FP8 recipe uses it.

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:zaya1-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# Switches read by the ZAYA1 model code when it is imported. Primus sets each
# entry in every training process before it builds the model, and logs it as
# "[Primus:Runtime] env override".
#   ZAYA_MOE_GEMM: turbo       The 16 experts run as two primus_turbo grouped
#                              GEMMs whose group sizes stay on the GPU, so no
#                              MoE layer waits on the host. Default: split.
#                              BF16 only: with FP8 the experts stay split. The
#                              distributed-optimizer state does not carry
#                              across a switch between split and turbo; load
#                              with --no-load-optim when switching.
#   ZAYA_ROUTER_DEFER_AR: "1"  One data-parallel all-reduce per step for every
#                              router's balancing-bias update, instead of one
#                              per MoE layer. Default: 0.
# The other switches stay at their defaults (on): ZAYA_ATTN_FLASH,
# ZAYA_FUSE_NORM, ZAYA_FUSE_CCA, ZAYA_CONV_GEMM and ZAYA_FUSE_MOE.
# ZAYA_CHUNKED_CE has no effect here: cross_entropy_loss_fusion below turns
# the chunked cross-entropy off.
env:
  ZAYA_MOE_GEMM: turbo
  ZAYA_ROUTER_DEFER_AR: "1"

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # Full ZAYA1-base shape lives in zaya1.yaml (80 stages, hidden 2048).
    model: zaya1.yaml
    overrides:
      wandb_project: "Primus_Pretrain"
      stderr_sink_level: DEBUG

      log_avg_skip_iterations: 1
      log_avg_reset_interval: 10

      # 30-step mock-data run for one 8-GPU node (DP=8). micro_batch_size 248
      # was sized before the ZAYA1 kernel changes and the settings in this
      # file, as the largest multiple of 8 that completed on MI355X with
      # rocm/primus:v26.8 (282 of 288 GB per GPU; 256 ran out of memory). It
      # peaks lower now; larger micro batches were not tried. On fewer GPUs,
      # lower micro_batch_size or num_layers (keep it even). Do not edit the
      # model yaml to shrink the architecture.
      train_iters: 30
      micro_batch_size: 248
      # One micro batch per GPU per step at DP=8.
      # Must be divisible by micro_batch_size * data_parallel_size.
      global_batch_size: 1984
      seq_length: 128
      max_position_embeddings: 4096

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 1
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.02

      # Data parallel only. TP, PP, CP, EP and sequence parallel are rejected
      # by zaya1_builder.
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      sequence_parallel: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      # Transformer Engine's fused cross-entropy on the output logits. It is
      # faster here than the ZAYA1 chunked cross-entropy, which it turns off,
      # but keeps the full bf16 logits (16.6 GB per GPU). A numerics choice:
      # TE 2.17.1 (rocm/primus:v26.8) returns the logits gradient in bf16,
      # which is why Megatron rejects this setting. Megatron-LM main accepts
      # it from TE 2.19, which keeps the gradient in fp32 (TE PR #3193), as
      # does ROCm TE IFU-release_v2.18. Primus removes the check and logs a
      # warning.
      cross_entropy_loss_fusion: true
      cross_entropy_fusion_impl: te

      # Average gradients inside the reduce-scatter, so Megatron skips its
      # separate pass that first scales the gradient buffer by 1/DP. At DP=8
      # the scale is a power of two, so the gradients come out the same.
      ddp_average_in_collective: true

      # Synthetic tokens. The mock-data patch forces NullTokenizer and
      # clears these paths; vocab_size stays 262272 from zaya1.yaml.
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null
      eval_interval: 100
      eval_iters: 8

      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # ZAYA_MOE_GEMM=turbo calls primus_turbo directly and does not read
      # these.
      enable_primus_turbo: false
      use_turbo_attention: false
      use_turbo_grouped_gemm: false
