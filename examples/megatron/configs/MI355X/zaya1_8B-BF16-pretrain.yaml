work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:zaya1-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # Full ZAYA1-base shape lives in zaya1.yaml (80 stages, hidden 2048).
    model: zaya1.yaml
    overrides:
      wandb_project: "Primus_Pretrain"
      stderr_sink_level: DEBUG

      log_avg_skip_iterations: 1
      log_avg_reset_interval: 10

      # 30-step mock-data run for one 8-GPU node (DP=8). With the settings
      # below, micro_batch_size 248 peaks at about 215 of 288 GB per GPU on
      # MI355X with rocm/primus:v26.8, and each sample costs about 0.6 GB.
      # On fewer GPUs, lower micro_batch_size or num_layers (keep it even).
      # Do not edit the model yaml to shrink the architecture.
      train_iters: 30
      micro_batch_size: 248
      # One micro batch per GPU per step at DP=8.
      # Must be divisible by micro_batch_size * data_parallel_size.
      global_batch_size: 1984
      seq_length: 128
      max_position_embeddings: 4096

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 1
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.02

      # Data parallel only. TP, PP, CP, EP and sequence parallel are rejected
      # by zaya1_builder.
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      sequence_parallel: false
      # Overlap the gradient reduce-scatter with the backward and the
      # parameter all-gather with the next forward. Before each bucket's
      # reduce-scatter, Megatron checks its gradients for NaN and Inf with two
      # host syncs, so with the default 40M-parameter buckets (190 here)
      # overlap is slower than none. 1e9-parameter buckets make 9.
      overlap_grad_reduce: true
      overlap_param_gather: true
      ddp_bucket_size: 1000000000
      gradient_accumulation_fusion: false

      # Transformer Engine's fused cross-entropy works on the BF16 logits in
      # place instead of an fp32 copy over the 262k vocabulary.
      cross_entropy_loss_fusion: true
      cross_entropy_fusion_impl: te
      # With reset_attention_mask off, the dataloader's mask is the plain
      # causal mask. Leaving it out lets CCA's attention run with is_causal.
      # Turn it back on together with reset_attention_mask.
      create_attention_mask_in_dataloader: false

      # Synthetic tokens. The mock-data patch forces NullTokenizer and
      # clears these paths; vocab_size stays 262272 from zaya1.yaml.
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null
      eval_interval: 100
      eval_iters: 8

      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      enable_primus_turbo: false
      use_turbo_attention: false
      use_turbo_grouped_gemm: false
