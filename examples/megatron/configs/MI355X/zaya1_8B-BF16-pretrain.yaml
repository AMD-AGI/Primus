# Single-node training (8 GPUs):
#   GPUS_PER_NODE=8 ./primus-cli direct -- train pretrain \
#     --config examples/megatron/configs/MI355X/zaya1_8B-BF16-pretrain.yaml
# No --numa: it gained under 0.1% for BF16. The FP8 recipe uses it.

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:zaya1-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # Full ZAYA1-base shape lives in zaya1.yaml (80 stages, hidden 2048).
    model: zaya1.yaml
    overrides:
      wandb_project: "Primus_Pretrain"
      stderr_sink_level: DEBUG

      log_avg_skip_iterations: 1
      log_avg_reset_interval: 10

      # 30-step mock-data run for one 8-GPU node (DP=8). micro_batch_size 248
      # was sized before the ZAYA1 kernel changes and the settings in this
      # file, as the largest multiple of 8 that completed on MI355X with
      # rocm/primus:v26.8 (282 of 288 GB per GPU; 256 ran out of memory). It
      # peaks lower now; larger micro batches were not tried. On fewer GPUs,
      # lower micro_batch_size or num_layers (keep it even). Do not edit the
      # model yaml to shrink the architecture.
      train_iters: 30
      micro_batch_size: 248
      # One micro batch per GPU per step at DP=8.
      # Must be divisible by micro_batch_size * data_parallel_size.
      global_batch_size: 1984
      seq_length: 128
      max_position_embeddings: 4096

      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 1
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.02

      # Data parallel only. TP, PP, CP, EP and sequence parallel are rejected
      # by zaya1_builder.
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      sequence_parallel: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      # ZAYA1 kernel paths (Zaya1TransformerConfig fields, off by default in
      # zaya1_base.yaml): flash attention, the fused norm, CCA and MoE
      # elementwise chains, CCA's convolutions as GEMMs, the split experts'
      # sort-based dispatch (unused while the experts run as grouped GEMMs,
      # below), and one data-parallel all-reduce per micro batch for every
      # router's balancing-bias update, instead of one per MoE layer.
      zaya_attn_flash: true
      zaya_fuse_norm: true
      zaya_fuse_cca: true
      zaya_conv_gemm: true
      zaya_fuse_moe: true
      zaya_sort_dispatch: true
      zaya_router_defer_ar: true

      # Transformer Engine's fused cross-entropy on the output logits, in
      # place of Megatron's path, which first copies the logits to fp32. From
      # TE 2.20 (rocm/primus:v26.9) it rounds the logits gradient to bf16 once,
      # as Megatron's path does; TE 2.17.1 (rocm/primus:v26.8) rounds it twice,
      # so leave it off there. Primus's warning that TE lacks the FP32-gradient
      # fix (TE PR #3193) misreads TE 2.20. The ZAYA1 chunked cross-entropy
      # (zaya_chunked_ce) stays off: it rounds each chunk's output-layer weight
      # gradient to bf16 before summing.
      cross_entropy_loss_fusion: true
      cross_entropy_fusion_impl: te

      # Average gradients inside the reduce-scatter, so Megatron skips its
      # separate pass that first scales the gradient buffer by 1/DP. At DP=8
      # the scale is a power of two, so the gradients come out the same.
      ddp_average_in_collective: true

      # Synthetic tokens. The mock-data patch forces NullTokenizer and
      # clears these paths; vocab_size stays 262272 from zaya1.yaml.
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null
      eval_interval: 100
      eval_iters: 8

      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # The 16 experts run as two Primus Turbo grouped GEMMs whose group sizes
      # stay on the GPU, with Turbo's moe_permute and moe_unpermute moving the
      # tokens, so no MoE layer waits on the host.
      # The distributed-optimizer state does not carry across a switch between
      # split and grouped experts; load with --no-load-optim when switching.
      enable_primus_turbo: true
      use_turbo_attention: false
      use_turbo_grouped_gemm: true
