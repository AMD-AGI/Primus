work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:kimi_k3-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# Kimi K3 (text backbone) BF16 pretraining experiment config for MI355X.
# Runnable as-is with synthetic data (mock_data: true); the model shape is
# selected from primus/configs/models/megatron/kimi_k3*.yaml via PRIMUS_MODEL.

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # kimi_k3 = the full 93-layer production shape.
    model: ${PRIMUS_MODEL:kimi_k3}.yaml
    overrides:
      # ---------- log ----------
      wandb_project: "Primus_Kimi_K3_Pretrain"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      log_interval: ${PRIMUS_LOG_INTERVAL:1}

      # ---------- hyper parameters ----------
      train_iters: ${TRAIN_ITERS:50}
      micro_batch_size: ${MBS:1}
      global_batch_size: ${GBS:8}
      seq_length: ${PRIMUS_SEQ_LENGTH:512}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:512}
      lr: 1.0e-5
      min_lr: 0.0
      # 1% linear warmup + weight decay 0.1 (Kimi K3 tech report). lr_warmup_iters
      # and lr_warmup_fraction are mutually exclusive (arguments.py:1005-1007), so
      # lr_warmup_iters stays 0 and the 1% is expressed as lr_warmup_fraction.
      # These recipe keys must live in this overrides block, not the model preset:
      # the preset merge skips any key trainer_base.yaml already declares, so only
      # the experiment overrides win.
      lr_warmup_iters: 0
      lr_warmup_fraction: 0.01
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.02
      norm_epsilon: 1.0e-5

      # ---------- parallel ----------
      # PP stays 1: the production shape is 93 layers, which is not divisible by
      # any of the usual PP degrees, so PP > 1 needs
      # decoder_first_pipeline_num_layers / decoder_last_pipeline_num_layers to be
      # chosen deliberately.
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:1}
      overlap_grad_reduce: false
      overlap_param_gather: false
      gradient_accumulation_fusion: false

      # ---------- data: synthetic ----------
      # mock_data: true nulls every data path AND forces
      # tokenizer_type=NullTokenizer while preserving vocab_size
      # (primus/backends/megatron/patches/args/mock_data_patches.py:33-45),
      # so no dataset and no tokenizer download is needed.
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ---------- Kimi K3 specific ----------
      # eager | eager_recurrent | fla | flydsl.
      # `fla` is the fused Triton path and the right default for training; the
      # eager reference trades speed for auditable numerics and exists as the
      # oracle. flash-linear-attention is installed by the megatron pretrain hook,
      # not the base image. Fall back with PRIMUS_KDA_BACKEND=eager if unavailable.
      kda_backend: ${PRIMUS_KDA_BACKEND:fla}
      # K3P_KDA_CONV=fla selects the fla causal_conv1d over torch nn.Conv1d for the
      # KDA depthwise conv (env, not a Megatron arg); K3P_KDA_CONV=default keeps the
      # torch path.
      # moe_router_force_load_balancing MUST stay false: it is a *benchmark* switch,
      # not a load balancer -- TopKRouter.forward calls apply_random_logits
      # (router.py:696-698) and RandomSTE.forward (moe_utils.py:1177-1198) DISCARDS
      # the router's logits and returns `logits.clone().normal_()`, so routing
      # becomes uniformly random and the router learns nothing. Upstream default is
      # false (transformer_config.py:714).
      moe_router_force_load_balancing: ${PRIMUS_MOE_FORCE_LOAD_BALANCING:false}
      moe_router_dtype: fp32

      # ---------- optimizer ----------
      optimizer: adam
      use_distributed_optimizer: false
      use_precision_aware_optimizer: false

      # ---------- recompute: off at bring-up size ----------
      recompute_granularity: null
      recompute_method: null
      recompute_num_layers: null

      # ---------- ckpt ----------
      finetune: false
      auto_continue_train: false
      load: null
      save: null
      save_interval: 20000
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # ---------- Turbo / fusion ----------
      # grouped GEMM + RMSNorm + permute fusion are the measured-winner set and are
      # memory-neutral; they are on so the bring-up path matches the production
      # path. Two big levers are NOT in this file: ENABLE_NUMA_BINDING=1 (an
      # environment variable) and micro_batch_size (memory-bound, shape-specific),
      # left at the bring-up value below.
      enable_primus_turbo: ${PRIMUS_ENABLE_TURBO:true}
      use_turbo_grouped_gemm: ${PRIMUS_USE_TURBO_GROUPED_GEMM:false}
      # Checkpoint-safe: verified saving at EP=8.
      use_turbo_rms_norm: true
      moe_permute_fusion: true
      # Left off, each for a reason:
      #   attention -- the validated configuration is the one without it.
      #   fused_act_with_probs -- a measured regression at the scaled shape.
      #   deepep -- BROKEN for K3: the dispatcher is sized for half the tokens the
      #     stable-latent MoE hands it (a code fix, not a knob).
      #   shared_expert_overlap -- moe_layer.py:360-362 asserts `not
      #     shared_expert_overlap` whenever the latent projections are live, and K3
      #     always runs the latent path; it dies at forward on step 1.
      use_turbo_attention: false
      use_turbo_fused_act_with_probs: false
      use_turbo_deepep: false
      moe_shared_expert_overlap: false
      moe_use_fused_router_with_aux_score: false

      enable_experimental: true

      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true
