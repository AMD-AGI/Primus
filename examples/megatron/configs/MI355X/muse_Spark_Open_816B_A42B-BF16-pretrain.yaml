work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:muse_spark_816B_A42B-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# Muse-Spark-Open-816B-A42B (text decoder, 62 layers, 256 experts top-8) BF16
# pretraining on MI355X (288 GB = ~268 GiB per GPU). This file trains the FULL model; it
# does not cut depth.
#
# Memory: 822B params (the checkpoint's count; 816B is the release name) x 18 bytes (bf16
# weight 2 + fp32 main grad 4 + fp32 master 4 + Adam exp_avg / exp_avg_sq 8) = ~14.8 TB
# of model states before activations. The
# distributed optimizer shards only the 12 optimizer bytes: the dense ones over data
# parallel (DP x CP = GPUs / (TP x PP)), the expert ones over the expert data parallel
# group (GPUs / (EP x expert TP x PP)), which is 1 in the default layouts below, so the
# expert optimizer bytes are not sharded there. The 6 bytes of weight + grad are only
# split by TP x PP (dense) or EP x PP (experts) (FSDP would shard them too).
#
# Defaults: 16 nodes (128 GPUs), TP 1, PP 2 (31 layers per stage), EP 64 (4 experts per
# GPU), DP 64, GBS 256 (4 micro-batches of 1 per DP rank). Model states are ~165 GiB per
# GPU (the memory-check estimate), so ~100 GiB are left for activations at seq 4096;
# enable recompute (below) for longer sequences or larger micro-batches. Before training,
# the megatron.muse_spark.memory_check patch compares the model states per GPU with the
# GPU memory; when they cannot fit it stops with a ValueError that names a layout
# computed for this GPU.
# Other layouts: set PRIMUS_TP / PRIMUS_PP / PRIMUS_EP and GBS (GBS must be a multiple of
# MBS * DP, DP = GPUs / (TP * PP)). EP must divide 256 and GPUs / PP. PP must divide the 62
# layers (1, 2, 31 or 62), else set decoder_first/last_pipeline_num_layers. TP 8 (with SP)
# cuts the dense states to ~114 GiB per GPU on 16 nodes (a converted checkpoint is not yet
# tested at TP > 1, see next). The native converter builds at
# TP=PP=EP=1 and saves torch_dist (Megatron reshards it on load; loading is tested at
# TP 1 / EP 8, not yet at TP > 1). It copies the weights in one layer at a time: the full model (822B parameters)
# needs ~1.5 TiB (1.64 TB) of host RAM in bf16, plus the converter's 5 % margin (it
# checks the host's available memory first); or pass an already converted checkpoint.
# Embedding / output rows: vocab_size rounded up to 64 (the muse_spark_vocab patch, the
# converter's rule), 202048 at every TP.
# Sequence length: set PRIMUS_SEQ_LENGTH and PRIMUS_MAX_POSITION_EMBEDDINGS together
# (max_position_embeddings must be >= seq_length; both default to 4096). Longer
# sequences need more activation memory: add context parallel or GPUs.
#
# Single node: set PRIMUS_PP=1 PRIMUS_EP=8 (this file defaults to PP 2, and EP 8 must divide
# the 8 GPUs / PP) and cut the model on the command line (--num_layers 4 keeps the first 4
# released layers and all 256 experts). The trainer test
# (test_muse_Spark_Open_816B_A42B, a weekly test) starts from this file on one node and
# overrides on the command line (--num_layers 4 --num_experts 16 --moe_router_topk 4,
# --expert_model_parallel_size 8, PRIMUS_EP=8 PRIMUS_PP=1, seq 1024, GBS 8): the alltoall
# dispatcher with Turbo grouped GEMM (DeepEP stays off, as in this file).
#   Model code: primus/backends/megatron/core/models/muse_spark/.
#   HF -> Megatron weights: primus/backends/megatron/checkpoint/native_loader_muse_spark.py.

env:
  # Muse Spark's large-K / small-N GEMMs (expert fc2 into the 4096 latent, post_expert_proj,
  # router wgrad) need more hipBLASLt split-K workspace than TE's default on gfx950
  # ("HIPBLASLT Error: 6"). Read by the base patch megatron.te.hipblaslt_gemm_workspace
  # (te_patches/hipblaslt_workspace_patches.py); it only enlarges.
  PRIMUS_TE_GEMM_WORKSPACE_MIB: "512"

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: ${PRIMUS_MODEL:muse_Spark_Open_816B_A42B}.yaml
    overrides:
      # log
      wandb_project: "Primus_Muse_Spark"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: ${TRAIN_ITERS:20}
      micro_batch_size: ${MBS:1}
      global_batch_size: ${GBS:256}
      seq_length: ${PRIMUS_SEQ_LENGTH:4096}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      # from random weights: a pretraining rate, lower than the small models' 1e-4 at this
      # size (GPT-3 175B used 6e-5)
      lr: 3.0e-5
      min_lr: 3.0e-6
      lr_warmup_iters: ${PRIMUS_LR_WARMUP_ITERS:2}  # short for the smoke runs; raise it for real runs
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true

      # parallel (expert_tensor_parallel_size stays 1: post_expert_norm needs full rows)
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:2}
      expert_model_parallel_size: ${PRIMUS_EP:64}
      expert_tensor_parallel_size: 1
      sequence_parallel: ${PRIMUS_SP:true}  # MoE + TP needs SP; Megatron turns it off at TP 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: ${PRIMUS_MOCK_DATA:true}
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: false

      # recompute: off by default; e.g. RECOMPUTE_GRANULARITY=full RECOMPUTE_METHOD=uniform
      # PRIMUS_RECOMPUTE_LAYERS=1, or RECOMPUTE_GRANULARITY=selective (method / layers unset)
      recompute_granularity: ${RECOMPUTE_GRANULARITY:null}
      recompute_method: ${RECOMPUTE_METHOD:null}
      recompute_num_layers: ${PRIMUS_RECOMPUTE_LAYERS:null}

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      # from random weights: aux-loss-free load balancing (the base preset keeps the
      # released checkpoint's selection bias frozen, rate 0.0, for fine-tuning)
      moe_router_bias_update_rate: 1.0e-3
      save: null
      save_interval: 20000
      disable_last_saving: true
      # torch_dist: the format of the native converter's checkpoint (Megatron reshards it on
      # load); auto-detect also loads a legacy torch checkpoint
      ckpt_format: torch_dist
      auto_detect_ckpt_format: true
      eval_iters: 0

      # Primus-Turbo, as the deepseek_v3 / qwen3_235B siblings: grouped GEMM experts
      # (MuseSparkTurboGroupedMLP keeps the per-expert post_expert_norm). Turbo attention
      # stays off: Muse Spark uses TE attention with a sliding window. Turbo RMSNorm is not
      # used (the Muse Spark norms are their own fp32 modules). With use_megatron_fsdp the
      # Turbo grouped GEMM falls back to TE's (warning). PRIMUS_ENABLE_TURBO=false gives the
      # plain TE grouped GEMM + alltoall path.
      # DeepEP is OFF here: the experts span nodes (EP 64), and the Primus-Turbo build in the
      # Primus image has no rocSHMEM, so its DeepEP asserts num_rdma_ranks == 1 (intranode
      # only). The alltoall dispatcher (muse_spark_base.yaml) runs instead.
      # PRIMUS_USE_TURBO_DEEPEP=true turns DeepEP on for an expert group within one node
      # (expert TP x EP <= GPUs per node); a larger group is turned back off with a warning
      # unless muse_spark_turbo_deepep_internode: true says the Turbo build has rocSHMEM (internode
      # dispatch; turbo_deepep_num_cu must stay <= 32 at EP >= 16).
      enable_primus_turbo: ${PRIMUS_ENABLE_TURBO:true}
      use_turbo_attention: false
      use_turbo_grouped_gemm: true
      use_turbo_deepep: ${PRIMUS_USE_TURBO_DEEPEP:false}
      turbo_deepep_num_cu: 32
      turbo_deepep_use_comm_stream: false
      # Fused token permute / unpermute with TE kernels (as deepseek_v3).
      moe_permute_fusion: true
      # turbo_sync_free_moe_stage stays 0 (unset; stage 0 turns on nothing). Stages >= 1 turn
      # on Primus-Turbo's fused router (moe_use_fused_router_with_aux_score), whose op gets no
      # expert_bias: it drops Muse Spark's e_score_correction_bias from the top-k choice and
      # routes unlike HF, so the megatron.args.muse_spark_no_fused_router patch rejects them.

      # Fused CE (TE): GPTModel applies _scale_logits (the soft-cap) before the loss,
      # so the fused loss sees the capped logits.
      cross_entropy_loss_fusion: true
      cross_entropy_fusion_impl: te
