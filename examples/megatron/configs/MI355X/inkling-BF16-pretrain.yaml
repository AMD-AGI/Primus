# Uses Primus-Turbo's grouped GEMM by default: InklingMoE refuses to build when both
# enable_primus_turbo and use_turbo_grouped_gemm are true but primus_turbo.pytorch.ops.grouped_gemm
# does not import. Without Primus-Turbo, set either one false (for example
# PRIMUS_TURBO_GROUPED_GEMM=false) for the per-expert GEMM loop (same math, slower).
work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:inkling-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: ${PRIMUS_MODEL:inkling}.yaml
    overrides:
      # log
      wandb_project: "Primus_Inkling_Pretrain"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: 50
      micro_batch_size: 2
      global_batch_size: 16
      seq_length: ${PRIMUS_SEQ_LENGTH:4096}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:4096}
      lr: 1.0e-4
      min_lr: 1.0e-5
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.02

      # parallel
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: ${PRIMUS_EP:1}
      sequence_parallel: false
      # overlap_param_gather needs the distributed optimizer
      use_distributed_optimizer: true
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # enable_primus_turbo + use_turbo_grouped_gemm run Inkling's routed experts on the
      # Primus-Turbo grouped GEMM (InklingMoE refuses to build if Primus-Turbo does not import).
      # Set either one false for the per-expert GEMM loop (same math, slower, no Primus-Turbo).
      # Turbo's other module patches are off (their use_turbo_* flags stay false) and do not
      # apply to Inkling's own modules.
      enable_primus_turbo: ${PRIMUS_ENABLE_TURBO:true}
      use_turbo_grouped_gemm: ${PRIMUS_TURBO_GROUPED_GEMM:true}
      cross_entropy_loss_fusion: false
