work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:kimi_k2-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

# 4-layer single-node proxy of kimi_k2-BF16-pretrain.yaml for long-context CP + EP runs: only the
# lines marked "proxy" differ from it (layers, parallel layout, sequence / batch / mask, and the
# Ulysses / MegaMoE switches).

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: ${PRIMUS_MODEL:kimi_k2}.yaml
    overrides:
      # log
      wandb_project: "Primus_Kimi_K2_Pretrain"
      stderr_sink_level: DEBUG

      # debug
      moe_router_force_load_balancing: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # proxy: 4 layers, every one MoE, no MTP
      num_layers: 4
      moe_layer_freq: 1
      mtp_num_layers: null

      # hyper parameters
      train_iters: ${PRIMUS_TRAIN_ITERS:12} # proxy
      micro_batch_size: 1 # proxy
      global_batch_size: ${PRIMUS_GBS:4} # proxy
      seq_length: ${PRIMUS_SEQ_LENGTH:32768} # proxy
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:32768} # proxy
      # proxy: the default builds a seq x seq mask per sample on the host (1 GB at 32K), stalling every step
      create_attention_mask_in_dataloader: false
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # parallel
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1} # proxy
      context_parallel_size: ${PRIMUS_CP:8} # proxy
      cp_comm_type: ${PRIMUS_CP_COMM:a2a} # proxy
      expert_model_parallel_size: ${PRIMUS_EP:8}
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: true

      # data
      mock_data: true
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      moe_use_legacy_grouped_gemm: true
      # MLA
      multi_latent_attention: true


      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # Turbo
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_grouped_gemm: false

      # deepep
      use_turbo_deepep: true
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32

      # 64 or 80 for ep8, 32 for ep16-64 is best practice
      turbo_deepep_num_cu: 64
      turbo_deepep_use_comm_stream: false

      # sync-free moe support stage 1-2, 0 means not use sync-free moe
      # stage 2 is recommended for better performance
      turbo_sync_free_moe_stage: 1

      # remove once super flag is functional again
      moe_use_fused_router_with_aux_score: true
      moe_permute_fusion: true

      # proxy: the A/B switches
      # 1 MegaUlysses, -1 latent all-gather unfused, -2 per-head all-to-all, 0 stock Megatron CP
      turbo_ulysses_fused_a2a: ${PRIMUS_ULYSSES:1}
      use_turbo_mega_moe: ${PRIMUS_MEGA_MOE:false}


      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true
