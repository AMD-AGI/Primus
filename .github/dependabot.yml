version: 2
# Version updates for GitHub Actions only; CVEs are handled by Dependabot
# security updates (enabled repo-wide), which are unaffected by the schedule
# and ignore rules below.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # Only open PRs for major version bumps; skip the churn of minor/patch
    # version updates (security fixes still come through regardless).
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "github-actions"

# There is deliberately no `pip` entry here. One used to exist solely to carry an
# `ignore` rule holding transformers below 5.0.0, because MaxDiffusion imported
# Flax classes that transformers 5 removed, and `ignore.versions` applies to
# security updates as well as version updates. MaxDiffusion now runs FLUX's text
# encoders as PyTorch models under Torchax, so that ceiling is gone -- and with it
# the reason to suppress transformers advisories fixed only in 5.x. Without a pip
# entry, Dependabot runs no pip version updates (those need an explicit entry) but
# repo-wide security updates reach requirements-maxdiffusion.txt unfiltered.
