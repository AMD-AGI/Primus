work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama2_7B-FP8-convergence}
workspace: ${PRIMUS_WORKSPACE:./output}

# Llama-2-7B FP8 convergence test: configs/megatron/llama2_7B with FP8 GEMMs, as
# in examples/megatron/configs/*/llama2_7B-FP8-pretrain.yaml. Compare it against
# the BF16 run of the same recipe; maxtext/llama2_7B-nanoo_fp8 is the MaxText
# counterpart.
#
#   tools/convergence_test/run_convergence_test.sh --model megatron/llama2_7B-FP8
#   tools/convergence_test/run_convergence_test.sh --model megatron/llama2_7B-FP8 --source c4
#
# 1000 iters x 128 x 4096 = 524M tokens, lr 1.5e-4 cosine to 1.5e-5 after 100
# warmup iterations.
#
# PRIMUS_CONVERGENCE_DATA is exported by run_convergence_test.sh. The default
# below matches prepare_dataset.py's own output directory for FineWeb-Edu, and
# is relative to the Primus root (the trainer always runs with that as its cwd).

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: llama2_7B.yaml
    overrides:
      # log
      disable_tensorboard: false
      # Megatron's per-iteration line is emitted at DEBUG by Primus; at INFO the
      # loss only reaches logs/.../rank-<last>/debug.log.
      stderr_sink_level: DEBUG
      log_interval: 10
      log_throughput: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      train_iters: 1000
      micro_batch_size: 4
      global_batch_size: 128

      seq_length: 4096
      max_position_embeddings: 4096

      lr: 1.5e-4
      min_lr: 1.5e-5
      lr_warmup_iters: 100
      lr_decay_iters: 1000
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      clip_grad: 1.0
      eod_mask_loss: true
      init_method_std: 0.008

      # E4M3 activations and weights, E5M2 gradients, with Transformer Engine's
      # delayed scaling (fp8_recipe and the amax settings keep trainer_base.yaml's
      # defaults). On MI300X/MI325X these are the FNUZ variants, the formats
      # MaxText's nanoo_fp8 uses.
      fp8: hybrid

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: false
      tokenizer_type: Llama2Tokenizer
      tokenizer_model: ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/tokenizer
      train_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/train_text_document
      valid_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/valid_text_document
      test_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/valid_text_document
      data_cache_path: ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/cache
      # split must stay null: it is incompatible with explicit per-split paths.
      split: null
      dataloader_type: single
      num_workers: 8

      # validation loss every 100 iterations over 10 x 128 x 4096 = 5.2M tokens
      eval_interval: 100
      eval_iters: 10

      # ckpt
      finetune: false
      load: null
      save: null
      save_interval: 20000
      disable_last_saving: true
      ckpt_format: torch

      # Turbo
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_grouped_gemm: true
