work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama2_7B-convergence}
workspace: ${PRIMUS_WORKSPACE:./output}

# Llama-2-7B BF16 convergence test, tokenised with the Llama-2 32k vocab.
#
#   tools/convergence_test/run_convergence_test.sh --model megatron/llama2_7B
#   tools/convergence_test/run_convergence_test.sh --model megatron/llama2_7B --source c4
#
# 1000 iters x 128 x 4096 = 524M tokens, lr 1.5e-4 cosine to 1.5e-5 after 100
# warmup iterations. Same schedule as configs/maxtext/llama2_7B.
#
# PRIMUS_CONVERGENCE_DATA is exported by run_convergence_test.sh. The default
# below matches prepare_dataset.py's own output directory for FineWeb-Edu, and
# is relative to the Primus root (the trainer always runs with that as its cwd).

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: llama2_7B.yaml
    overrides:
      # log
      disable_tensorboard: false
      # Megatron's per-iteration line is emitted at DEBUG by Primus; at INFO the
      # loss only reaches logs/.../rank-<last>/debug.log.
      stderr_sink_level: DEBUG
      log_interval: 10
      log_throughput: true
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      train_iters: 1000
      micro_batch_size: 4
      global_batch_size: 128

      seq_length: 4096
      max_position_embeddings: 4096

      # Convergence-oriented schedule. A 7B model at a 0.5M-token batch takes a
      # lower peak than the 1B recipe's 3e-4.
      lr: 1.5e-4
      min_lr: 1.5e-5
      lr_warmup_iters: 100
      lr_decay_iters: 1000
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      clip_grad: 1.0
      eod_mask_loss: true
      # As in the llama2_7B example and the Mixtral recipe. The untied output
      # layer's random logits have std init_method_std * sqrt(hidden_size), which
      # lifts the step-1 loss above ln(vocab) = 10.37 by about half its square:
      # 0.02 starts at 11.2, 0.008 near 10.5.
      init_method_std: 0.008

      # parallel
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: false
      tokenizer_type: Llama2Tokenizer
      tokenizer_model: ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/tokenizer
      train_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/train_text_document
      valid_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/valid_text_document
      test_data_path:
        - ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/valid_text_document
      data_cache_path: ${PRIMUS_CONVERGENCE_DATA:./data/convergence/fineweb-edu-llama-2-7b-hf}/cache
      # split must stay null: it is incompatible with explicit per-split paths.
      split: null
      dataloader_type: single
      num_workers: 8

      # validation loss every 100 iterations over 10 x 128 x 4096 = 5.2M tokens
      eval_interval: 100
      eval_iters: 10

      # ckpt
      finetune: false
      load: null
      save: null
      save_interval: 20000
      disable_last_saving: true
      ckpt_format: torch

      # Turbo
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_grouped_gemm: true
